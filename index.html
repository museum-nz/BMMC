<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMMC Hub</title>
  
  <!-- Museum Tab Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Instant Theme Initializer (Defaults to Light Mode on First Start) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('bMMC_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Light Mode Palette (Default) */
    :root {
      --bg: #f8fafc;
      --grid-color: rgba(0, 0, 0, 0.04);
      --header-bg: rgba(255, 255, 255, 0.88);
      --header-border: rgba(226, 232, 240, 0.8);
      --text: #0f172a;
      --muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.86);
      --card-border: rgba(226, 232, 240, 0.9);
      --card-hover-bg: #ffffff;
      --card-hover-border: rgba(2, 132, 199, 0.5);
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      --icon-bg: rgba(15, 23, 42, 0.05);
      --filter-bg: rgba(0, 0, 0, 0.04);
      --filter-border: rgba(0, 0, 0, 0.08);
      --filter-active: rgba(2, 132, 199, 0.12);
      --filter-active-text: #0284c7;
      --search-bg: rgba(255, 255, 255, 0.95);
      --search-border: rgba(203, 213, 225, 0.8);
      --reactor-bg: radial-gradient(circle at 45% 45%, #ffffff, #e2e8f0 85%);
      --reactor-border: rgba(2, 132, 199, 0.4);
      --reactor-shadow: 0 10px 40px rgba(2, 132, 199, 0.15), inset 0 0 20px rgba(2, 132, 199, 0.08);
      --gyro-1: rgba(2, 132, 199, 0.35);
      --gyro-2: rgba(100, 116, 139, 0.25);
      --cyan: #0284c7;
      --emerald: #059669;
      --amber: #d97706;
      --pulse-glow: rgba(2, 132, 199, 0.4);
      --mote-color: rgba(2, 132, 199, 0.35);
    }

    /* Dark Mode Palette */
    html.dark {
      --bg: #050814;
      --grid-color: rgba(255, 255, 255, 0.02);
      --header-bg: rgba(5, 8, 20, 0.88);
      --header-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover-bg: rgba(30, 41, 59, 0.95);
      --card-hover-border: rgba(255, 255, 255, 0.3);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      --icon-bg: rgba(255, 255, 255, 0.06);
      --filter-bg: rgba(255, 255, 255, 0.04);
      --filter-border: rgba(255, 255, 255, 0.08);
      --filter-active: rgba(255, 255, 255, 0.16);
      --filter-active-text: #ffffff;
      --search-bg: rgba(15, 23, 42, 0.8);
      --search-border: rgba(255, 255, 255, 0.12);
      --reactor-bg: radial-gradient(circle at 45% 45%, #1e293b, #090e1a 80%);
      --reactor-border: rgba(56, 189, 248, 0.6);
      --reactor-shadow: 0 0 50px rgba(56, 189, 248, 0.25), inset 0 0 25px rgba(56, 189, 248, 0.2);
      --gyro-1: rgba(56, 189, 248, 0.3);
      --gyro-2: rgba(255, 255, 255, 0.18);
      --cyan: #38bdf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --pulse-glow: rgba(56, 189, 248, 0.8);
      --mote-color: rgba(56, 189, 248, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.3s ease;
    }

    /* Fixed Sky & Horizon Layer */
    #timeSkyBackground {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes skyCycleLight {
      0% { background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 45%, #fed7aa 100%); }
      33% { background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #fef3c7 100%); }
      66% { background: linear-gradient(180deg, #e0e7ff 0%, #f1f5f9 55%, #fed7aa 100%); }
      100% { background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 45%, #fed7aa 100%); }
    }

    @keyframes skyCycleDark {
      0% { background: linear-gradient(180deg, #020617 0%, #0f172a 50%, #1e1b4b 100%); }
      33% { background: linear-gradient(180deg, #030712 0%, #111827 50%, #172554 100%); }
      66% { background: linear-gradient(180deg, #090d16 0%, #0f172a 55%, #1e1b4b 100%); }
      100% { background: linear-gradient(180deg, #020617 0%, #0f172a 50%, #1e1b4b 100%); }
    }

    .time-sky-animated {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      animation: skyCycleLight 22s ease-in-out infinite;
    }

    html.dark .time-sky-animated {
      animation: skyCycleDark 22s ease-in-out infinite;
    }

    #motesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .horizon-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      line-height: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.88;
    }

    html.dark .horizon-silhouette { opacity: 0.95; }
    .horizon-silhouette img { width: 100%; height: auto; display: block; }

    .radar-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
    }

    /* Top Navigation HUD */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--header-border);
      transition: background 0.3s, border-color 0.3s;
    }

    .brand-section { display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: grid; place-items: center; font-size: 18px;
      box-shadow: 0 0 16px rgba(2, 132, 199, 0.4);
    }
    .brand-title { 
      font-family: 'Space Grotesk', sans-serif; 
      font-weight: 800; 
      font-size: 1.15rem; 
      letter-spacing: -0.01em; 
      color: var(--text);
    }

    .menu-trigger-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--filter-border);
      background: var(--filter-bg); color: var(--text);
      font-size: 0.76rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .menu-trigger-btn:hover { background: var(--card-hover-bg); border-color: var(--cyan); }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-bar {
      display: flex; align-items: center; gap: 6px;
      background: var(--filter-bg); padding: 3px; border-radius: 100px;
      border: 1px solid var(--filter-border);
    }

    .filter-btn {
      background: transparent; border: none; color: var(--muted);
      font-size: 0.74rem; font-weight: 700; padding: 5px 13px;
      border-radius: 100px; cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--text); background: rgba(125, 125, 125, 0.1); }
    .filter-btn.active { 
      color: var(--filter-active-text); 
      background: var(--filter-active); 
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.15); 
    }

    .surprise-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 100px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(239, 68, 68, 0.12));
      color: var(--amber);
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
    }
    .surprise-btn:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(239, 68, 68, 0.25));
      border-color: var(--amber);
      transform: scale(1.05);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
    }
    .surprise-btn.rolling {
      animation: pulseRoll 0.2s infinite alternate;
      border-color: #fff;
    }
    @keyframes pulseRoll {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.08); filter: brightness(1.3); }
    }

    .search-box { position: relative; display: flex; align-items: center; }
    .search-box input {
      background: var(--search-bg); border: 1px solid var(--search-border);
      border-radius: 100px; padding: 6px 14px 6px 32px;
      color: var(--text); font-size: 0.78rem; width: 180px; transition: all 0.25s;
    }
    .search-box input:focus { outline: none; width: 230px; border-color: var(--cyan); box-shadow: 0 0 16px var(--pulse-glow); }
    .search-icon { position: absolute; left: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }

    /* Interactive Stage */
    .stage-container {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 57px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 60px;
      z-index: 10;
    }

    #spokeConduits {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    .laser-line { 
      fill: none; 
      stroke-linecap: round; 
      transition: stroke 0.25s, opacity 0.4s ease, filter 0.4s ease, stroke-width 0.25s; 
    }
    @keyframes flowLaser { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }

    .laser-line.pulse-0 { stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 6 6; animation: flowLaser 1.4s linear infinite; filter: drop-shadow(0 0 6px var(--pulse-glow)); }
    .laser-line.pulse-1 { stroke: var(--emerald); stroke-width: 2; stroke-dasharray: 6 6; animation: flowLaser 1.4s linear infinite; filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6)); }
    .laser-line.pulse-2 { stroke: var(--amber); stroke-width: 2; stroke-dasharray: 6 6; animation: flowLaser 1.4s linear infinite; filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6)); }

    /* Active Conduit Lightning Surge */
    .laser-line.laser-lightning {
      stroke: #ffffff !important;
      stroke-width: 3.5px !important;
      stroke-dasharray: none !important;
      opacity: 1 !important;
      filter: drop-shadow(0 0 10px var(--cyan)) drop-shadow(0 0 20px #fff) !important;
    }

    /* Blurred & Receded Conduits for Non-Selected Wings */
    .laser-line.conduit-receded {
      opacity: 0.05 !important;
      filter: blur(3px) grayscale(85%) !important;
      stroke-width: 1.2px !important;
    }

    .laser-line.conduit-spotlighted {
      opacity: 1 !important;
      filter: drop-shadow(0 0 8px var(--pulse-glow)) !important;
      stroke-width: 2.5px !important;
    }

    .spider-network {
      position: relative; width: 100%; max-width: 1440px;
      display: grid; grid-template-columns: 1.15fr auto 1.15fr;
      align-items: center; gap: 32px; z-index: 5;
    }

    .network-flank { display: flex; flex-direction: column; gap: 16px; min-width: 280px; }
    
    /* Interactive Spotlight Zoom & Receding Transitions */
    .wing-cluster { 
      display: flex; flex-direction: column; gap: 7px; 
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, filter 0.4s ease;
    }
    .wing-cluster.spotlighted {
      transform: scale(1.04);
      opacity: 1 !important;
      filter: none !important;
      z-index: 25;
    }
    .wing-cluster.receded {
      opacity: 0.14 !important;
      filter: blur(2.5px) grayscale(60%) !important;
      transform: scale(0.92);
      pointer-events: none;
    }

    .wing-hub {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1.5px solid var(--card-border); border-radius: 12px;
      padding: 9px 14px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; box-shadow: var(--card-shadow); transition: all 0.25s;
    }
    .wing-hub:hover { transform: translateY(-2px); border-color: var(--card-hover-border); }

    .wing-hub[data-color="0"] { border-left: 4px solid var(--cyan); }
    .wing-hub[data-color="1"] { border-left: 4px solid var(--emerald); }
    .wing-hub[data-color="2"] { border-left: 4px solid var(--amber); }

    .wing-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .wing-tag { font-size: 0.65rem; font-family: 'JetBrains Mono', monospace; padding: 2px 6px; border-radius: 5px; background: var(--filter-bg); color: var(--muted); }

    /* Spoke Cards */
    .spoke-cards { display: flex; flex-direction: column; gap: 7px; padding-left: 12px; }
    
    .spoke-card {
      display: flex; flex-direction: column;
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 8px 12px; transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--card-shadow);
      cursor: pointer;
    }

    .spoke-card:hover {
      transform: translateX(4px) scale(1.02);
      border-color: var(--card-hover-border);
      background: var(--card-hover-bg);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.2);
    }
    
    .spoke-card.matched, .spoke-card.roulette-active {
      border-color: #fff !important;
      transform: scale(1.04) !important;
      box-shadow: 0 0 24px var(--amber), 0 0 10px #fff !important;
      background: var(--card-hover-bg) !important;
    }

    .spoke-card.dimmed { opacity: 0.12; pointer-events: none; }

    .card-main-link { text-decoration: none; color: inherit; display: block; }
    
    .card-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .card-icon {
      font-size: 15px; width: 26px; height: 26px; border-radius: 6px;
      background: var(--icon-bg); display: grid; place-items: center; flex-shrink: 0;
    }
    
    .card-label {
      font-size: 0.82rem; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.2s;
    }
    .spoke-card:hover .card-label { color: var(--cyan); }

    .card-desc {
      font-size: 0.7rem; color: var(--muted); line-height: 1.25;
      margin-top: 3px; margin-left: 34px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Sub-Satellite Link */
    .sub-satellite {
      margin-top: 5px; padding-top: 5px;
      border-top: 1px dashed var(--card-border);
    }
    .sub-satellite-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; color: var(--emerald);
      text-decoration: none; padding: 3px 8px; border-radius: 5px;
      background: rgba(16, 185, 129, 0.1); transition: all 0.2s;
    }
    .sub-satellite-link:hover { background: rgba(16, 185, 129, 0.22); transform: translateX(3px); }

    /* Center Nexus Reactor */
    .network-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
    .nexus-reactor {
      position: relative; width: 190px; height: 190px; border-radius: 50%;
      background: var(--reactor-bg);
      border: 2px solid var(--reactor-border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: var(--reactor-shadow);
      cursor: pointer; transition: all 0.35s;
    }
    .nexus-reactor:hover { transform: scale(1.06); border-color: var(--cyan); }

    .gyro-ring { position: absolute; border-radius: 50%; pointer-events: none; }
    .gyro-1 { width: 226px; height: 226px; border: 1px dashed var(--gyro-1); animation: spinRings 24s linear infinite; }
    .gyro-2 { width: 254px; height: 254px; border: 1px dotted var(--gyro-2); animation: spinRingsCounter 36s linear infinite; }
    @keyframes spinRings { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinRingsCounter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

    .core-icon { font-size: 34px; }
    .core-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; font-weight: 800; margin-top: 3px; color: var(--text); }
    .core-desc { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--cyan); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }

    @media (max-width: 1100px) {
      .spider-network { grid-template-columns: 1fr; gap: 32px; }
      .network-center { order: -1; }
      #spokeConduits { display: none; }
      .filter-bar { overflow-x: auto; }
    }
  </style>
</head>
<body>

  <!-- Fixed Background Container (Behind everything) -->
  <div id="timeSkyBackground" aria-hidden="true">
    <div class="time-sky-animated"></div>
    <canvas id="motesCanvas"></canvas>
    <div class="horizon-silhouette">
      <img src="background.webp" alt="" loading="eager" />
    </div>
  </div>

  <div class="radar-grid"></div>

  <!-- Top Navigation HUD -->
  <header>
    <div class="brand-section">
      <a href="index.html" class="brand">
        <div class="brand-icon">🏛️</div>
        <div class="brand-title">BMMC Hub</div>
      </a>
      <button class="menu-trigger-btn btn-bmmc-menu-trigger" id="btnMenuToggle" aria-label="Open directory drawer">
        <span>☰</span> <span>Menu</span>
      </button>
    </div>

    <!-- Dynamic Actions & Filter Bar -->
    <div class="hud-actions">
      <div class="filter-bar" id="filterBarContainer">
        <button class="filter-btn active" data-target="all">All Wings</button>
      </div>

      <!-- Surprise Roulette Button -->
      <button class="surprise-btn" id="btnSurprise" title="Surprise Me (Artifact Roulette)">
        <span>🎲</span> <span>Surprise</span>
      </button>
    </div>

    <!-- Live Search -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="targetSearch" placeholder="Search wings... (/)" />
    </div>
  </header>

  <!-- Interactive Constellation Stage -->
  <main class="stage-container" id="stageContainer">
    <svg id="spokeConduits"></svg>

    <div class="spider-network">
      <div class="network-flank" id="leftFlank"></div>

      <!-- Center Nexus -->
      <div class="network-center">
        <div class="nexus-reactor" id="nexusCore" title="Click to launch Surprise Roulette!">
          <div class="gyro-ring gyro-1"></div>
          <div class="gyro-ring gyro-2"></div>
          <div class="core-icon">🏛️</div>
          <div class="core-title">BMMC</div>
          <div class="core-desc">Surprise / Core</div>
        </div>
      </div>

      <div class="network-flank" id="rightFlank"></div>
    </div>
  </main>

  <!-- Load Navigation Script (Dynamic Source of Truth) -->
  <script src="shared-nav.js"></script>

  <script>
    (function() {
      'use strict';

      // ==========================================
      // Built-in Failsafe Directory Data
      // Ensures the wings ALWAYS render even if shared-nav.js is missing/cached
      // ==========================================
      const DEFAULT_BRANCHES = [
        {
          group: "Primary Museum Wings",
          items: [
            { href: 'museum.html', icon: '🏛️', label: 'Museum Showcase & Catalog', desc: 'Main artifact exhibition, 3D models & gramophones' },
            { href: 'museum.html#stats', icon: '📊', label: 'Museum Insights & Analytics', desc: 'Chronological charts & artifact distribution' },
            { href: '2Dmap.html', icon: '🌍', label: 'Museum Artifact Origin Map', desc: 'Global manufacturing locations & timeline' },
            { href: 'restoration-guide.html', icon: '🛠️', label: 'Artifact Care & Restoration', desc: 'Workshop guide for metals, timber, leather & finishes' }
          ]
        },
        {
          group: "Specialist Databases & Archives",
          items: [
            { href: 'gallery.html', icon: '📷', label: 'Historical Photo Archives', desc: 'Historic photography & Alan Starling WWII oral history' },
            { href: 'currency.html', icon: '🪙', label: 'NZ Currency & Minting', desc: '1933–2026 coins, banknotes & RBNZ Table F3 metrics' },
            { 
              href: 'stamps.html', 
              icon: '📮', 
              label: 'NZ Stamp Archive (StampsNZ)', 
              desc: 'Comprehensive philatelic catalog & valuations',
              children: [
                { href: '2Dmap_stamps.html', icon: '🗺️', label: 'Philatelic Photo Map', desc: 'Geographic 2D map of NZ stamps by issue location' }
              ]
            }
          ]
        },
        {
          group: "NZ Historical Info Maps",
          items: [
            { href: 'nz_history.html', icon: '📜', label: 'Aotearoa NZ History Map', desc: 'Interactive colonial timeline, ships & battles' },
            { href: 'trains.html', icon: '🚂', label: 'Aotearoa NZ Railway Map', desc: 'Interactive rail history, steam pioneers, historic railways, disasters & KiwiRail' },
            { href: 'maritime.html', icon: '⚓', label: 'Aotearoa NZ Maritime & Coastal Map', desc: 'Mosquito Fleet, early arrivals, shipwrecks, whaling & lighthouses' }
          ]
        }
      ];

      // Use shared-nav.js if available, otherwise fall back immediately
      const branches = (window.BMMC_BRANCHES && Array.isArray(window.BMMC_BRANCHES) && window.BMMC_BRANCHES.length > 0)
        ? window.BMMC_BRANCHES
        : DEFAULT_BRANCHES;

      // ==========================================
      // Ambient Floating Motes Canvas
      // ==========================================
      const motesCanvas = document.getElementById('motesCanvas');
      const mCtx = motesCanvas ? motesCanvas.getContext('2d') : null;
      let motes = [];

      if (mCtx) {
        function resizeMotes() {
          motesCanvas.width = window.innerWidth;
          motesCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeMotes);
        resizeMotes();

        for (let i = 0; i < 35; i++) {
          motes.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 2 + 0.8,
            dx: (Math.random() - 0.5) * 0.4,
            dy: -(Math.random() * 0.4 + 0.2),
            alpha: Math.random() * 0.5 + 0.2
          });
        }

        function drawMotes() {
          mCtx.clearRect(0, 0, motesCanvas.width, motesCanvas.height);
          const isDark = document.documentElement.classList.contains('dark');

          motes.forEach(m => {
            m.x += m.dx;
            m.y += m.dy;
            if (m.y < -10) { m.y = motesCanvas.height + 10; m.x = Math.random() * motesCanvas.width; }
            if (m.x < -10) m.x = motesCanvas.width + 10;
            if (m.x > motesCanvas.width + 10) m.x = -10;

            mCtx.beginPath();
            mCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
            mCtx.fillStyle = (isDark ? 'rgba(56, 189, 248, ' : 'rgba(2, 132, 199, ') + m.alpha + ')';
            mCtx.fill();
          });
          requestAnimationFrame(drawMotes);
        }
        requestAnimationFrame(drawMotes);
      }

      // ==========================================
      // Dynamic Constellation Engine
      // ==========================================
      const leftFlank = document.getElementById('leftFlank');
      const rightFlank = document.getElementById('rightFlank');
      const filterBar = document.getElementById('filterBarContainer');
      const svg = document.getElementById('spokeConduits');
      const core = document.getElementById('nexusCore');
      const stage = document.getElementById('stageContainer');
      const searchInput = document.getElementById('targetSearch');
      const btnSurprise = document.getElementById('btnSurprise');

      branches.forEach((branch, index) => {
        const wingId = `wing-cluster-${index}`;
        const colorIdx = index % 3;

        // Filter Button
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.setAttribute('data-target', wingId);
        btn.textContent = `${branch.group} (${branch.items.length})`;
        filterBar.appendChild(btn);

        // Wing Container
        const cluster = document.createElement('div');
        cluster.className = 'wing-cluster';
        cluster.id = wingId;
        cluster.setAttribute('data-wing-index', index);

        let itemsHTML = '';
        branch.items.forEach((item, cardIdx) => {
          const hasChildren = Array.isArray(item.children) && item.children.length > 0;
          
          itemsHTML += `
            <div class="spoke-card" id="card-${index}-${cardIdx}" data-wing="${index}" data-card="${cardIdx}" data-tags="${(item.label + ' ' + (item.desc || '') + ' ' + item.href).toLowerCase()}">
              <a href="${item.href}" class="card-main-link">
                <div class="card-header-row">
                  <div class="card-meta">
                    <div class="card-icon">${item.icon || '📁'}</div>
                    <div class="card-label">${item.label}</div>
                  </div>
                </div>
                ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
              </a>

              ${hasChildren ? `
                <div class="sub-satellite">
                  ${item.children.map(ch => `
                    <a href="${ch.href}" class="sub-satellite-link">
                      <span>${ch.icon || '🗺️'}</span>
                      <span>${ch.label}</span>
                      <span style="opacity:0.75; margin-left:3px; font-family:'JetBrains Mono',monospace;">→</span>
                    </a>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `;
        });

        cluster.innerHTML = `
          <div class="wing-hub" data-color="${colorIdx}" id="hub-node-${index}">
            <div class="wing-title">${branch.group}</div>
            <span class="wing-tag">${branch.items.length} Exhibits</span>
          </div>
          <div class="spoke-cards">${itemsHTML}</div>
        `;

        if (index === 0) leftFlank.appendChild(cluster);
        else rightFlank.appendChild(cluster);
      });

      // Conduit Curves Generator
      function createCurve(elemA, elemB, pulseClass, conduitId) {
        if (!elemA || !elemB) return document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const rA = elemA.getBoundingClientRect();
        const rB = elemB.getBoundingClientRect();
        const sR = stage.getBoundingClientRect();

        const x1 = (rA.left + rA.width / 2) - sR.left;
        const y1 = (rA.top + rA.height / 2) - sR.top;
        const x2 = (rB.left + rB.width / 2) - sR.left;
        const y2 = (rB.top + rB.height / 2) - sR.top;

        const deltaX = (x2 - x1) * 0.45;
        const d = `M ${x1} ${y1} C ${x1 + deltaX} ${y1}, ${x2 - deltaX} ${y2}, ${x2} ${y2}`;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', `laser-line ${pulseClass}`);
        if (conduitId) path.id = conduitId;
        return path;
      }

      // Redraw conduits with matched blur and recede states
      function drawConduits() {
        if (!svg || window.innerWidth <= 1100) {
          if (svg) svg.innerHTML = '';
          return;
        }

        svg.innerHTML = '';
        const clusters = document.querySelectorAll('.wing-cluster');

        clusters.forEach((cluster, idx) => {
          const isReceded = cluster.classList.contains('receded');
          const isSpotlighted = cluster.classList.contains('spotlighted');
          const hub = cluster.querySelector('.wing-hub');
          const pulseClass = `pulse-${idx % 3}`;

          // Conduits match the blurred/receded state of the wing
          let stateClass = '';
          if (isReceded) stateClass = 'conduit-receded';
          else if (isSpotlighted) stateClass = 'conduit-spotlighted';

          // Core -> Wing Hub
          const corePath = createCurve(core, hub, `${pulseClass} ${stateClass}`, `conduit-core-${idx}`);
          svg.appendChild(corePath);

          // Wing Hub -> Cards
          const cards = cluster.querySelectorAll('.spoke-card');
          cards.forEach((card, cIdx) => {
            const cardPath = createCurve(hub, card, `${pulseClass} ${stateClass}`, `conduit-card-${idx}-${cIdx}`);
            cardPath.style.opacity = isReceded ? '0.05' : (isSpotlighted ? '0.65' : '0.35');
            svg.appendChild(cardPath);
          });
        });
      }

      // Active Conduit Lightning on Hover
      document.querySelectorAll('.spoke-card').forEach(card => {
        card.addEventListener('mouseenter', () => {
          const wIdx = card.getAttribute('data-wing');
          const cIdx = card.getAttribute('data-card');
          const coreLine = document.getElementById(`conduit-core-${wIdx}`);
          const cardLine = document.getElementById(`conduit-card-${wIdx}-${cIdx}`);

          if (coreLine) coreLine.classList.add('laser-lightning');
          if (cardLine) cardLine.classList.add('laser-lightning');
        });

        card.addEventListener('mouseleave', () => {
          const wIdx = card.getAttribute('data-wing');
          const cIdx = card.getAttribute('data-card');
          const coreLine = document.getElementById(`conduit-core-${wIdx}`);
          const cardLine = document.getElementById(`conduit-card-${wIdx}-${cIdx}`);

          if (coreLine) coreLine.classList.remove('laser-lightning');
          if (cardLine) cardLine.classList.remove('laser-lightning');
        });
      });

      // Interactive Spotlight Zoom Filter (Wings + Conduits Blur Together)
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const target = btn.getAttribute('data-target');
          document.querySelectorAll('.wing-cluster').forEach(cluster => {
            if (target === 'all') {
              cluster.classList.remove('receded', 'spotlighted');
            } else if (cluster.id === target) {
              cluster.classList.remove('receded');
              cluster.classList.add('spotlighted');
            } else {
              cluster.classList.add('receded');
              cluster.classList.remove('spotlighted');
            }
          });
          
          drawConduits();
        });
      });

      // Quick Hub Click
      document.querySelectorAll('.wing-hub').forEach((hub, idx) => {
        hub.addEventListener('click', () => {
          const btn = document.querySelector(`.filter-btn[data-target="wing-cluster-${idx}"]`);
          if (btn) btn.click();
        });
      });

      // Surprise Roulette Launcher
      let isRolling = false;
      function triggerRoulette() {
        if (isRolling) return;
        isRolling = true;
        btnSurprise.classList.add('rolling');

        // Reset any spotlight filters
        const allBtn = document.querySelector('.filter-btn[data-target="all"]');
        if (allBtn) allBtn.click();

        const allCards = Array.from(document.querySelectorAll('.spoke-card'));
        let step = 0;
        const totalSteps = 16;
        let delay = 60;
        let lastSelected = null;

        function rollStep() {
          if (lastSelected) lastSelected.classList.remove('roulette-active');
          const randCard = allCards[Math.floor(Math.random() * allCards.length)];
          randCard.classList.add('roulette-active');
          lastSelected = randCard;

          step++;
          if (step < totalSteps) {
            delay += 18;
            setTimeout(rollStep, delay);
          } else {
            // Winner locked
            btnSurprise.classList.remove('rolling');
            isRolling = false;
            if (typeof window.showBMMCToast === 'function') {
              window.showBMMCToast('✨ Opening Surprise Exhibit...', '🎲');
            }
            setTimeout(() => {
              const url = randCard.querySelector('a').getAttribute('href');
              if (url) window.location.href = url;
            }, 550);
          }
        }
        rollStep();
      }

      if (btnSurprise) btnSurprise.addEventListener('click', triggerRoulette);
      if (core) core.addEventListener('click', triggerRoulette);

      // Search Filter
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase().trim();
          const cards = document.querySelectorAll('.spoke-card');
          const clusters = document.querySelectorAll('.wing-cluster');

          if (!q) {
            cards.forEach(c => c.classList.remove('matched', 'dimmed'));
            clusters.forEach(cl => cl.classList.remove('dimmed'));
          } else {
            cards.forEach(card => {
              const tags = (card.getAttribute('data-tags') + ' ' + card.innerText).toLowerCase();
              if (tags.includes(q)) {
                card.classList.add('matched');
                card.classList.remove('dimmed');
              } else {
                card.classList.add('dimmed');
                card.classList.remove('matched');
              }
            });

            clusters.forEach(cluster => {
              const hasMatch = cluster.querySelectorAll('.spoke-card.matched').length > 0;
              if (hasMatch) cluster.classList.remove('dimmed');
              else cluster.classList.add('dimmed');
            });
          }
          setTimeout(drawConduits, 40);
        });
      }

      // Hotkeys
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          if (searchInput) searchInput.focus();
        }
        if (e.key === 'Escape') {
          if (searchInput) {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.blur();
          }
        }
        if (e.key === ' ' && document.activeElement !== searchInput) {
          e.preventDefault();
          triggerRoulette();
        }
      });

      window.addEventListener('resize', drawConduits);
      window.addEventListener('load', drawConduits);
      setTimeout(drawConduits, 100);
      setTimeout(drawConduits, 500);
    })();
  </script>
</body>
</html>
