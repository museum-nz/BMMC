<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa NZ History &amp; Colonization Map — BMMC</title>

  <!-- Instant Theme Sync -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('bMMC_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect for Tile & CDN Performance -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Inline Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">

  <!-- Leaflet & Plugins CSS with CDN Fallbacks -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.Default.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css';" />

  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="offline-adapter.js" onerror="this.onerror=null;"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #aad3df;
      z-index: 1;
    }

    /* Top-Right Zoom Controls */
    .leaflet-top.leaflet-right .leaflet-control-zoom {
      margin-top: 96px;
      margin-right: 16px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .leaflet-control-zoom a {
      background-color: rgba(255, 255, 255, 0.94) !important;
      color: #0f172a !important;
      border-color: rgba(203, 213, 225, 0.8) !important;
      transition: all 0.15s ease !important;
    }
    .leaflet-control-zoom a:hover {
      background-color: #ffffff !important;
      color: #0284c7 !important;
    }
    .dark .leaflet-top.leaflet-right .leaflet-control-zoom {
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .dark .leaflet-control-zoom a {
      background-color: rgba(15, 23, 42, 0.94) !important;
      color: #f8fafc !important;
      border-color: rgba(51, 65, 85, 0.8) !important;
    }
    .dark .leaflet-control-zoom a:hover {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
    }

    /* Top Floating Controls Wrapper */
    .top-controls-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .top-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .top-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .top-action-btn:hover {
      background: #ffffff;
      border-color: #0284c7;
      color: #0284c7;
      transform: translateY(-1px);
    }
    .dark .top-action-btn {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .dark .top-action-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .museum-pill-btn {
      margin-left: auto !important;
      background: #0284c7 !important;
      border-color: #38bdf8 !important;
      color: #ffffff !important;
    }
    .museum-pill-btn:hover {
      background: #0369a1 !important;
      color: #ffffff !important;
    }

    /* Search Box */
    .map-search-box {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      min-width: 170px;
      max-width: 260px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      padding: 0 10px;
    }
    .dark .map-search-box {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .map-search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      padding-left: 6px;
    }
    .dark .map-search-box input { color: #f8fafc; }
    .search-icon { font-size: 13px; color: #64748b; flex-shrink: 0; }
    .clear-search-btn {
      display: none;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dark .clear-search-btn { background: #334155; color: #cbd5e1; }

    /* Layers Switcher */
    .layer-switcher-container { position: relative; display: inline-block; }
    .layer-dropdown-card {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 270px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 8px;
      z-index: 2000;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .layer-dropdown-card.show { display: grid; }
    .dark .layer-dropdown-card {
      background: rgba(15, 23, 42, 0.96);
      border-color: #334155;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .layer-option-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: #f8fafc;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dark .layer-option-btn { background: #1e293b; color: #cbd5e1; }
    .layer-option-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .dark .layer-option-btn.active {
      background: #082f49;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Era Bar */
    .era-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
      max-width: 100%;
      scrollbar-width: none;
    }
    .era-bar::-webkit-scrollbar { display: none; }
    .era-chip {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .era-chip:hover, .era-chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* Floating Timeline Slider at Bottom Left */
    .year-slider-container {
      position: absolute;
      bottom: 24px;
      left: 20px;
      transform: none;
      width: calc(100% - 40px);
      max-width: 440px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      z-index: 1000;
      pointer-events: auto;
    }
    .dark .year-slider-container {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .year-slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .timeline-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
    }
    .dark .timeline-title-group { color: #f8fafc; }
    .btn-timeline-play {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(2,132,199,0.4);
    }
    .btn-timeline-play.playing { background: #ef4444; }
    .item-counter-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(2,132,199,0.12);
      color: #0284c7;
      border: 1px solid rgba(2,132,199,0.25);
    }
    .dark .item-counter-badge {
      background: rgba(56,189,248,0.15);
      color: #38bdf8;
      border-color: rgba(56,189,248,0.3);
    }
    .range-text {
      font-size: 12px;
      font-weight: 900;
      color: #0284c7;
      font-family: monospace;
    }
    .dark .range-text { color: #38bdf8; }

    .dual-slider-track-wrapper {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
    }
    .slider-track-bg {
      position: absolute;
      width: 100%;
      height: 6px;
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark .slider-track-bg { background: #334155; }
    .slider-track-fill {
      position: absolute;
      height: 6px;
      background: #0284c7;
      border-radius: 3px;
      pointer-events: none;
    }
    .dark .slider-track-fill { background: #38bdf8; }
    .dual-slider-track-wrapper input[type="range"] {
      position: absolute;
      width: 100%;
      height: 6px;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      z-index: 10;
    }
    .dual-slider-track-wrapper input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* History Pin Laddering & Cards */
    .history-div-icon { background: none !important; border: none !important; }
    .nz-history-marker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
      transition: transform 0.15s ease;
    }
    .nz-history-marker:hover {
      transform: scale(1.08);
      z-index: 100000 !important;
    }
    .marker-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      color: #ffffff;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      max-width: 210px;
      border: 1.5px solid #38bdf8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .marker-date-tag {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 900;
    }
    .marker-headline-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .marker-pin-tail {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #0f172a;
      margin-top: -1px;
    }
    .marker-stem {
      width: 2px;
      background: #0284c7;
      margin-top: -1px;
    }

    .cat-vessel .marker-pill { border-color: #38bdf8; }
    .cat-vessel .marker-date-tag { background: #0284c7; }
    .cat-war .marker-pill { border-color: #f87171; }
    .cat-war .marker-date-tag { background: #dc2626; }
    .cat-disaster .marker-pill { border-color: #fb923c; }
    .cat-disaster .marker-date-tag { background: #ea580c; }
    .cat-rights .marker-pill { border-color: #c084fc; }
    .cat-rights .marker-date-tag { background: #9333ea; }
    .cat-general .marker-pill { border-color: #4ade80; }
    .cat-general .marker-date-tag { background: #16a34a; }

    .cluster-number-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #1e3a8a);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.45);
      border: 3px solid #ffffff;
    }

    .history-card {
      width: 280px;
      text-align: left;
    }
    .history-card-img-wrap {
      display: block;
      width: 100%;
      height: 160px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      border-radius: 10px 10px 0 0;
    }
    .history-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .history-card-badge-row {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .category-pill {
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .date-pill {
      background: #0284c7;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .history-card-body {
      padding: 12px;
    }
    .history-card-body h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.3;
    }
    .history-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .history-card-desc {
      margin: 0 0 12px 0;
      font-size: 12px;
      line-height: 1.5;
      color: #334155;
    }
    .history-card-footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
    }
    .btn-google-ai {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-google-ai:hover { background: #0284c7; color: #ffffff; }
    .btn-source-archive {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-source-archive:hover { background: #e2e8f0; color: #0f172a; }

    @media (max-width: 768px) {
      .top-controls-wrapper {
        top: 10px;
        left: 10px;
        right: 10px;
      }
      .leaflet-top.leaflet-right .leaflet-control-zoom {
        margin-top: 100px;
        margin-right: 10px;
      }
      .map-search-box { min-width: 130px; }
      .year-slider-container {
        left: 12px;
        bottom: 15px;
        width: calc(100vw - 24px);
        max-width: calc(100vw - 24px);
      }
    }
  </style>
</head>
<body>

  <!-- Top Floating Controls Wrapper -->
  <div class="top-controls-wrapper">
    <div class="top-controls-bar">
      <button class="btn-bmmc-menu-trigger top-action-btn" title="Open Museum Wings Menu">
        <span style="font-size: 14px;">☰</span>
        <span>Wings</span>
      </button>

      <div class="map-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="mapSearchInput" placeholder="Search events, ships..." aria-label="Search NZ History">
        <button id="clearMapSearch" class="clear-search-btn" title="Clear Search">✕</button>
      </div>

      <!-- Basemap Switcher -->
      <div class="layer-switcher-container">
        <button id="btnLayersToggle" class="top-action-btn" title="Change Basemap">
          <span>🗺️</span> <span>Basemap</span>
        </button>
        <div id="layerDropdownCard" class="layer-dropdown-card">
          <button id="btnLayerNatGeo" class="layer-option-btn active"><span>📜</span><span>Historical</span></button>
          <button id="btnLayerTopo" class="layer-option-btn"><span>⛰️</span><span>Topo</span></button>
          <button id="btnLayerSat" class="layer-option-btn"><span>🛰️</span><span>Satellite</span></button>
          <button id="btnLayerStreet" class="layer-option-btn"><span>📍</span><span>Street</span></button>
        </div>
      </div>

      <button id="btnFitNZ" class="top-action-btn" title="Zoom to fit New Zealand">
        <span>🇳🇿</span> <span>Fit NZ</span>
      </button>
      
      <button id="btnResetView" class="top-action-btn" title="Reset View &amp; Timeline">
        <span>↺</span> <span>Reset</span>
      </button>

      <button id="btnToggleFullscreen" class="top-action-btn" title="Toggle Fullscreen Mode">
        <span id="fullscreenIcon">⛶</span>
      </button>

      <!-- Return to Museum Showcase -->
      <a href="index.html" class="top-action-btn museum-pill-btn" title="Back to Museum Showcase">
        <span>🏛️</span> <span>Museum</span>
      </a>
    </div>

    <!-- Historical Era Filter Chips -->
    <div class="era-bar">
      <button class="era-chip active" data-min="1280" data-max="2026">All History</button>
      <button class="era-chip" data-min="1280" data-max="1839">Early Contact (&lt;1840)</button>
      <button class="era-chip" data-min="1840" data-max="1855">Pioneer Ships (1840–1855)</button>
      <button class="era-chip" data-min="1855" data-max="1890">Wars &amp; Gold (1855–1890)</button>
      <button class="era-chip" data-min="1890" data-max="1945">Troops to Wars (1899–1945)</button>
      <button class="era-chip" data-min="1945" data-max="2026">Modern NZ (1945–Now)</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Bottom Timeline & Dual Slider (Bottom Left) -->
  <div class="year-slider-container">
    <div class="year-slider-header">
      <div class="timeline-title-group">
        <button id="btnPlayTimeline" class="btn-timeline-play" title="Play timeline" aria-label="Play timeline">▶</button>
        <span>Timeline</span>
        <span id="itemCountBadge" class="item-counter-badge">Loading...</span>
      </div>
      <span id="yearRangeText" class="range-text">1280 – 2026</span>
    </div>
    <div class="dual-slider-track-wrapper">
      <div class="slider-track-bg"></div>
      <div class="slider-track-fill" id="sliderTrackFill"></div>
      <input type="range" id="minYearSlider" min="1280" max="2026" value="1280" step="1" aria-label="Minimum Year Filter">
      <input type="range" id="maxYearSlider" min="1280" max="2026" value="2026" step="1" aria-label="Maximum Year Filter">
    </div>
  </div>

  <!-- Universal Navigation Drawer Script -->
  <script src="shared-nav.js"></script>

  <!-- Leaflet, MarkerCluster & PapaParse with CDN Fallbacks -->
  <script src="../vendor/leaflet/leaflet.js" onerror="this.onerror=null;"></script>
  <script>
    if (!window.L) {
      document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
    }
  </script>

  <script src="../vendor/papaparse.min.js" onerror="this.onerror=null;"></script>
  <script>
    if (!window.Papa) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"><\/script>');
    }
  </script>

  <script src="../vendor/leaflet/markercluster.js" onerror="this.onerror=null;"></script>
  <script>
    if (!window.L || !window.L.markerClusterGroup) {
      document.write('<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"><\/script>');
    }
  </script>

  <script>
    const LIVE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRa2_IODuuz5_h6b15Vc-8zHDbAR-pIBO08bE-c3SZliZhm6h_CSU9LLuStjjlfN6CYm3qksR4klwgy/pub?gid=1659493611&single=true&output=csv';
    const LOCAL_CSV_CANDIDATES = [
      './data/nz_history.csv',
      'data/nz_history.csv',
      '../data/nz_history.csv',
      './nz_history.csv',
      'nz_history.csv'
    ];
    const CACHE_STORAGE_KEY = 'bMMC_nz_history_csv_cache';

    const NZ_CENTER = [-41.2865, 174.2];
    const NZ_ZOOM = window.innerWidth < 768 ? 5 : 6;

    // Initialize Map with zoom control disabled by default so we can place it top-right
    const map = L.map('map', {
      center: NZ_CENTER,
      zoom: NZ_ZOOM,
      minZoom: 4,
      maxBounds: [[-50, 160], [-30, 185]],
      closePopupOnClick: true,
      zoomControl: false
    });

    // Add Zoom Control explicitly to Top-Right
    L.control.zoom({ position: 'topright' }).addTo(map);

    const basemaps = {
      natgeo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri &copy; National Geographic Society', maxZoom: 16 }),
      topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri &copy; Topographic Survey', maxZoom: 18 }),
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri &copy; Earthstar Geographics', maxZoom: 18 }),
      street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 })
    };
    basemaps.natgeo.addTo(map);

    function setBasemap(type) {
      Object.values(basemaps).forEach(l => map.removeLayer(l));
      basemaps[type].addTo(map);
      document.querySelectorAll('.layer-option-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btnLayer${type.charAt(0).toUpperCase() + type.slice(1)}`);
      if (activeBtn) activeBtn.classList.add('active');
      document.getElementById('layerDropdownCard')?.classList.remove('show');
    }

    const markers = L.markerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      maxClusterRadius: 35,
      iconCreateFunction: (cluster) => L.divIcon({
        html: `<div class="cluster-number-badge">${cluster.getChildCount()}</div>`,
        className: 'custom-cluster-icon',
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      })
    });
    map.addLayer(markers);

    let allEvents = [];
    let globalMinYear = 1280;
    let globalMaxYear = 2026;
    let timelineTimer = null;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function parseYearNum(val) {
      if (!val) return NaN;
      const m = String(val).match(/-?\d{3,4}/);
      return m ? parseInt(m[0], 10) : NaN;
    }

    function parseCoord(val) {
      if (val === null || val === undefined || val === '') return NaN;
      const clean = String(val).trim().replace(',', '.');
      const m = clean.match(/-?\d+(?:\.\d+)?/);
      if (!m) return NaN;
      const num = parseFloat(m[0]);
      return (isNaN(num) || num === 0) ? NaN : num;
    }

    function getThumbnailUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
        if (/=[sw]\d+/i.test(url)) return url.replace(/=[sw]\d+[^?]*/i, '=s200');
        return url.includes('?') ? url + '&sz=s200' : url + '=s200';
      }
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=s200`;
      }
      return url;
    }

    function getFullImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
        if (/=[sw]\d+/i.test(url)) return url.replace(/=[sw]\d+[^?]*/i, '=s0');
        return url;
      }
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/uc?id=${idMatch[1]}&export=view`;
      }
      return url;
    }

    function getCategoryClass(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('vessel') || c.includes('ship') || c.includes('whaling')) return 'cat-vessel';
      if (c.includes('war') || c.includes('troop') || c.includes('battle') || c.includes('musket')) return 'cat-war';
      if (c.includes('disaster') || c.includes('earthquake') || c.includes('eruption')) return 'cat-disaster';
      if (c.includes('rights') || c.includes('protest') || c.includes('treaty') || c.includes('sovereignty')) return 'cat-rights';
      return 'cat-general';
    }

    function getCategoryIcon(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('vessel') || c.includes('ship')) return '🚢';
      if (c.includes('war') || c.includes('troop') || c.includes('battle')) return '⚔️';
      if (c.includes('disaster') || c.includes('earthquake')) return '🌋';
      if (c.includes('rights') || c.includes('protest') || c.includes('suffrage')) return '✊';
      if (c.includes('treaty') || c.includes('sovereignty')) return '📜';
      return '📍';
    }

    function renderDataset(items) {
      markers.clearLayers();
      const markerList = [];
      const PROXIMITY_DEG = 0.025;
      const groups = [];

      items.forEach(ev => {
        let found = null;
        for (const grp of groups) {
          if (Math.abs(grp.lat - ev.latitude) < PROXIMITY_DEG && Math.abs(grp.lng - ev.longitude) < PROXIMITY_DEG) {
            found = grp;
            break;
          }
        }
        if (found) found.items.push(ev);
        else groups.push({ lat: ev.latitude, lng: ev.longitude, items: [ev] });
      });

      groups.forEach(grp => {
        grp.items.sort((a, b) => (a.year || 0) - (b.year || 0));

        grp.items.forEach((ev, idx) => {
          const safeYear = escapeHTML(ev.year || '');
          const safeDate = escapeHTML(ev.date || ev.year || '');
          const safeHeadline = escapeHTML(ev.headline || 'Untitled Event');
          const safeLocation = escapeHTML(ev.location || '');
          const safeCategory = escapeHTML(ev.category || 'History');
          const safeDetails = escapeHTML(ev.details || '');
          
          const rawImg = (ev.image_url || '').trim();
          const hasImage = rawImg.length > 0 && rawImg !== '#';
          const safeThumbImg = hasImage ? escapeHTML(getThumbnailUrl(rawImg)) : '';
          const safeFullImg = hasImage ? escapeHTML(getFullImageUrl(rawImg)) : '';

          const catClass = getCategoryClass(ev.category);
          const catIcon = getCategoryIcon(ev.category);

          const stemHeight = idx * 36;
          const totalIconHeight = 34 + stemHeight;

          const googleAiSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(ev.headline + ' ' + (ev.date || ev.year) + ' New Zealand history')}`;

          const markerHTML = `
            <div class="nz-history-marker ${catClass}">
              <div class="marker-pill">
                <span class="marker-date-tag">${catIcon} ${safeYear}</span>
                <span class="marker-headline-text">${safeHeadline}</span>
              </div>
              <div class="marker-pin-tail"></div>
              ${stemHeight > 0 ? `<div class="marker-stem" style="height: ${stemHeight}px;"></div>` : ''}
            </div>
          `;

          const customIcon = L.divIcon({
            html: markerHTML,
            className: 'history-div-icon',
            iconSize: [210, totalIconHeight],
            iconAnchor: [105, totalIconHeight]
          });

          const popupImageBlock = hasImage ? `
            <a href="${safeFullImg}" target="_blank" rel="noopener noreferrer" class="history-card-img-wrap" title="Click to view full image">
              <img src="${safeThumbImg}" alt="${safeHeadline}" loading="lazy" onerror="this.onerror=null; this.parentElement.style.display='none';" />
              <div class="history-card-badge-row">
                <span class="category-pill">${safeCategory}</span>
                <span class="date-pill">${safeDate}</span>
              </div>
            </a>
          ` : `
            <div style="padding: 10px 12px 0; display: flex; gap: 6px;">
              <span class="category-pill">${safeCategory}</span>
              <span class="date-pill">${safeDate}</span>
            </div>
          `;

          const popupHTML = `
            <div class="history-card">
              ${popupImageBlock}
              <div class="history-card-body">
                <h3>${safeHeadline}</h3>
                <div class="history-card-meta">
                  <span>📍</span>
                  <span>${safeLocation}</span>
                </div>
                <p class="history-card-desc">${safeDetails}</p>
                <div class="history-card-footer">
                  <a href="${googleAiSearchUrl}" target="_blank" rel="noopener noreferrer" class="btn-google-ai">
                    <span>✨</span> Ask Google AI Overview ↗
                  </a>
                  ${ev.source_url && ev.source_url !== '#' ? `
                    <a href="${ev.source_url}" target="_blank" rel="noopener noreferrer" class="btn-source-archive">
                      <span>📖</span> Historical Reference ↗
                    </a>
                  ` : ''}
                </div>
              </div>
            </div>
          `;

          const marker = L.marker([ev.latitude, ev.longitude], { icon: customIcon });
          marker.bindPopup(popupHTML, { maxWidth: 380, autoPan: true, keepInView: true });
          markerList.push(marker);
        });
      });

      markers.addLayers(markerList);
      document.getElementById('itemCountBadge').textContent = `${items.length} event${items.length === 1 ? '' : 's'}`;
    }

    function filterEvents() {
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      const fill = document.getElementById('sliderTrackFill');
      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();

      let minVal = parseInt(minSlider.value, 10);
      let maxVal = parseInt(maxSlider.value, 10);

      if (minVal > maxVal) {
        const tmp = minVal;
        minVal = maxVal;
        maxVal = tmp;
        minSlider.value = minVal;
        maxSlider.value = maxVal;
      }

      const span = (globalMaxYear - globalMinYear) || 1;
      const left = ((minVal - globalMinYear) / span) * 100;
      const right = ((maxVal - globalMinYear) / span) * 100;

      fill.style.left = left + '%';
      fill.style.width = (right - left) + '%';

      document.getElementById('yearRangeText').textContent = `${minVal} – ${maxVal}`;

      const filtered = allEvents.filter(ev => {
        const inYear = ev.year >= minVal && ev.year <= maxVal;
        if (!inYear) return false;

        if (search) {
          const hay = `${ev.headline} ${ev.location} ${ev.details} ${ev.category} ${ev.date}`.toLowerCase();
          return hay.includes(search);
        }
        return true;
      });

      renderDataset(filtered);
    }

    function toggleTimelinePlayback() {
      const btn = document.getElementById('btnPlayTimeline');
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      if (timelineTimer) {
        clearInterval(timelineTimer);
        timelineTimer = null;
        btn.textContent = '▶';
        btn.classList.remove('playing');
      } else {
        btn.textContent = '⏸';
        btn.classList.add('playing');

        minSlider.value = globalMinYear;

        let currentMax = parseInt(maxSlider.value, 10);
        if (currentMax >= globalMaxYear || currentMax < 1800) {
          maxSlider.value = 1800;
        }
        filterEvents();

        timelineTimer = setInterval(() => {
          let curr = parseInt(maxSlider.value, 10);
          if (curr >= globalMaxYear) {
            toggleTimelinePlayback();
          } else {
            maxSlider.value = Math.min(globalMaxYear, curr + 4);
            filterEvents();
          }
        }, 260);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fullscreenIcon').textContent = '🗗';
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('fullscreenIcon').textContent = '⛶';
      }
    }

    function initSliders() {
      const years = allEvents.map(e => e.year).filter(y => !isNaN(y) && y > 0);
      if (years.length === 0) return;

      globalMinYear = Math.min(...years);
      globalMaxYear = Math.max(...years);

      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      minSlider.min = globalMinYear;
      minSlider.max = globalMaxYear;
      maxSlider.min = globalMinYear;
      maxSlider.max = globalMaxYear;

      minSlider.value = globalMinYear;
      maxSlider.value = globalMaxYear;

      filterEvents();
    }

    function getCol(row, aliases) {
      for (const key of Object.keys(row)) {
        const clean = key.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        for (const alias of aliases) {
          if (clean === alias) return String(row[key] || '').trim();
        }
      }
      return '';
    }

    function parseCSVData(csvString) {
      if (!csvString || csvString.trim().length === 0) return;
      const parsed = Papa.parse(csvString, { header: true, skipEmptyLines: true });

      allEvents = (parsed.data || []).map(row => {
        let latStr = getCol(row, ['latitude', 'lat', 'latdeg', 'y']);
        let lngStr = getCol(row, ['longitude', 'lng', 'lon', 'long', 'x']);
        let yearStr = getCol(row, ['year', 'yr']);
        let dateStr = getCol(row, ['date', 'when', 'time']);

        let lat = parseCoord(latStr);
        let lng = parseCoord(lngStr);

        let parsedYear = parseYearNum(yearStr);
        if (isNaN(parsedYear) && dateStr) {
          parsedYear = parseYearNum(dateStr);
        }

        return {
          id: getCol(row, ['id', 'no', 'item']),
          year: isNaN(parsedYear) ? 0 : parsedYear,
          date: dateStr || String(parsedYear || ''),
          headline: getCol(row, ['headline', 'title', 'event', 'name']),
          category: getCol(row, ['category', 'type', 'era']) || 'General',
          location: getCol(row, ['location', 'place', 'city']),
          latitude: lat,
          longitude: lng,
          details: getCol(row, ['details', 'description', 'notes', 'summary']),
          image_url: getCol(row, ['imageurl', 'image', 'img', 'photo']),
          source_url: getCol(row, ['sourceurl', 'source', 'url', 'link']) || '#'
        };
      }).filter(e => !isNaN(e.latitude) && !isNaN(e.longitude) && e.latitude !== 0 && e.longitude !== 0);

      initSliders();
    }

    async function loadDataset() {
      let csvText = null;
      let usedCache = false;

      // 1. Try Cache
      try {
        const cachedText = localStorage.getItem(CACHE_STORAGE_KEY);
        if (cachedText && cachedText.trim().length > 50) {
          csvText = cachedText;
          usedCache = true;
          parseCSVData(csvText);
        }
      } catch (cacheErr) {}

      // 2. Try Local Candidate Paths
      if (!csvText) {
        for (const path of LOCAL_CSV_CANDIDATES) {
          try {
            const resLocal = await fetch(path);
            if (resLocal.ok) {
              const text = await resLocal.text();
              if (text && text.trim().length > 50) {
                csvText = text;
                parseCSVData(csvText);
                try { localStorage.setItem(CACHE_STORAGE_KEY, csvText); } catch (e) {}
                break;
              }
            }
          } catch (e) {}
        }
      }

      // 3. Try Remote Google Sheet
      try {
        const res = await fetch(LIVE_CSV_URL);
        if (res.ok) {
          const fetchedText = await res.text();
          if (fetchedText && fetchedText.trim().length > 50) {
            csvText = fetchedText;
            try { localStorage.setItem(CACHE_STORAGE_KEY, fetchedText); } catch (e) {}
            parseCSVData(csvText);
            return;
          }
        }
      } catch (networkErr) {
        console.warn('Live Google Sheet fetch failed:', networkErr);
      }

      if (!csvText || csvText.trim().length < 50) {
        document.getElementById('itemCountBadge').textContent = 'Offline';
        document.getElementById('yearRangeText').textContent = 'Data Offline';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('minYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('maxYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('btnPlayTimeline')?.addEventListener('click', toggleTimelinePlayback);

      document.getElementById('btnFitNZ')?.addEventListener('click', () => {
        if (markers.getLayers().length > 0) {
          map.fitBounds(markers.getBounds(), { padding: [50, 50] });
        } else {
          map.setView(NZ_CENTER, NZ_ZOOM);
        }
      });

      document.getElementById('btnResetView')?.addEventListener('click', () => {
        document.getElementById('minYearSlider').value = globalMinYear;
        document.getElementById('maxYearSlider').value = globalMaxYear;
        const searchInput = document.getElementById('mapSearchInput');
        if (searchInput) searchInput.value = '';
        document.getElementById('clearMapSearch').style.display = 'none';
        document.querySelectorAll('.era-chip').forEach(c => c.classList.toggle('active', c.dataset.min == globalMinYear));
        if (timelineTimer) toggleTimelinePlayback();
        map.setView(NZ_CENTER, NZ_ZOOM);
        filterEvents();
      });

      document.getElementById('btnToggleFullscreen')?.addEventListener('click', toggleFullscreen);

      const btnLayersToggle = document.getElementById('btnLayersToggle');
      const layerDropdownCard = document.getElementById('layerDropdownCard');
      btnLayersToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerDropdownCard?.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) {
          layerDropdownCard?.classList.remove('show');
        }
      });

      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerSat')?.addEventListener('click', () => setBasemap('sat'));
      document.getElementById('btnLayerStreet')?.addEventListener('click', () => setBasemap('street'));

      const searchInput = document.getElementById('mapSearchInput');
      const clearSearchBtn = document.getElementById('clearMapSearch');
      searchInput?.addEventListener('input', (e) => {
        clearSearchBtn.style.display = e.target.value ? 'block' : 'none';
        filterEvents();
      });
      clearSearchBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        filterEvents();
        searchInput.focus();
      });

      document.querySelectorAll('.era-chip').forEach(chip => {
        chip.addEventListener('click', function () {
          document.querySelectorAll('.era-chip').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('minYearSlider').value = this.dataset.min;
          document.getElementById('maxYearSlider').value = this.dataset.max;
          filterEvents();
        });
      });

      loadDataset();
    });
  </script>
</body>
</html>
