<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa NZ History &amp; Colonization Map — BMMC</title>

  <!-- Instant Theme Sync -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('bMMC_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect for Tile & CDN Performance -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Inline Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">

  <!-- Leaflet & Plugins CSS with CDN Fallbacks -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.Default.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css';" />

  <!-- Master Stylesheet & Offline Adapter -->
  <link rel="stylesheet" href="styles.css" onerror="this.onerror=null;">
  <script src="offline-adapter.js" onerror="this.onerror=null;"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --pill-zoom-factor: 1;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #aad3df;
      z-index: 1;
    }

    /* Top-Right Zoom Controls */
    .leaflet-top.leaflet-right .leaflet-control-zoom {
      margin-top: 62px;
      margin-right: 16px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .leaflet-control-zoom a {
      background-color: rgba(255, 255, 255, 0.94) !important;
      color: #0f172a !important;
      border-color: rgba(203, 213, 225, 0.8) !important;
      transition: all 0.15s ease !important;
    }
    .leaflet-control-zoom a:hover {
      background-color: #ffffff !important;
      color: #0284c7 !important;
    }
    .dark .leaflet-top.leaflet-right .leaflet-control-zoom {
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .dark .leaflet-control-zoom a {
      background-color: rgba(15, 23, 42, 0.94) !important;
      color: #f8fafc !important;
      border-color: rgba(51, 65, 85, 0.8) !important;
    }
    .dark .leaflet-control-zoom a:hover {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
    }

    /* Top Floating Controls Bar */
    .top-controls-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .top-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .top-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .top-action-btn:hover {
      background: #ffffff;
      border-color: #0284c7;
      color: #0284c7;
      transform: translateY(-1px);
    }
    .dark .top-action-btn {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .dark .top-action-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Search Box */
    .map-search-box {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      min-width: 170px;
      max-width: 260px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      padding: 0 10px;
    }
    .dark .map-search-box {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .map-search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      padding-left: 6px;
    }
    .dark .map-search-box input { color: #f8fafc; }
    .search-icon { font-size: 13px; color: #64748b; flex-shrink: 0; }
    .clear-search-btn {
      display: none;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dark .clear-search-btn { background: #334155; color: #cbd5e1; }

    /* Basemap Switcher */
    .layer-switcher-container { position: relative; display: inline-block; }
    .layer-dropdown-card {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 8px;
      z-index: 2000;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .layer-dropdown-card.show { display: grid; }
    .dark .layer-dropdown-card {
      background: rgba(15, 23, 42, 0.96);
      border-color: #334155;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .layer-option-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: #f8fafc;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dark .layer-option-btn { background: #1e293b; color: #cbd5e1; }
    .layer-option-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .dark .layer-option-btn.active {
      background: #082f49;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* OSM Heritage Layer Panel */
    .heritage-switcher-container { position: relative; display: inline-block; }
    .heritage-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 900;
      background: rgba(124, 58, 237, 0.12);
      color: #7c3aed;
      border: 1px solid rgba(124, 58, 237, 0.25);
    }
    .dark .heritage-count { background: rgba(167, 139, 250, 0.18); color: #c4b5fd; border-color: rgba(167, 139, 250, 0.35); }
    .heritage-card {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 300px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 10px;
      z-index: 2000;
      color: #0f172a;
      font-size: 12px;
    }
    .heritage-card.show { display: block; }
    .dark .heritage-card { background: rgba(15, 23, 42, 0.97); border-color: #334155; color: #f8fafc; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
    .heritage-card label { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
    .heritage-card input[type="checkbox"] { accent-color: #7c3aed; margin: 0; flex-shrink: 0; }
    .heritage-master { font-weight: 900; font-size: 13px; padding: 2px 2px 8px; border-bottom: 1px solid #e2e8f0; margin-bottom: 8px; }
    .dark .heritage-master { border-color: #334155; }
    .heritage-options { display: flex; flex-direction: column; gap: 6px; font-weight: 700; color: #334155; margin-bottom: 8px; }
    .dark .heritage-options { color: #cbd5e1; }
    .heritage-cat-head { display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px; color: #64748b; margin: 4px 2px 6px; }
    .heritage-cat-head button {
      background: none; border: 1px solid #cbd5e1; border-radius: 6px; padding: 1px 7px; margin-left: 4px;
      font-size: 10px; font-weight: 800; color: #475569; cursor: pointer;
    }
    .dark .heritage-cat-head button { border-color: #475569; color: #cbd5e1; }
    .heritage-cat-list { display: flex; flex-direction: column; gap: 2px; }
    .heritage-cat-row { padding: 4px 6px; border-radius: 8px; font-weight: 700; }
    .heritage-cat-row:hover { background: #f1f5f9; }
    .dark .heritage-cat-row:hover { background: #1e293b; }
    .heritage-swatch { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #ffffff; box-shadow: 0 0 0 1px rgba(15,23,42,0.25); flex-shrink: 0; }
    .heritage-cat-label { flex: 1; min-width: 0; }
    .heritage-cat-count { font-size: 10px; font-weight: 800; color: #64748b; font-family: monospace; }
    .heritage-card-foot { margin-top: 8px; padding-top: 7px; border-top: 1px solid #e2e8f0; font-size: 10px; color: #64748b; line-height: 1.4; }
    .dark .heritage-card-foot { border-color: #334155; color: #94a3b8; }
    .osm-heritage-cluster { background-color: rgba(167, 139, 250, 0.55) !important; }
    .osm-heritage-cluster div { background-color: rgba(124, 58, 237, 0.9) !important; color: #ffffff !important; }
    .heritage-popup-row { font-size: 11px; color: #475569; margin: 0 0 6px 0; line-height: 1.4; }
    .heritage-popup-row strong { color: #0f172a; }
    .heritage-inscription { font-style: italic; border-left: 3px solid #a78bfa; padding-left: 8px; }

    /* Interactive History Key / Legend */
    .legend-wrapper {
      position: absolute;
      bottom: 24px;
      right: 20px;
      z-index: 1000;
      pointer-events: auto;
    }
    .legend-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      min-width: 235px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .dark .legend-card {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }
    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 5px;
      margin-bottom: 2px;
    }
    .dark .legend-header { border-bottom-color: #334155; }
    .legend-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
    }
    .dark .legend-title { color: #94a3b8; }
    .legend-section-title {
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin: 4px 6px 0;
    }
    .legend-close-btn {
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      border-radius: 4px;
    }
    .legend-open-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }
    .dark .legend-open-pill { background: rgba(15, 23, 42, 0.94); border-color: rgba(51, 65, 85, 0.9); color: #f8fafc; }
    .legend-items { display: flex; flex-direction: column; gap: 3px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .legend-item:hover { background: rgba(2, 132, 199, 0.08); }
    .dark .legend-item { color: #e2e8f0; }
    .dark .legend-item:hover { background: rgba(56, 189, 248, 0.12); }
    .legend-item.layer-muted { opacity: 0.38; text-decoration: line-through; }
    .legend-item.legend-sub { padding-left: 16px; }
    .legend-item-label { flex: 1; }
    .legend-item-count { font-size: 10px; font-weight: 800; color: #64748b; font-family: monospace; }
    .legend-pin-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 10px;
      border: 1.5px solid;
      flex-shrink: 0;
    }
    .legend-dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #ffffff; box-shadow: 0 0 0 1px rgba(15,23,42,0.25); flex-shrink: 0; margin: 0 4.5px; }

    /* Era Bar */
    .era-bar {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 0;
      max-width: max-content;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .era-bar::-webkit-scrollbar { display: none; }
    .era-chip {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .era-chip:hover, .era-chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* Floating Timeline Slider at Bottom Left */
    .year-slider-container {
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: calc(100% - 40px);
      max-width: 440px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      z-index: 1000;
      pointer-events: auto;
    }
    .dark .year-slider-container {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .year-slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .timeline-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
    }
    .dark .timeline-title-group { color: #f8fafc; }
    .btn-timeline-play {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(2,132,199,0.4);
    }
    .btn-timeline-play.playing { background: #ef4444; }
    .item-counter-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(2,132,199,0.12);
      color: #0284c7;
      border: 1px solid rgba(2,132,199,0.25);
    }
    .dark .item-counter-badge {
      background: rgba(56,189,248,0.15);
      color: #38bdf8;
      border-color: rgba(56,189,248,0.3);
    }
    .range-text {
      font-size: 12px;
      font-weight: 900;
      color: #0284c7;
      font-family: monospace;
    }
    .dark .range-text { color: #38bdf8; }

    .dual-slider-track-wrapper {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
    }
    .slider-track-bg {
      position: absolute;
      width: 100%;
      height: 6px;
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark .slider-track-bg { background: #334155; }
    .slider-track-fill {
      position: absolute;
      height: 6px;
      background: #0284c7;
      border-radius: 3px;
      pointer-events: none;
    }
    .dark .slider-track-fill { background: #38bdf8; }
    .dual-slider-track-wrapper input[type="range"] {
      position: absolute;
      width: 100%;
      height: 6px;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      z-index: 10;
    }
    .dual-slider-track-wrapper input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* 50% Translucent Frosted Glass Marker Pills & 5% Dynamic Zoom Scaling */
    .history-div-icon { background: none !important; border: none !important; }
    .nz-history-marker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      transition: transform 0.15s ease;
    }
    .nz-history-marker:hover {
      transform: scale(1.06);
      z-index: 100000 !important;
    }

    .marker-pill {
      display: inline-flex !important;
      align-items: center !important;
      gap: calc(7px * var(--pill-zoom-factor, 1)) !important;
      background: rgba(255, 255, 255, 0.50) !important;       /* Exactly 50% transparent */
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      color: #0f172a !important;
      padding: calc(4px * var(--pill-zoom-factor, 1)) calc(8px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(12px * var(--pill-zoom-factor, 1)) !important;
      width: auto !important;
      max-width: calc(260px * var(--pill-zoom-factor, 1)) !important;
      min-height: calc(38px * var(--pill-zoom-factor, 1)) !important;
      border: 1.5px solid rgba(2, 132, 199, 0.75) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15) !important;
      overflow: hidden !important;
      user-select: none !important;
      transition: max-width 0.12s ease-out, min-height 0.12s ease-out, gap 0.12s ease-out !important;
    }
    .dark .marker-pill {
      background: rgba(15, 23, 42, 0.50) !important;         /* 50% transparent dark */
      border-color: rgba(56, 189, 248, 0.75) !important;
    }

    .marker-thumb-box {
      width: calc(34px * var(--pill-zoom-factor, 1)) !important;
      height: calc(32px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(6px * var(--pill-zoom-factor, 1)) !important;
      overflow: hidden !important;
      flex-shrink: 0 !important;
      background: rgba(226, 232, 240, 0.50) !important;
      border: 1px solid rgba(15, 23, 42, 0.15) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;

      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; Earthstar Geographics',
        maxNativeZoom: 18,
        maxZoom: 19
      }),
      street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxNativeZoom: 19,
        maxZoom: 19
      })
    };

    let userSelectedBasemap = 'natgeo';
    let isAutoSwitchedToTopo = false;
    const AUTO_SWITCH_ZOOM_THRESHOLD = 12;

    function applyLayer(type) {
      Object.values(basemaps).forEach(l => {
        if (map && map.hasLayer(l)) map.removeLayer(l);
      });
      if (map) basemaps[type].addTo(map);
    }

    function checkBasemapAutoSwitch() {
      if (!map || userSelectedBasemap !== 'natgeo') return;

      const currentZoom = map.getZoom();
      if (currentZoom > AUTO_SWITCH_ZOOM_THRESHOLD) {
        if (!isAutoSwitchedToTopo) {
          isAutoSwitchedToTopo = true;
          applyLayer('topo');
        }
      } else {
        if (isAutoSwitchedToTopo) {
          isAutoSwitchedToTopo = false;
          applyLayer('natgeo');
        }
      }
    }

    function setBasemap(type) {
      userSelectedBasemap = type;
      isAutoSwitchedToTopo = false;

      if (type === 'natgeo') {
        if (map && map.getZoom() > AUTO_SWITCH_ZOOM_THRESHOLD) {
          isAutoSwitchedToTopo = true;
          applyLayer('topo');
        } else {
          applyLayer('natgeo');
        }
      } else {
        applyLayer(type);
      }

      document.querySelectorAll('.layer-option-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btnLayer${type.charAt(0).toUpperCase() + type.slice(1)}`);
      if (activeBtn) activeBtn.classList.add('active');
      document.getElementById('layerDropdownCard')?.classList.remove('show');
    }

    // Dynamic 5% Text Scaling Per Zoom Step (1.05^delta)
    function updatePillZoomScale() {
      if (!map) return;
      const currentZoom = map.getZoom();
      const baseZoom = (typeof NZ_ZOOM !== 'undefined') ? NZ_ZOOM : 6;
      const delta = currentZoom - baseZoom;
      const factor = Math.pow(1.05, Math.max(-2, Math.min(10, delta)));
      document.documentElement.style.setProperty('--pill-zoom-factor', factor.toFixed(3));
    }

    function initMap() {
      map = L.map('map', {
        center: NZ_CENTER,
        zoom: NZ_ZOOM,
        minZoom: 4,
        maxZoom: 19,
        maxBounds: [[-50, 160], [-30, 185]],
        closePopupOnClick: true,    // Clicking outside closes open pop-up
        zoomControl: false
      });

      L.control.zoom({ position: 'topright' }).addTo(map);
      basemaps.natgeo.addTo(map);

      // Map event listeners
      map.on('click', () => { map.closePopup(); });
      map.on('zoom', updatePillZoomScale);
      map.on('zoomend', updatePillZoomScale);
      map.on('zoomend', checkBasemapAutoSwitch);
      updatePillZoomScale();

      // Standard Leaflet MarkerCluster Group (Clean halos, bold count numbers)
      markers = L.markerClusterGroup({
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: true,
        zoomToBoundsOnClick: true,
        maxClusterRadius: 45,
        spiderfyDistanceMultiplier: 1.6,
        disableClusteringAtZoom: CONSISTENT_EVENT_ZOOM
      });
      map.addLayer(markers);
    }

    // OpenStreetMap Heritage Layer
    const HERITAGE_STATE_KEY = 'bMMC_nz_history_osm_heritage';
    const HERITAGE_COLORS = {
      memorial: '#e11d48', military: '#dc2626', maori: '#a16207', maritime: '#0284c7',
      mining: '#57534e', transport: '#ea580c', religious: '#9333ea', cemetery: '#475569',
      building: '#16a34a', ruins: '#b45309', marker: '#0d9488', other: '#64748b'
    };
    const OSM_TYPE_PATH = { n: 'node', w: 'way', r: 'relation' };

    let heritageLayer = null;
    let heritageItems = [];
    let heritageCategories = [];
    let heritageRefreshTimer = null;
    let heritageState = { enabled: true, useTimeline: true, hideUndated: false, hiddenCats: [] };

    function loadHeritageState() {
      try {
        const raw = localStorage.getItem(HERITAGE_STATE_KEY);
        if (raw) heritageState = Object.assign(heritageState, JSON.parse(raw));
      } catch (e) {}
    }

    function saveHeritageState() {
      try { localStorage.setItem(HERITAGE_STATE_KEY, JSON.stringify(heritageState)); } catch (e) {}
    }

    function prettyOsmValue(val) {
      if (!val) return '';
      const s = String(val).replace(/_/g, ' ');
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function buildHeritagePopup(it) {
      const cat = heritageCategories[it.c] || { label: 'Heritage', key: 'other' };
      const typeLabel = prettyOsmValue(it.t === 'yes' ? 'Historic site' : it.t);
      const name = it.n || typeLabel || 'Heritage site';
      const yearLabel = it.y ? `${it.ya ? 'c. ' : ''}${it.y}` : 'Undated';
      const subtype = it.mem || it.st || it.arch;

      const links = [];
      const osmPath = OSM_TYPE_PATH[it.id.charAt(0)];
      if (osmPath) links.push([`https://www.openstreetmap.org/${osmPath}/${it.id.slice(1)}`, '🗺️ View on OpenStreetMap']);
      if (it.wp) {
        const m = String(it.wp).match(/^([a-z-]{2,12}):(.+)$/i);
        const lang = m ? m[1] : 'en';
        const title = m ? m[2] : it.wp;
        links.push([`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, '_'))}`, '📖 Wikipedia']);
      }
      if (it.wd && /^Q\d+$/.test(it.wd)) links.push([`https://www.wikidata.org/wiki/${it.wd}`, '🔗 Wikidata']);
      if (it.hnz && /^\d+$/.test(it.hnz)) links.push([`https://www.heritage.org.nz/list-details/${it.hnz}/`, '🏛️ Heritage NZ List #' + it.hnz]);
      if (it.web && /^https?:\/\//i.test(it.web)) links.push([it.web, '🌐 Website']);

      const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(name + ' New Zealand history')}`;

      return `
        <div class="history-card">
          <div style="padding: 10px 12px 0; display: flex; gap: 6px; flex-wrap: wrap;">
            <span class="category-pill" style="color:${HERITAGE_COLORS[cat.key] || '#38bdf8'}; background:#f8fafc; border:1px solid currentColor;">${escapeHTML(cat.label)}</span>
            <span class="date-pill" style="background:${it.y ? '#7c3aed' : '#94a3b8'};">${escapeHTML(yearLabel)}</span>
          </div>
          <div class="history-card-body">
            <h3>${escapeHTML(name)}</h3>
            ${it.nmi && it.nmi !== it.n ? `<div class="history-card-meta"><span>🌿</span><span>${escapeHTML(it.nmi)}</span></div>` : ''}
            <p class="heritage-popup-row"><strong>Type:</strong> ${escapeHTML(typeLabel)}${subtype ? ' · ' + escapeHTML(prettyOsmValue(subtype)) : ''}</p>
            ${it.sd ? `<p class="heritage-popup-row"><strong>start_date:</strong> ${escapeHTML(it.sd)}</p>` : ''}
            ${!it.sd && it.yk ? `<p class="heritage-popup-row"><strong>${escapeHTML(it.yk)}:</strong> ${escapeHTML(it.y)}</p>` : ''}
            ${it.desc ? `<p class="history-card-desc">${escapeHTML(it.desc)}</p>` : ''}
            ${it.ins ? `<p class="history-card-desc heritage-inscription">“${escapeHTML(it.ins)}”</p>` : ''}
            <div class="history-card-footer">
              <a href="${googleUrl}" target="_blank" rel="noopener noreferrer" class="btn-google-ai"><span>✨</span> Ask Google AI Overview ↗</a>
              ${links.map(([href, label]) => `<a href="${escapeHTML(href)}" target="_blank" rel="noopener noreferrer" class="btn-source-archive">${escapeHTML(label)} ↗</a>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderHeritageCategoryList() {
      const list = document.getElementById('heritageCatList');
      if (!list) return;
      const hidden = new Set(heritageState.hiddenCats);
      list.innerHTML = heritageCategories.filter(c => c.count > 0).map(c => `
        <label class="heritage-cat-row">
          <input type="checkbox" data-cat="${escapeHTML(c.key)}" ${hidden.has(c.key) ? '' : 'checked'}>
          <span class="heritage-swatch" style="background:${HERITAGE_COLORS[c.key] || '#64748b'}"></span>
          <span class="heritage-cat-label">${escapeHTML(c.label)}</span>
          <span class="heritage-cat-count">${c.count}</span>
        </label>
      `).join('');
      list.querySelectorAll('input[data-cat]').forEach(input => {
        input.addEventListener('change', () => {
          const set = new Set(heritageState.hiddenCats);
          if (input.checked) set.delete(input.dataset.cat); else set.add(input.dataset.cat);
          heritageState.hiddenCats = Array.from(set);
          saveHeritageState();
          refreshHeritageLayer();
        });
      });
    }

    function syncHeritageControls() {
      document.getElementById('chkHeritageEnabled').checked = heritageState.enabled;
      document.getElementById('chkHeritageTimeline').checked = heritageState.useTimeline;
      document.getElementById('chkHeritageHideUndated').checked = heritageState.hideUndated;
    }

    const HERITAGE_GEOJSON_URL = 'https://dl.dropboxusercontent.com/scl/fi/j2l8jmov3wjhx5a5kmkmr/osm_heritage.geojson?rlkey=fan00dpy9vc9gl0p5b2vheirg&st=ked3wx2v&raw=1';
    // Must match the CATEGORIES order in 2_extract_osm_heritage.py
    const HERITAGE_CATEGORY_KEYS = ['memorial', 'military', 'maori', 'maritime', 'mining', 'transport',
      'religious', 'cemetery', 'building', 'ruins', 'marker', 'other'];

    function heritageFromGeoJSON(gj, sourceLabel) {
      if (!gj || !Array.isArray(gj.features) || gj.features.length === 0) return null;
      const labels = {};
      const counts = {};
      const items = [];
      gj.features.forEach(f => {
        const p = f.properties || {};
        const coords = f.geometry && f.geometry.coordinates;
        if (!coords || typeof p.c !== 'number') return;
        if (p.category) labels[p.c] = p.category;
        const it = Object.assign({}, p, { la: coords[1], lo: coords[0] });
        delete it.category;
        counts[it.c] = (counts[it.c] || 0) + 1;
        items.push(it);
      });
      const categories = (Array.isArray(gj.categories) ? gj.categories : HERITAGE_CATEGORY_KEYS.map((key, i) => ({ key, label: labels[i] || prettyOsmValue(key) })))
        .map((c, i) => Object.assign({}, c, { count: counts[i] || 0 }));
      return { generated: gj.generated, source: gj.source || sourceLabel, categories, items };
    }

    async function fetchHeritageGeoJSON(url, sourceLabel) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) return null;
        return heritageFromGeoJSON(JSON.parse(await res.text()), sourceLabel);
      } catch (e) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    async function loadHeritageData() {
      const local = window.OSM_HERITAGE && Array.isArray(window.OSM_HERITAGE.items) && window.OSM_HERITAGE.items.length ? window.OSM_HERITAGE : null;
      if (local && location.protocol === 'file:') return local;
      return (await fetchHeritageGeoJSON(HERITAGE_GEOJSON_URL, 'Dropbox osm_heritage.geojson'))
        || local
        || (await fetchHeritageGeoJSON('../data/osm_heritage.geojson', 'osm_heritage.geojson'));
    }

    async function initHeritageLayer() {
      const btn = document.getElementById('btnHeritageToggle');
      const card = document.getElementById('heritageCard');

      btn?.addEventListener('click', (e) => {
        e.stopPropagation();
        card?.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.heritage-switcher-container')) card?.classList.remove('show');
      });

      document.getElementById('heritageCountBadge').textContent = '…';
      const data = await loadHeritageData();

      if (!data || !Array.isArray(data.items) || data.items.length === 0) {
        document.getElementById('heritageCountBadge').textContent = '–';
        document.getElementById('heritageFoot').textContent = 'Heritage data could not be loaded (Dropbox or data/osm_heritage.js). Run 2_extract_osm_heritage.py to create it.';
        document.getElementById('chkHeritageEnabled').disabled = true;
        return;
      }

      loadHeritageState();
      heritageCategories = data.categories || [];
      heritageItems = data.items;

      const renderer = L.canvas({ padding: 0.5 });
      heritageLayer = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 50,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 15,
        iconCreateFunction: cluster => L.divIcon({
          html: `<div><span>${cluster.getChildCount()}</span></div>`,
          className: 'marker-cluster osm-heritage-cluster',
          iconSize: L.point(40, 40)
        })
      });

      heritageItems.forEach(it => {
        const cat = heritageCategories[it.c] || {};
        it._catKey = cat.key || 'other';
        it._hay = `${it.n || ''} ${it.nmi || ''} ${it.t || ''} ${it.mem || ''} ${it.ins || ''} ${it.desc || ''} ${cat.label || ''} ${it.y || ''}`.toLowerCase();
        const marker = L.circleMarker([it.la, it.lo], {
          renderer,
          radius: 6,
          color: '#ffffff',
          weight: 1.5,
          fillColor: HERITAGE_COLORS[it._catKey] || '#64748b',
          fillOpacity: 0.9,
          bubblingMouseEvents: false
        });
        marker.bindTooltip(escapeHTML(it.n || prettyOsmValue(it.t)), { direction: 'top', offset: [0, -6] });
        marker.bindPopup(() => buildHeritagePopup(it), { maxWidth: 320, autoPan: true });
        it._marker = marker;
      });

      const generated = data.generated ? String(data.generated).slice(0, 10) : '';
      document.getElementById('heritageFoot').innerHTML =
        `${heritageItems.length.toLocaleString()} sites from <strong>${escapeHTML(data.source || 'OpenStreetMap')}</strong>${generated ? ' (extracted ' + escapeHTML(generated) + ')' : ''}. ` +
        `Only ${heritageItems.filter(i => i.y).length.toLocaleString()} have a start_date. Data &copy; OpenStreetMap contributors (ODbL).`;
      map.attributionControl.addAttribution('Heritage sites &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');

      syncHeritageControls();
      renderHeritageCategoryList();

      document.getElementById('chkHeritageEnabled').addEventListener('change', (e) => {
        heritageState.enabled = e.target.checked; saveHeritageState(); refreshHeritageLayer();
      });
      document.getElementById('chkHeritageTimeline').addEventListener('change', (e) => {
        heritageState.useTimeline = e.target.checked; saveHeritageState(); refreshHeritageLayer();
      });
      document.getElementById('chkHeritageHideUndated').addEventListener('change', (e) => {
        heritageState.hideUndated = e.target.checked; saveHeritageState(); refreshHeritageLayer();
      });
      document.getElementById('btnHeritageAll').addEventListener('click', () => {
        heritageState.hiddenCats = []; saveHeritageState(); renderHeritageCategoryList(); refreshHeritageLayer();
      });
      document.getElementById('btnHeritageNone').addEventListener('click', () => {
        heritageState.hiddenCats = heritageCategories.map(c => c.key); saveHeritageState(); renderHeritageCategoryList(); refreshHeritageLayer();
      });

      renderHistoryLegend();
      refreshHeritageLayer();
    }

    function refreshHeritageLayer() {
      if (!heritageLayer) return;
      updateLegendActiveStates();
      const badge = document.getElementById('heritageCountBadge');

      if (!heritageState.enabled || isSavedFilterActive) {
        if (map.hasLayer(heritageLayer)) map.removeLayer(heritageLayer);
        if (badge) badge.textContent = heritageState.enabled ? '0' : 'off';
        return;
      }

      const minVal = parseInt(document.getElementById('minYearSlider').value, 10);
      const maxVal = parseInt(document.getElementById('maxYearSlider').value, 10);
      const lo = Math.min(minVal, maxVal);
      const hi = Math.max(minVal, maxVal);
      const openLow = lo <= globalMinYear;
      const openHigh = hi >= globalMaxYear;
      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();
      const hidden = new Set(heritageState.hiddenCats);

      const visible = [];
      for (const it of heritageItems) {
        if (hidden.has(it._catKey)) continue;
        if (it.y) {
          if (heritageState.useTimeline && ((!openLow && it.y < lo) || (!openHigh && it.y > hi))) continue;
        } else if (heritageState.hideUndated) {
          continue;
        }
        if (search && !it._hay.includes(search)) continue;
        visible.push(it._marker);
      }

      heritageLayer.clearLayers();
      heritageLayer.addLayers(visible);
      if (!map.hasLayer(heritageLayer)) map.addLayer(heritageLayer);
      if (badge) badge.textContent = visible.length.toLocaleString();
    }

    function scheduleHeritageRefresh() {
      clearTimeout(heritageRefreshTimer);
      heritageRefreshTimer = setTimeout(refreshHeritageLayer, 120);
    }

    // Interactive History Key
    const EVENT_GROUPS = [
      { key: 'cat-vessel',   label: 'Ships & Vessels',          icon: '🚢', color: '#0284c7', bg: 'rgba(224,242,254,0.95)' },
      { key: 'cat-war',      label: 'Wars & Battles',           icon: '⚔️', color: '#dc2626', bg: 'rgba(254,226,226,0.95)' },
      { key: 'cat-disaster', label: 'Disasters',                icon: '🌋', color: '#ea580c', bg: 'rgba(255,237,213,0.95)' },
      { key: 'cat-rights',   label: 'Rights, Treaties & Protest', icon: '✊', color: '#9333ea', bg: 'rgba(243,232,255,0.95)' },
      { key: 'cat-general',  label: 'General History',          icon: '📍', color: '#16a34a', bg: 'rgba(220,252,231,0.95)' }
    ];
    const HIDDEN_EVENT_GROUPS_KEY = 'bMMC_nz_history_hidden_event_groups';
    let hiddenEventGroups = new Set();

    try {
      const raw = localStorage.getItem(HIDDEN_EVENT_GROUPS_KEY);
      if (raw) hiddenEventGroups = new Set(JSON.parse(raw));
    } catch (e) {}

    function renderHistoryLegend() {
      const eventBox = document.getElementById('legendEventItems');
      const counts = {};
      allEvents.forEach(ev => {
        const k = getCategoryClass(ev.category);
        counts[k] = (counts[k] || 0) + 1;
      });
      if (eventBox) {
        eventBox.innerHTML = EVENT_GROUPS.map(g => `
          <div class="legend-item" data-event-group="${g.key}" title="Toggle ${escapeHTML(g.label)}">
            <span class="legend-pin-symbol" style="background:${g.bg}; border-color:${g.color};">${g.icon}</span>
            <span class="legend-item-label">${escapeHTML(g.label)}</span>
            <span class="legend-item-count">${counts[g.key] || 0}</span>
          </div>
        `).join('');
      }

      const heritageBox = document.getElementById('legendHeritageItems');
      const hasHeritage = heritageItems.length > 0;
      document.getElementById('legendHeritageTitle').style.display = hasHeritage ? '' : 'none';
      if (heritageBox) {
        heritageBox.innerHTML = !hasHeritage ? '' : `
          <div class="legend-item" data-heritage-master="1" title="Toggle all OSM heritage sites">
            <span class="legend-pin-symbol" style="background:rgba(237,233,254,0.95); border-color:#7c3aed;">🏛️</span>
            <span class="legend-item-label">All Heritage Sites</span>
            <span class="legend-item-count">${heritageItems.length.toLocaleString()}</span>
          </div>
          ${heritageCategories.filter(c => c.count > 0).map(c => `
            <div class="legend-item legend-sub" data-heritage-cat="${escapeHTML(c.key)}" title="Toggle ${escapeHTML(c.label)}">
              <span class="legend-dot" style="background:${HERITAGE_COLORS[c.key] || '#64748b'}"></span>
              <span class="legend-item-label">${escapeHTML(c.label)}</span>
              <span class="legend-item-count">${c.count.toLocaleString()}</span>
            </div>
          `).join('')}
        `;
      }
      updateLegendActiveStates();
    }

    function updateLegendActiveStates() {
      document.querySelectorAll('#historyLegendCard [data-event-group]').forEach(item => {
        item.classList.toggle('layer-muted', hiddenEventGroups.has(item.dataset.eventGroup));
      });
      const hiddenCats = new Set(heritageState.hiddenCats);
      document.querySelectorAll('#historyLegendCard [data-heritage-master]').forEach(item => {
        item.classList.toggle('layer-muted', !heritageState.enabled);
      });
      document.querySelectorAll('#historyLegendCard [data-heritage-cat]').forEach(item => {
        item.classList.toggle('layer-muted', !heritageState.enabled || hiddenCats.has(item.dataset.heritageCat));
      });
    }

    function initHistoryLegend() {
      const card = document.getElementById('historyLegendCard');
      const btnOpen = document.getElementById('btnOpenLegend');

      document.getElementById('btnCloseLegend')?.addEventListener('click', () => {
        card.style.display = 'none';
        btnOpen.style.display = 'inline-flex';
      });
      btnOpen?.addEventListener('click', () => {
        btnOpen.style.display = 'none';
        card.style.display = 'flex';
      });

      card?.addEventListener('click', (e) => {
        const item = e.target.closest('.legend-item');
        if (!item) return;

        if (item.dataset.eventGroup) {
          const key = item.dataset.eventGroup;
          if (hiddenEventGroups.has(key)) hiddenEventGroups.delete(key); else hiddenEventGroups.add(key);
          try { localStorage.setItem(HIDDEN_EVENT_GROUPS_KEY, JSON.stringify(Array.from(hiddenEventGroups))); } catch (err) {}
          updateLegendActiveStates();
          filterEvents();
        } else if (item.dataset.heritageMaster) {
          heritageState.enabled = !heritageState.enabled;
          saveHeritageState();
          syncHeritageControls();
          refreshHeritageLayer();
        } else if (item.dataset.heritageCat) {
          const key = item.dataset.heritageCat;
          const set = new Set(heritageState.hiddenCats);
          if (!heritageState.enabled) {
            heritageState.enabled = true;
            set.delete(key);
            syncHeritageControls();
          } else if (set.has(key)) {
            set.delete(key);
          } else {
            set.add(key);
          }
          heritageState.hiddenCats = Array.from(set);
          saveHeritageState();
          renderHeritageCategoryList();
          refreshHeritageLayer();
        }
      });

      renderHistoryLegend();
    }

    
    const SAVED_STORAGE_KEY = 'bMMC_nz_history_saved_ids';
    let isSavedFilterActive = false;

    function getSavedSet() {
      try {
        const raw = localStorage.getItem(SAVED_STORAGE_KEY);
        if (raw) return new Set(JSON.parse(raw));
      } catch (e) {}
      return new Set();
    }

    function saveSavedSet(set) {
      try {
        localStorage.setItem(SAVED_STORAGE_KEY, JSON.stringify(Array.from(set)));
      } catch (e) {}
    }

    function updateSavedCountHeader() {
      const count = getSavedSet().size;
      const badge = document.getElementById('savedCountBadge');
      if (badge) badge.textContent = count;
    }

    window.toggleSaveItem = function(id, evt) {
      if (evt) {
        evt.stopPropagation();
        evt.preventDefault();
      }
      const savedSet = getSavedSet();
      const isNowSaved = !savedSet.has(id);
      if (isNowSaved) {
        savedSet.add(id);
      } else {
        savedSet.delete(id);
      }
      saveSavedSet(savedSet);
      updateSavedCountHeader();

      // Update button inside current popup if present
      const btn = document.querySelector(`.btn-card-heart[data-id="${id}"]`);
      if (btn) {
        if (isNowSaved) {
          btn.classList.add('saved');
          btn.innerHTML = '<span class="heart-icon">❤️</span> <span class="heart-label">Saved</span>';
          btn.title = 'Remove from Saved';
        } else {
          btn.classList.remove('saved');
          btn.innerHTML = '<span class="heart-icon">🤍</span> <span class="heart-label">Save</span>';
          btn.title = 'Save to Favorites';
        }
      }

      // Re-filter if viewing saved filter
      if (isSavedFilterActive) {
        filterEvents();
      } else {
        // Refresh dataset markers to sync marker heart icon
        filterEvents();
      }
    };

    function toggleSavedFilter() {
      isSavedFilterActive = !isSavedFilterActive;
      const btn = document.getElementById('btnToggleSaved');
      if (btn) {
        if (isSavedFilterActive) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
      filterEvents();
      if (isSavedFilterActive && markers && markers.getLayers().length > 0) {
        try {
          map.fitBounds(markers.getBounds(), { padding: [50, 50], maxZoom: 14 });
        } catch (e) {}
      }
    }

    let allEvents = [];
    let currentActiveEvents = [];
    let currentActiveIndex = 0;
    let globalMinYear = 1280;
    let globalMaxYear = 2026;
    let timelineTimer = null;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function parseYearNum(val) {
      if (!val) return NaN;
      const m = String(val).match(/-?\d{3,4}/);
      return m ? parseInt(m[0], 10) : NaN;
    }

    function parseCoord(val) {
      if (val === null || val === undefined || val === '') return NaN;
      const clean = String(val).trim().replace(',', '.');
      const m = clean.match(/-?\d+(?:\.\d+)?/);
      if (!m) return NaN;
      const num = parseFloat(m[0]);
      return (isNaN(num) || num === 0) ? NaN : num;
    }

    function getThumbnailUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
        if (/=[sw]\d+/i.test(url)) return url.replace(/=[sw]\d+[^?]*/i, '=s240');
        return url.includes('?') ? url + '&sz=s240' : url + '=s240';
      }
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=s240`;
      }
      return url;
    }

    function getFullImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
        if (/=[sw]\d+/i.test(url)) return url.replace(/=[sw]\d+[^?]*/i, '=s0');
        return url;
      }
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/uc?id=${idMatch[1]}&export=view`;
      }
      return url;
    }

    function getCategoryClass(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('vessel') || c.includes('ship') || c.includes('whaling')) return 'cat-vessel';
      if (c.includes('war') || c.includes('troop') || c.includes('battle') || c.includes('musket')) return 'cat-war';
      if (c.includes('disaster') || c.includes('earthquake') || c.includes('eruption')) return 'cat-disaster';
      if (c.includes('rights') || c.includes('protest') || c.includes('treaty') || c.includes('sovereignty')) return 'cat-rights';
      return 'cat-general';
    }

    function getCategoryIcon(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('vessel') || c.includes('ship')) return '🚢';
      if (c.includes('war') || c.includes('troop') || c.includes('battle')) return '⚔️';
      if (c.includes('disaster') || c.includes('earthquake')) return '🌋';
      if (c.includes('rights') || c.includes('protest') || c.includes('suffrage')) return '✊';
      if (c.includes('treaty') || c.includes('sovereignty')) return '📜';
      return '📍';
    }

    window.stepHistory = function(delta) {
      if (!currentActiveEvents || currentActiveEvents.length === 0) return;
      let nextIdx = currentActiveIndex + delta;
      if (nextIdx < 0) nextIdx = 0;
      if (nextIdx >= currentActiveEvents.length) nextIdx = currentActiveEvents.length - 1;
      if (nextIdx === currentActiveIndex) return;

      currentActiveIndex = nextIdx;
      const targetEv = currentActiveEvents[nextIdx];
      if (targetEv && targetEv._marker) {
        markers.zoomToShowLayer(targetEv._marker, () => {
          const curZoom = map.getZoom();
          if (curZoom > CONSISTENT_EVENT_ZOOM || curZoom < 12) {
            map.setView([targetEv.latitude, targetEv.longitude], CONSISTENT_EVENT_ZOOM, { animate: true });
          } else {
            map.panTo([targetEv.latitude, targetEv.longitude]);
          }
          targetEv._marker.openPopup();
        });
      }
    };

    function renderDataset(items) {
      if (!markers) return;
      markers.clearLayers();

      const sortedItems = [...items].sort((a, b) => {
        if (a.year !== b.year) return (a.year || 0) - (b.year || 0);
        return String(a.date || '').localeCompare(String(b.date || ''));
      });

      currentActiveEvents = sortedItems;
      const totalCount = sortedItems.length;

      sortedItems.forEach((ev, i) => {
        ev._chronoIndex = i;
      });

      const markerList = [];
      const PROXIMITY_DEG = 0.025;
      const groups = [];

      sortedItems.forEach(ev => {
        let found = null;
        for (const grp of groups) {
          if (Math.abs(grp.lat - ev.latitude) < PROXIMITY_DEG && Math.abs(grp.lng - ev.longitude) < PROXIMITY_DEG) {
            found = grp;
            break;
          }
        }
        if (found) found.items.push(ev);
        else groups.push({ lat: ev.latitude, lng: ev.longitude, items: [ev] });
      });

      groups.forEach(grp => {
        grp.items.sort((a, b) => (a.year || 0) - (b.year || 0));

        grp.items.forEach((ev, idx) => {
          const safeYear = escapeHTML(ev.year || '');
          const safeDate = escapeHTML(ev.date || ev.year || '');
          const safeHeadline = escapeHTML(ev.headline || 'Event');
          const safeLocation = escapeHTML(ev.location || '');
          const safeCategory = escapeHTML(ev.category || 'History');
          const safeDetails = escapeHTML(ev.details || '');
          const safeUid = escapeHTML(ev._uid || ev.id || '');

          const rawImg = (ev.image_url || '').trim();
          const hasImageLink = rawImg.length > 0 && rawImg !== '#';
          const safeThumbImg = hasImageLink ? escapeHTML(getThumbnailUrl(rawImg)) : '';
          const safeFullImg = hasImageLink ? escapeHTML(typeof getFullImageUrl === 'function' ? getFullImageUrl(rawImg) : rawImg) : '';

          const catClass = getCategoryClass(ev.category);
          const catIcon = getCategoryIcon(ev.category);

          const isSaved = getSavedSet().has(ev._uid);

          // Baseline leader line + 56px step for vertical separation
          const baseLeaderHeight = 22;
          const stemHeight = baseLeaderHeight + (idx * 56);
          const pillHeight = 44;
          const tailHeight = 7;
          const dotHeight = 8;
          const totalIconHeight = pillHeight + tailHeight + stemHeight + dotHeight;
          const iconWidth = 260;
          const iconAnchorX = iconWidth / 2;
          const iconAnchorY = totalIconHeight - (dotHeight / 2);

          const googleAiSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(ev.headline + ' ' + (ev.date || ev.year) + ' New Zealand')}`;

          let markerImgSrc = '';
          if (hasImageLink) {
            if (typeof window.resolveOfflineMedia === 'function') {
              markerImgSrc = window.resolveOfflineMedia(rawImg) || window.resolveOfflineMedia(ev.id) || '';
            }
            if (!markerImgSrc) {
              markerImgSrc = safeThumbImg;
            }
          }

          // Marker capsule + leader line stem + anchor point dot on track/ground
          const markerHTML = `
            <div class="nz-history-marker ${catClass}">
              <div class="marker-pill">
                ${markerImgSrc ? `
                  <div class="marker-thumb-box">
                    <img class="marker-thumb-img" 
                         src="${markerImgSrc}" 
                         alt="" 
                         loading="lazy" 
                         onerror="this.parentElement.style.display='none';" />
                  </div>
                ` : ''}
                <div class="marker-text-block">
                  <div class="marker-header-row">
                    <span class="marker-date-tag">${catIcon} ${safeYear}</span>
                    ${isSaved ? '<span class="marker-saved-heart" title="Saved">❤️</span>' : ''}
                  </div>
                  <div class="marker-headline-text" title="${safeHeadline}">${safeHeadline}</div>
                </div>
              </div>
              <div class="marker-pin-tail"></div>
              <div class="marker-stem" style="height: ${stemHeight}px;"></div>
              <div class="marker-point-dot"></div>
            </div>
          `;

          const customIcon = L.divIcon({
            html: markerHTML,
            className: 'history-div-icon',
            iconSize: [iconWidth, totalIconHeight],
            iconAnchor: [iconAnchorX, iconAnchorY],
            popupAnchor: [0, -totalIconHeight + 12]
          });

          const popupImageBlock = hasImageLink ? `
            <a href="${safeFullImg}" target="_blank" rel="noopener noreferrer" class="history-card-img-wrap" title="Click to view full image">
              <img src="${safeThumbImg}" alt="${safeHeadline}" loading="lazy" onerror="this.onerror=null; this.parentElement.style.display='none';" />
              <div class="history-card-badge-row">
                <span class="category-pill">${safeCategory}</span>
                <span class="date-pill">${safeDate}</span>
              </div>
            </a>
          ` : `
            <div style="padding: 10px 12px 0; display: flex; gap: 6px;">
              <span class="category-pill">${safeCategory}</span>
              <span class="date-pill">${safeDate}</span>
            </div>
          `;

          const itemIndex = ev._chronoIndex;
          const isFirst = itemIndex === 0;
          const isLast = itemIndex === totalCount - 1;

          const popupHTML = `
            <div class="history-card">
              ${popupImageBlock}
              <div class="history-card-body">
                <div class="history-card-stepper">
                  <div style="display:inline-flex; align-items:center; gap:4px;">
                    <button type="button" class="btn-step-nav" onclick="window.stepHistory(-1); event.stopPropagation();" ${isFirst ? 'disabled' : ''} title="Previous event (earlier)">◀</button>
                    <span class="step-index-label">Item <strong>#${itemIndex + 1}</strong> of <strong>${totalCount}</strong></span>
                    <button type="button" class="btn-step-nav" onclick="window.stepHistory(1); event.stopPropagation();" ${isLast ? 'disabled' : ''} title="Next event (later)">▶</button>
                  </div>
                  <button type="button" class="btn-card-heart ${isSaved ? 'saved' : ''}" data-id="${safeUid}" onclick="window.toggleSaveItem('${safeUid}', event);" title="${isSaved ? 'Remove from Saved' : 'Save to Favorites'}">
                    <span class="heart-icon">${isSaved ? '❤️' : '🤍'}</span>
                    <span class="heart-label">${isSaved ? 'Saved' : 'Save'}</span>
                  </button>
                </div>

                <h3>${safeHeadline}</h3>
                <div class="history-card-meta">
                  <span>📍</span>
                  <span>${safeLocation}</span>
                </div>
                <p class="history-card-desc">${safeDetails}</p>
                <div class="history-card-footer">
                  <a href="${googleAiSearchUrl}" target="_blank" rel="noopener noreferrer" class="btn-google-ai">
                    <span>✨</span> Ask Google AI Overview ↗
                  </a>
                  ${ev.source_url && ev.source_url !== '#' ? `
                    <a href="${ev.source_url}" target="_blank" rel="noopener noreferrer" class="btn-source-archive">
                      <span>📖</span> Reference Link ↗
                    </a>
                  ` : ''}
                </div>
              </div>
            </div>
          `;

          const marker = L.marker([ev.latitude, ev.longitude], { icon: customIcon });
          ev._marker = marker;
          marker.bindPopup(popupHTML, { maxWidth: 390, autoPan: true, keepInView: true, closeOnClick: true });

          marker.on('popupopen', () => {
            currentActiveIndex = ev._chronoIndex;
          });

          markerList.push(marker);
        });
      });

      markers.addLayers(markerList);
      document.getElementById('itemCountBadge').textContent = `${totalCount} event${totalCount === 1 ? '' : 's'}`;
    }

    function filterEvents() {
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      const fill = document.getElementById('sliderTrackFill');
      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();

      let minVal = parseInt(minSlider.value, 10);
      let maxVal = parseInt(maxSlider.value, 10);

      if (minVal > maxVal) {
        const tmp = minVal;
        minVal = maxVal;
        maxVal = tmp;
        minSlider.value = minVal;
        maxSlider.value = maxVal;
      }

      const span = (globalMaxYear - globalMinYear) || 1;
      const left = ((minVal - globalMinYear) / span) * 100;
      const right = ((maxVal - globalMinYear) / span) * 100;

      if (fill) {
        fill.style.left = left + '%';
        fill.style.width = (right - left) + '%';
      }

      document.getElementById('yearRangeText').textContent = `${minVal} – ${maxVal}`;

      const filtered = allEvents.filter(ev => {
        const savedSet = getSavedSet();
        if (isSavedFilterActive && !savedSet.has(ev._uid)) return false;
        if (hiddenEventGroups.has(getCategoryClass(ev.category))) return false;

        const inYear = ev.year >= minVal && ev.year <= maxVal;
        if (!inYear) return false;

        if (search) {
          const hay = `${ev.headline} ${ev.location} ${ev.details} ${ev.category} ${ev.date}`.toLowerCase();
          return hay.includes(search);
        }
        return true;
      });

      renderDataset(filtered);
      scheduleHeritageRefresh();
    }

    function toggleTimelinePlayback() {
      const btn = document.getElementById('btnPlayTimeline');
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      if (timelineTimer) {
        clearInterval(timelineTimer);
        timelineTimer = null;
        btn.textContent = '▶';
        btn.classList.remove('playing');
      } else {
        btn.textContent = '⏸';
        btn.classList.add('playing');

        minSlider.value = globalMinYear;

        let currentMax = parseInt(maxSlider.value, 10);
        if (currentMax >= globalMaxYear || currentMax < 1800) {
          maxSlider.value = 1800;
        }
        filterEvents();

        timelineTimer = setInterval(() => {
          let curr = parseInt(maxSlider.value, 10);
          if (curr >= globalMaxYear) {
            toggleTimelinePlayback();
          } else {
            maxSlider.value = Math.min(globalMaxYear, curr + 4);
            filterEvents();
          }
        }, 260);
      }
    }

    function initSliders() {
      const years = allEvents.map(e => e.year).filter(y => !isNaN(y) && y > 0);
      if (years.length === 0) return;

      globalMinYear = Math.min(...years);
      globalMaxYear = Math.max(...years);

      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      minSlider.min = globalMinYear;
      minSlider.max = globalMaxYear;
      maxSlider.min = globalMinYear;
      maxSlider.max = globalMaxYear;

      minSlider.value = globalMinYear;
      maxSlider.value = globalMaxYear;

      renderHistoryLegend();
      filterEvents();
    }

    function getCol(row, aliases) {
      for (const key of Object.keys(row)) {
        const clean = key.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        for (const alias of aliases) {
          if (clean === alias) return String(row[key] || '').trim();
        }
      }
      return '';
    }

    function parseCSVData(csvString) {
      if (!csvString || csvString.trim().length === 0) return false;
      const parsed = Papa.parse(csvString, { header: true, skipEmptyLines: true });

      allEvents = (parsed.data || []).map(row => {
        let latStr = getCol(row, ['latitude', 'lat', 'latdeg', 'y']);
        let lngStr = getCol(row, ['longitude', 'lng', 'lon', 'long', 'x']);
        let yearStr = getCol(row, ['year', 'yr']);
        let dateStr = getCol(row, ['date', 'when', 'time']);

        let lat = parseCoord(latStr);
        let lng = parseCoord(lngStr);

        let parsedYear = parseYearNum(yearStr);
        if (isNaN(parsedYear) && dateStr) {
          parsedYear = parseYearNum(dateStr);
        }

        const rawId = getCol(row, ['id', 'no', 'item']);
        const headlineStr = getCol(row, ['headline', 'title', 'event', 'name']);
        const safeUid = rawId || `${parsedYear || 0}_${(headlineStr || '').slice(0, 24).replace(/[^a-zA-Z0-9]/g, '_')}_${lat.toFixed(3)}_${lng.toFixed(3)}`;

        return {
          id: safeUid,
          _uid: safeUid,
          year: isNaN(parsedYear) ? 0 : parsedYear,
          date: dateStr || String(parsedYear || ''),
          headline: getCol(row, ['headline', 'title', 'event', 'name']),
          category: getCol(row, ['category', 'type', 'era']) || 'General',
          location: getCol(row, ['location', 'place', 'city']),
          latitude: lat,
          longitude: lng,
          details: getCol(row, ['details', 'description', 'notes', 'summary']),
          image_url: getCol(row, ['imageurl', 'image', 'img', 'photo']),
          source_url: getCol(row, ['sourceurl', 'source', 'url', 'link']) || '#'
        };
      }).filter(e => !isNaN(e.latitude) && !isNaN(e.longitude) && e.latitude !== 0 && e.longitude !== 0);

      if (allEvents.length > 0) {
        initSliders();
        return true;
      }
      return false;
    }

    async function fetchFirstValidCsv(candidates) {
      for (const url of candidates) {
        if (!url) continue;
        try {
          const res = await fetch(url);
          if (res.ok) {
            const text = await res.text();
            if (text && text.trim().length > 50 && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
              return text;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    async function loadDataset() {
      // 1. Instant Cache Check for instantaneous display
      try {
        const cached = localStorage.getItem(CACHE_STORAGE_KEY);
        if (cached && parseCSVData(cached)) {
          // Continue in background to refresh from disk or online
        }
      } catch (e) {}

      // 2. Comprehensive local offline & live online CSV candidates
      const candidateUrls = [
        '../data/nz_history.csv',
        './data/nz_history.csv',
        'data/nz_history.csv',
        './nz_history.csv',
        'nz_history.csv',
        LIVE_CSV_URL,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(LIVE_CSV_URL)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(LIVE_CSV_URL)}`
      ];

      const csvText = await fetchFirstValidCsv(candidateUrls);

      if (csvText && parseCSVData(csvText)) {
        try { localStorage.setItem(CACHE_STORAGE_KEY, csvText); } catch (e) {}
        return;
      }

      if (allEvents.length === 0) {
        document.getElementById('itemCountBadge').textContent = 'Offline';
        document.getElementById('yearRangeText').textContent = 'Data Offline';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      initHeritageLayer();
      initHistoryLegend();

      document.getElementById('minYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('maxYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('btnPlayTimeline')?.addEventListener('click', toggleTimelinePlayback);

      document.getElementById('btnToggleSaved')?.addEventListener('click', toggleSavedFilter);
      updateSavedCountHeader();

      document.getElementById('btnFitNZ')?.addEventListener('click', () => {
        if (markers && markers.getLayers().length > 0) {
          map.fitBounds(markers.getBounds(), { padding: [50, 50] });
        } else {
          map.setView(NZ_CENTER, NZ_ZOOM);
        }
      });

      const btnLayersToggle = document.getElementById('btnLayersToggle');
      const layerDropdownCard = document.getElementById('layerDropdownCard');
      btnLayersToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerDropdownCard?.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) {
          layerDropdownCard?.classList.remove('show');
        }
      });

      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerSat')?.addEventListener('click', () => setBasemap('sat'));
      document.getElementById('btnLayerStreet')?.addEventListener('click', () => setBasemap('street'));

      const searchInput = document.getElementById('mapSearchInput');
      const clearSearchBtn = document.getElementById('clearMapSearch');
      searchInput?.addEventListener('input', (e) => {
        clearSearchBtn.style.display = e.target.value ? 'block' : 'none';
        filterEvents();
      });
      clearSearchBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        filterEvents();
        searchInput.focus();
      });

      document.querySelectorAll('.era-chip').forEach(chip => {
        chip.addEventListener('click', function () {
          document.querySelectorAll('.era-chip').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('minYearSlider').value = this.dataset.min;
          document.getElementById('maxYearSlider').value = this.dataset.max;
          filterEvents();
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.key === 'ArrowLeft') {
          window.stepHistory(-1);
        } else if (e.key === 'ArrowRight') {
          window.stepHistory(1);
        }
      });

      loadDataset();
    });
  </script>
</body>
