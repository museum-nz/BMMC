<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Zealand Philatelic Photo Map — StampsNZ</title>

  <!-- Inline Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📮</text></svg>">

  <!-- Leaflet CSS & MarkerCluster -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.css" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.Default.css" />

  <!-- Master Unified Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #064e3b; 
      overflow: hidden;
    }
    #map { 
      width: 100vw; 
      height: 100vh; 
      background: #aad3df; 
    }

    /* Page-Specific Stamp Styling */
    .single-stamp-wrapper {
      border: 2px solid #10b981 !important;
    }
    .single-stamp-wrapper:hover {
      border-color: #059669 !important;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.45) !important;
    }
    .cluster-number-badge {
      background: linear-gradient(135deg, #059669, #047857) !important;
    }
    .stamp-card-large p.meta-tag {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: #059669;
      font-weight: 700;
    }
    .stamp-card-large .img-container {
      width: 100%;
      height: 220px;
      border-radius: 10px;
      background: #f8fafc;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-sizing: border-box;
    }
    .stamp-card-large .img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .stamp-card-large .desc-box {
      font-size: 11px;
      color: #475569;
      margin-top: 8px;
      text-align: left;
      line-height: 1.4;
      max-height: 60px;
      overflow-y: auto;
      background: #f1f5f9;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .card-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .val-badge {
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
      background: #ecfdf5;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #a7f3d0;
    }
    .view-item-btn-stamp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      background: #059669;
      border: 1px solid #047857;
      padding: 7px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
    }
    .view-item-btn-stamp:hover {
      background: #047857;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.4);
    }

    @media (max-width: 768px) {
      .top-controls-bar {
        left: 50px;
        right: 10px;
        top: 10px;
      }
      .map-search-box { width: 130px; }
      .layer-dropdown-card {
        width: 260px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .year-slider-container {
        left: 50% !important;
        transform: translateX(-50%) !important;
        bottom: 15px !important;
        width: 90vw !important;
        max-width: 330px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Search & Controls Bar -->
  <div class="top-controls-bar">
    <!-- Universal Navigation Drawer Trigger (Hamburger) -->
    <button class="btn-bmmc-menu-trigger top-action-btn" title="Open Museum Wings Menu">
      <span class="text-sm leading-none">☰</span>
      <span class="hidden-xs">Wings</span>
    </button>

    <div class="map-search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="mapSearchInput" placeholder="Search NZ stamps, regions..." aria-label="Search map stamps">
      <button id="clearMapSearch" class="clear-search-btn" title="Clear Search">✕</button>
    </div>

    <!-- Base Layer Switcher -->
    <div class="layer-switcher-container">
      <button id="btnLayersToggle" class="top-action-btn" title="Change Basemap">
        <span>🗺️</span> <span>Layers</span>
      </button>

      <div id="layerDropdownCard" class="layer-dropdown-card">
        <button id="btnLayerGoogle" class="layer-option-btn active" title="Google Maps (Streets)">
          <span class="icon">📍</span>

        </button>
        <button id="btnLayerHybrid" class="layer-option-btn" title="Google Satellite (Hybrid)">
          <span class="icon">🛰️</span>

        <button id="btnLayerSatellite" class="layer-option-btn" title="Esri Satellite Imagery">

        <button id="btnLayerNatGeo" class="layer-option-btn" title="National Geographic Cartography">

    <a href="stamps.html" class="top-action-btn" title="Return to Catalog">
      <span>📮</span> <span class="hidden-xs">Catalog</span>

  <div id="map"></div>

  <!-- Bottom Timeline & Year Slider Panel -->

    <div class="year-slider-header">

        <span>Timeline</span>
        <span id="itemCountBadge" class="item-counter-badge">Loading...</span>
      </div>

    </div>

      <div class="slider-track-bg"></div>
      <div class="slider-track-fill" id="sliderTrackFill"></div>
      <input type="range" id="minYearSlider" min="1855" max="2026" value="1855" step="1" aria-label="Minimum Year Filter">

  <!-- Universal Navigation Drawer Script -->
  <script src="shared-nav.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    const REMOTE_STAMPS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRa2_IODuuz5_h6b15Vc-8zHDbAR-pIBO08bE-c3SZliZhm6h_CSU9LLuStjjlfN6CYm3qksR4klwgy/pub?gid=1362859267&single=true&output=csv';
    const LOCAL_CSV_CANDIDATES = [

      './stamps-data.csv',
      '../stamps-data.csv',
      './data/stamps-data.csv',

    const SVG_NO_IMG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2275%22%20height%3D%2275%22%3E%3Crect%20fill%3D%22%23e2e8f0%22%20width%3D%2275%22%20height%3D%2275%22%2F%3E%3Ctext%20fill%3D%22%23059669%22%20font-size%3D%2210%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3ENZ%20Stamp%3C%2Ftext%3E%3C%2Fsvg%3E';

    // Comprehensive New Zealand Philatelic Gazetteer
    const NZ_GEO_LOOKUP = {

      'egmont': { lat: -39.2974, lng: 174.0639, label: 'Mount Taranaki / Egmont' },
      'new plymouth': { lat: -39.0556, lng: 174.0752, label: 'New Plymouth' },
      'mt cook': { lat: -43.5950, lng: 170.1418, label: 'Aoraki / Mount Cook' },
      'aoraki': { lat: -43.5950, lng: 170.1418, label: 'Aoraki / Mount Cook' },
      'bay of islands': { lat: -35.2500, lng: 174.1500, label: 'Bay of Islands (Waitangi)' },
      'waitangi': { lat: -35.2650, lng: 174.0850, label: 'Waitangi' },
      'northland': { lat: -35.5000, lng: 173.9000, label: 'Northland' },
      'whangarei': { lat: -35.7251, lng: 174.3237, label: 'Whangārei' },
      'nelson': { lat: -41.2706, lng: 173.2840, label: 'Nelson' },
      'marlborough': { lat: -41.5000, lng: 173.8000, label: 'Marlborough' },
      'blenheim': { lat: -41.5134, lng: 173.9528, label: 'Blenheim' },
      'southland': { lat: -46.0000, lng: 168.0000, label: 'Southland' },
      'invercargill': { lat: -46.4132, lng: 168.3538, label: 'Invercargill' },
      'fiordland': { lat: -45.4167, lng: 167.7167, label: 'Fiordland / Milford Sound' },
      'milford': { lat: -44.6715, lng: 167.9256, label: 'Milford Sound / Mitre Peak' },
      'mitre peak': { lat: -44.6715, lng: 167.9256, label: 'Mitre Peak' },
      'queenstown': { lat: -45.0312, lng: 168.6626, label: 'Queenstown / Wakatipu' },
      'wanaka': { lat: -44.7000, lng: 169.1500, label: 'Lake Wānaka' },
      'tongariro': { lat: -39.1300, lng: 175.6400, label: 'Tongariro / Ruapehu' },
      'ruapehu': { lat: -39.2800, lng: 175.5600, label: 'Mount Ruapehu' },
      'ross dependency': { lat: -77.8500, lng: 166.6667, label: 'Ross Dependency (Antarctica)' },
      'antarctica': { lat: -77.8500, lng: 166.6667, label: 'Ross Dependency (Antarctica)' },
      'chatham islands': { lat: -43.9537, lng: -176.5401, label: 'Chatham Islands' },
      'stewart island': { lat: -46.9000, lng: 167.8500, label: 'Stewart Island / Rakiura' },
      'rakiura': { lat: -46.9000, lng: 167.8500, label: 'Rakiura' },
      'palmerston north': { lat: -40.3523, lng: 175.6082, label: 'Palmerston North / Manawatū' },
      'manawatu': { lat: -40.3523, lng: 175.6082, label: 'Manawatū' },
      'whanganui': { lat: -39.9301, lng: 175.0489, label: 'Whanganui' },
      'tauranga': { lat: -37.6878, lng: 176.1651, label: 'Bay of Plenty (Tauranga)' },
      'bay of plenty': { lat: -37.6878, lng: 176.1651, label: 'Bay of Plenty' },
      'coromandel': { lat: -36.7500, lng: 175.5000, label: 'Coromandel Peninsula' },
      'west coast': { lat: -42.4500, lng: 171.2100, label: 'West Coast (Greymouth / Hokitika)' },
      'greymouth': { lat: -42.4500, lng: 171.2100, label: 'Greymouth' },
      'hokitika': { lat: -42.7167, lng: 170.9667, label: 'Hokitika' }
    };

    // Major geographic fallback distribution anchors
    const NZ_REGIONAL_NODES = [
      { lat: -36.8485, lng: 174.7633, label: 'Auckland Region' },
      { lat: -41.2865, lng: 174.7762, label: 'Wellington / Capital' },
      { lat: -43.5321, lng: 172.6362, label: 'Canterbury' },
      { lat: -45.8788, lng: 170.5028, label: 'Otago' },
      { lat: -37.7870, lng: 175.2793, label: 'Waikato' },
      { lat: -38.1368, lng: 176.2497, label: 'Rotorua' },
      { lat: -39.4928, lng: 176.9120, label: 'Hawke\'s Bay' },
      { lat: -39.2974, lng: 174.0639, label: 'Taranaki' },
      { lat: -41.2706, lng: 173.2840, label: 'Nelson & Bays' },
      { lat: -45.0312, lng: 168.6626, label: 'Queenstown Lakes' },
      { lat: -35.2500, lng: 174.1500, label: 'Northland' },
      { lat: -46.4132, lng: 168.3538, label: 'Southland' }
    ];

    const defaultCenter = [-41.2865, 174.7762];
    const defaultZoom = 6;

    const map = L.map('map', {
      closePopupOnClick: true,
      minZoom: 3,
      worldCopyJump: false
    }).setView(defaultCenter, defaultZoom);

    // Basemaps
    const layerGoogle = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { attribution: '&copy; Google Maps', maxZoom: 20, subdomains: ['0', '1', '2', '3'] });
    const layerHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { attribution: '&copy; Google Maps', maxZoom: 20, subdomains: ['0', '1', '2', '3'] });
    const layerEsriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri &copy;', maxZoom: 18 });
    const layerEsriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri &copy;', maxZoom: 19 });
    const layerNatGeo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'NatGeo &copy;', maxZoom: 16 });
    const layerVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO', maxZoom: 19, subdomains: 'abcd' });

    const baseLayers = {
      google: layerGoogle,
      hybrid: layerHybrid,
      satellite: layerEsriSatellite,
      topo: layerEsriTopo,
      natgeo: layerNatGeo,
      voyager: layerVoyager
    };

    let currentBasemapKey = 'google';
    baseLayers[currentBasemapKey].addTo(map);

    function setBasemap(type) {
      if (!baseLayers[type]) return;
      Object.values(baseLayers).forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
      baseLayers[type].addTo(map);
      currentBasemapKey = type;
      document.querySelectorAll('.layer-option-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id.toLowerCase() === `btnlayer${type.toLowerCase()}`);
      });
      document.getElementById('layerDropdownCard')?.classList.remove('show');
    }

    const markers = L.markerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      maxClusterRadius: 45,
      iconCreateFunction: function(cluster) {
        return L.divIcon({
          html: `<div class="cluster-number-badge">${cluster.getChildCount()}</div>`,
          className: 'custom-cluster-icon',
          iconSize: [48, 48],
          iconAnchor: [24, 24]
        });
      }
    });

    let allStampRecords = [];
    let markerIdMap = new Map();
    let globalMinYear = 1855;
    let globalMaxYear = 2026;
    let timelinePlayTimer = null;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatMediaUrl(url) {
      if (!url) return SVG_NO_IMG;
      const clean = String(url).trim();
      if (window.resolveOfflineMedia) {
        const local = window.resolveOfflineMedia(clean);
        if (local) return local;
      }
      if (clean.startsWith('http') || clean.startsWith('/') || clean.startsWith('./') || clean.startsWith('data:image/')) {
        return clean;
      }
      return `./media/images/stamps/${clean}`;
    }

    function pseudoRandomOffset(seedStr, scale = 0.08) {
      let hash = 0;
      for (let i = 0; i < seedStr.length; i++) {
        hash = (hash << 5) - hash + seedStr.charCodeAt(i);
        hash |= 0;
      }
      const x = ((hash & 0xFFFF) / 0xFFFF - 0.5) * scale;
      const y = (((hash >> 16) & 0xFFFF) / 0xFFFF - 0.5) * scale;
      return { latOffset: x, lngOffset: y };
    }

    function renderMarkers(records) {
      markers.clearLayers();
      markerIdMap.clear();
      const markerList = [];

      records.forEach((item, idx) => {
        const safeImg = formatMediaUrl(item.imgUrl);
        const safeTitle = escapeHTML(item.title);
        const safeLocation = escapeHTML(item.location);
        const safeEra = escapeHTML(item.era || 'General Issue');

        const customIcon = L.divIcon({
          html: `<div class="single-stamp-wrapper"><img src="${safeImg}" loading="lazy" alt="${safeTitle}" onerror="this.onerror=null; this.src='${SVG_NO_IMG}';"/></div>`,
          className: 'custom-stamp-icon',
          iconSize: [72, 72],
          iconAnchor: [36, 36]
        });

        const popupHTML = `
          <div class="stamp-card-large">
            <h3>${safeTitle}</h3>
            <p class="meta-tag">📍 ${safeLocation} &bull; 📅 ${item.year} (${safeEra})</p>
            <div class="img-container">
              <img src="${safeImg}" loading="lazy" alt="${safeTitle}" onerror="this.onerror=null; this.src='${SVG_NO_IMG}';"/>
            </div>
            ${item.details ? `<div class="desc-box">${escapeHTML(item.details)}</div>` : ''}
            <div class="card-footer">
              <div class="val-badge">${escapeHTML(item.denomination || 'NZ')}</div>
              <a href="stamps.html?q=${encodeURIComponent(item.title)}" class="view-item-btn-stamp">
                <span>🔍 View in Catalog ↗</span>
              </a>
            </div>
          </div>
        `;

        const m = L.marker([item.lat, item.lng], { icon: customIcon });
        m.bindPopup(popupHTML, { autoPan: true, keepInView: true });
        markerList.push(m);

        if (item.id) markerIdMap.set(item.id.toLowerCase(), m);
        markerIdMap.set(String(idx), m);
        markerIdMap.set(item.title.toLowerCase(), m);
      });

      markers.addLayers(markerList);
      map.addLayer(markers);

      const countBadge = document.getElementById('itemCountBadge');
      if (countBadge) countBadge.textContent = `${records.length} items`;
    }

    function updateYearFilter() {
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      const trackFill = document.getElementById('sliderTrackFill');
      const searchVal = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();

      let minVal = parseInt(minSlider.value, 10);
      let maxVal = parseInt(maxSlider.value, 10);

      if (minVal > maxVal) {
        minSlider.value = maxVal;
        minVal = maxVal;
      }

      const minRange = parseInt(minSlider.min, 10);
      const maxRange = parseInt(minSlider.max, 10);
      const rangeSpan = (maxRange - minRange) || 1;

      const leftPercent = ((minVal - minRange) / rangeSpan) * 100;
      const rightPercent = ((maxVal - minRange) / rangeSpan) * 100;

      trackFill.style.left = leftPercent + '%';
      trackFill.style.width = (rightPercent - leftPercent) + '%';

      document.getElementById('yearRangeText').textContent = `${minVal} – ${maxVal}`;

      const filtered = allStampRecords.filter(item => {
        const y = item.year;
        const matchesYear = (y >= minVal && y <= maxVal);
        if (!matchesYear) return false;

        if (searchVal) {
          const hay = `${item.title} ${item.location} ${item.year} ${item.id || ''} ${item.details || ''}`.toLowerCase();
          return hay.includes(searchVal);
        }
        return true;
      });

      renderMarkers(filtered);
    }

    function toggleTimelinePlayback() {
      const playBtn = document.getElementById('btnPlayTimeline');
      const maxSlider = document.getElementById('maxYearSlider');

      if (timelinePlayTimer) {
        clearInterval(timelinePlayTimer);
        timelinePlayTimer = null;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
      } else {
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');

        timelinePlayTimer = setInterval(() => {
          let curr = parseInt(maxSlider.value, 10);
          if (curr >= globalMaxYear) {
            toggleTimelinePlayback();
          } else {
            maxSlider.value = Math.min(globalMaxYear, curr + 2);
            updateYearFilter();
          }
        }, 350);
      }
    }

    function processStampData(rows) {
      allStampRecords = [];

      rows.forEach((r, idx) => {
        const title = (r.Subject || r.Issue_Name || r.Title || '').trim();
        if (!title) return;

        let yr = parseInt(r.Year, 10);
        if (isNaN(yr) || yr < 1840 || yr > 2030) {
          const m = `${title} ${r.Details || ''}`.match(/\b(18[5-9]\d|19\d{2}|20\d{2})\b/);
          yr = m ? parseInt(m[1], 10) : 1900;
        }

        const fullScanText = `${r.Location || ''} ${title} ${r.Details || ''} ${r.Categories || ''}`.toLowerCase();
        let matchedGeo = null;

        for (const [key, geo] of Object.entries(NZ_GEO_LOOKUP)) {
          if (fullScanText.includes(key)) {
            matchedGeo = geo;
            break;
          }
        }

        if (!matchedGeo) {
          const nodeIdx = Math.abs((title.charCodeAt(0) || 0) + idx) % NZ_REGIONAL_NODES.length;
          matchedGeo = NZ_REGIONAL_NODES[nodeIdx];
        }

        const offset = pseudoRandomOffset(`${title}_${idx}_${yr}`, 0.08);

        allStampRecords.push({
          id: r.ID || `NZ-${idx}`,
          title: title,
          year: yr,
          era: r.Era || (yr <= 1901 ? 'Victorian' : (yr <= 1945 ? 'Pre-War' : 'Modern')),
          lat: matchedGeo.lat + offset.latOffset,
          lng: matchedGeo.lng + offset.lngOffset,
          location: matchedGeo.label,
          denomination: r.Denomination || '',
          details: r.Details || r.Description || '',
          imgUrl: r.Image_URL || r.Image || ''
        });
      });

      const years = allStampRecords.map(s => s.year).filter(y => y >= 1855 && y <= 2026);
      if (years.length) {
        globalMinYear = Math.min(...years);
        globalMaxYear = Math.max(...years);
      }

      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      minSlider.min = globalMinYear;
      minSlider.max = globalMaxYear;
      maxSlider.min = globalMinYear;
      maxSlider.max = globalMaxYear;

      minSlider.value = globalMinYear;
      maxSlider.value = globalMaxYear;

      // Deep-linking URL params
      const params = new URLSearchParams(window.location.search);
      const searchParam = params.get('search') || params.get('q');
      const yearParam = parseInt(params.get('year'), 10);
      const titleParam = params.get('title') || params.get('id');

      if (searchParam) {
        document.getElementById('mapSearchInput').value = searchParam;
        document.getElementById('clearMapSearch').style.display = 'flex';
      }

      if (!isNaN(yearParam) && yearParam >= globalMinYear) {
        minSlider.value = Math.max(globalMinYear, yearParam - 5);
        maxSlider.value = Math.min(globalMaxYear, yearParam + 5);
      }

      updateYearFilter();

      if (titleParam || searchParam) {
        const query = (titleParam || searchParam).toLowerCase();
        const found = allStampRecords.find(s => 
          s.title.toLowerCase().includes(query) || 
          s.location.toLowerCase().includes(query) || 
          (s.id && s.id.toLowerCase() === query)
        );

        if (found) {
          map.setView([found.lat, found.lng], 9);
          setTimeout(() => {
            const marker = markerIdMap.get(found.id ? found.id.toLowerCase() : found.title.toLowerCase());
            if (marker) {
              markers.zoomToShowLayer(marker, () => marker.openPopup());
            }
          }, 300);
        } else if (searchParam) {
          const targetKey = Object.keys(NZ_GEO_LOOKUP).find(k => searchParam.toLowerCase().includes(k));
          if (targetKey && NZ_GEO_LOOKUP[targetKey]) {
            map.setView([NZ_GEO_LOOKUP[targetKey].lat, NZ_GEO_LOOKUP[targetKey].lng], 9);
          }
        }
      }
    }

    async function loadData() {
      try {
        const cachedRaw = localStorage.getItem('bMMC_cached_stamps');
        if (cachedRaw) {
          const parsed = JSON.parse(cachedRaw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            processStampData(parsed);
            return;
          }
        }
      } catch (e) {}

      try {
        const res = await fetch(REMOTE_STAMPS_CSV_URL);
        if (res.ok) {
          const csvText = await res.text();
          const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
          if (parsed.data && parsed.data.length > 0) {
            try { localStorage.setItem('bMMC_cached_stamps', JSON.stringify(parsed.data)); } catch (e) {}
            processStampData(parsed.data);
            return;
          }
        }
      } catch (e) {}

      for (const path of LOCAL_CSV_CANDIDATES) {
        try {
          const resLocal = await fetch(path);
          if (resLocal.ok) {
            const csvText = await resLocal.text();
            const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
            if (parsed.data && parsed.data.length > 0) {
              processStampData(parsed.data);
              return;
            }
          }
        } catch (e) {}
      }

      document.getElementById('itemCountBadge').textContent = 'Offline';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('minYearSlider')?.addEventListener('input', updateYearFilter);
      document.getElementById('maxYearSlider')?.addEventListener('input', updateYearFilter);
      document.getElementById('btnPlayTimeline')?.addEventListener('click', toggleTimelinePlayback);

      document.getElementById('btnFitBounds')?.addEventListener('click', () => {
        if (markers.getLayers().length > 0) map.fitBounds(markers.getBounds(), { padding: [50, 50] });
      });

      const btnLayers = document.getElementById('btnLayersToggle');
      const layerCard = document.getElementById('layerDropdownCard');
      btnLayers?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerCard?.classList.toggle('show');
      });

      document.getElementById('btnLayerGoogle')?.addEventListener('click', () => setBasemap('google'));
      document.getElementById('btnLayerHybrid')?.addEventListener('click', () => setBasemap('hybrid'));
      document.getElementById('btnLayerSatellite')?.addEventListener('click', () => setBasemap('satellite'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerVoyager')?.addEventListener('click', () => setBasemap('voyager'));

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) layerCard?.classList.remove('show');
      });

      const searchInput = document.getElementById('mapSearchInput');
      const clearBtn = document.getElementById('clearMapSearch');
      searchInput?.addEventListener('input', (e) => {
        clearBtn.style.display = e.target.value ? 'flex' : 'none';
        updateYearFilter();
      });
      clearBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        updateYearFilter();
      });

      loadData();
    });
  </script>
</body>
