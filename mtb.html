<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa NZ Mountain Bike &amp; Cycle Trails — BMMC</title>

  <!-- Instant Theme Sync -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('bMMC_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect for Tile & CDN Performance -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://services1.arcgis.com" crossorigin>
  <link rel="preconnect" href="https://services.arcgis.com" crossorigin>
  <link rel="preconnect" href="https://dl.dropboxusercontent.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- Inline Mountain Bike Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚵</text></svg>">

  <!-- Leaflet & Plugins CSS with CDN Fallbacks -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />

  <!-- Master Stylesheet & Offline Adapter -->
  <link rel="stylesheet" href="styles.css" onerror="this.onerror=null;">
  <script src="offline-adapter.js" onerror="this.onerror=null;"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1329;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #aad3df;
      z-index: 1;
    }

    /* Top-Right Zoom Controls */
    .leaflet-top.leaflet-right .leaflet-control-zoom {
      margin-top: 62px;
      margin-right: 16px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .leaflet-control-zoom a {
      background-color: rgba(255, 255, 255, 0.94) !important;
      color: #0f172a !important;
      border-color: rgba(203, 213, 225, 0.8) !important;
      transition: all 0.15s ease !important;
    }
    .leaflet-control-zoom a:hover {
      background-color: #ffffff !important;
      color: #10b981 !important;
    }
    .dark .leaflet-top.leaflet-right .leaflet-control-zoom {
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .dark .leaflet-control-zoom a {
      background-color: rgba(15, 23, 42, 0.94) !important;
      color: #f8fafc !important;
      border-color: rgba(51, 65, 85, 0.8) !important;
    }
    .dark .leaflet-control-zoom a:hover {
      background-color: #1e293b !important;
      color: #34d399 !important;
    }

    /* Top Floating Controls Bar */
    .top-controls-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .top-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .top-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .top-action-btn:hover {
      background: #ffffff;
      border-color: #10b981;
      color: #10b981;
      transform: translateY(-1px);
    }
    .top-action-btn.active {
      background: #ecfdf5;
      border-color: #10b981;
      color: #059669;
    }
    .dark .top-action-btn {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .dark .top-action-btn:hover {
      background: #1e293b;
      border-color: #34d399;
      color: #34d399;
    }
    .dark .top-action-btn.active {
      background: #064e3b;
      border-color: #34d399;
      color: #6ee7b7;
    }

    /* Search Box */
    .map-search-box {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      min-width: 180px;
      max-width: 280px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      padding: 0 10px;
    }
    .dark .map-search-box {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .map-search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      padding-left: 6px;
    }
    .dark .map-search-box input { color: #f8fafc; }
    .search-icon { font-size: 13px; color: #64748b; flex-shrink: 0; }
    .clear-search-btn {
      display: none;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dark .clear-search-btn { background: #334155; color: #cbd5e1; }

    /* Unified Layers Switcher & Saved Favorites Switcher */
    .layer-switcher-container,
    .saved-switcher-container { 
      position: relative; 
      display: inline-block; 
    }

    .layer-dropdown-card,
    .saved-dropdown-card {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 340px;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 12px;
      z-index: 2000;
      flex-direction: column;
      gap: 8px;
    }
    .layer-dropdown-card.show,
    .saved-dropdown-card.show { 
      display: flex; 
    }
    .dark .layer-dropdown-card,
    .dark .saved-dropdown-card {
      background: rgba(15, 23, 42, 0.97);
      border-color: #334155;
      box-shadow: 0 12px 32px rgba(0,0,0,0.65);
    }
    .layer-section-title {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #64748b;
      padding: 2px 4px 0;
    }
    .dark .layer-section-title { color: #94a3b8; }
    .layer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .layer-section-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 3px 0;
    }
    .dark .layer-section-divider { background: #334155; }
    .layer-overlay-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layer-option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: #f8fafc;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
    }
    .dark .layer-option-btn { background: #1e293b; color: #cbd5e1; }
    .layer-option-btn.active {
      background: #ecfdf5;
      border-color: #10b981;
      color: #059669;
    }
    .dark .layer-option-btn.active {
      background: #064e3b;
      border-color: #34d399;
      color: #6ee7b7;
    }
    .layer-opt-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .layer-status-indicator {
      font-weight: 900;
      font-size: 11px;
      margin-left: auto;
      opacity: 0;
    }
    .layer-option-btn.active .layer-status-indicator { opacity: 1; }

    .track-count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.08);
      color: #475569;
      margin-left: 4px;
    }
    .dark .track-count-pill {
      background: rgba(255, 255, 255, 0.12);
      color: #94a3b8;
    }

    /* Saved Trails Items inside Dropdown */
    .saved-track-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.15s ease;
    }
    .dark .saved-track-card {
      background: #1e293b;
      border-color: #334155;
    }
    .saved-track-title {
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
    }
    .dark .saved-track-title { color: #f8fafc; }
    .saved-track-sub {
      font-size: 11px;
      color: #64748b;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .dark .saved-track-sub { color: #94a3b8; }
    .saved-track-actions {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-saved-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-saved-action:hover {
      border-color: #10b981;
      color: #10b981;
      background: #f0fdf4;
    }
    .dark .btn-saved-action {
      background: #0f172a;
      border-color: #475569;
      color: #f8fafc;
    }
    .dark .btn-saved-action:hover {
      background: #064e3b;
      border-color: #34d399;
      color: #6ee7b7;
    }

    /* Filter Chips Bar */
    .filter-chips-bar {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      max-width: 90vw;
    }
    .filter-chip {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .filter-chip:hover {
      background: #1e293b;
      color: #ffffff;
      border-color: #34d399;
    }
    .filter-chip.active {
      background: #059669;
      color: #ffffff;
      border-color: #34d399;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    /* Floating Status Pill */
    .status-summary-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 14px;
      padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: #0f172a;
      pointer-events: auto;
    }
    .dark .status-summary-bar {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* Popups & Close Button Fix */
    .leaflet-popup-content {
      margin: 14px 16px !important;
      line-height: 1.4 !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      top: 8px !important;
      right: 8px !important;
      width: 24px !important;
      height: 24px !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #64748b !important;
      background: rgba(241, 245, 249, 0.85) !important;
      border-radius: 50% !important;
      text-decoration: none !important;
      z-index: 2100 !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
    }
    .leaflet-container a.leaflet-popup-close-button:hover {
      color: #0f172a !important;
      background: #e2e8f0 !important;
    }
    .dark .leaflet-container a.leaflet-popup-close-button {
      color: #94a3b8 !important;
      background: rgba(30, 41, 59, 0.85) !important;
    }
    .dark .leaflet-container a.leaflet-popup-close-button:hover {
      color: #f8fafc !important;
      background: #334155 !important;
    }

    .trail-popup-card {
      font-family: system-ui, sans-serif;
      min-width: min(405px, 80vw);
      max-width: min(510px, 88vw);
      padding: 2px 20px 2px 2px; /* Extra right padding prevents close-x overlap */
      color: #0f172a;
    }
    .trail-popup-card h3 {
      margin: 0 0 2px 0;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.3;
      color: #0f172a;
    }

    /* Track distance under title */
    .trail-distance-sub {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 800;
      color: #059669;
      margin-bottom: 8px;
    }

    /* Tag badges */
    .trail-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
      align-items: center;
    }
    .trail-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 7px;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-grade-1 { background: #dcfce7; color: #166534; }
    .pill-grade-2 { background: #e0f2fe; color: #075985; }
    .pill-grade-3 { background: #fef3c7; color: #92400e; }
    .pill-grade-4 { background: #ffedd5; color: #9a3412; }
    .pill-grade-5 { background: #fee2e2; color: #991b1b; }
    .pill-category { background: #f1f5f9; color: #475569; }

    .trail-meta-row {
      font-size: 11.5px;
      color: #475569;
      line-height: 1.55;
      margin-bottom: 10px;
    }
    .trail-meta-row strong {
      color: #1e293b;
    }
    .trail-comment-box {
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      font-size: 10.5px;
      color: #475569;
      line-height: 1.4;
      font-style: italic;
    }
    .btn-trail-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      margin-top: 4px;
    }
    .btn-trail-action:hover {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
    }
    .btn-trail-action.btn-website {
      background: #f0fdf4;
      border-color: #86efac;
      color: #15803d;
    }
    .btn-trail-action.btn-website:hover {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }
    .btn-trail-action.btn-download-gpx {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }
    .btn-trail-action.btn-download-gpx:hover {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    /* Saved Button */
    .btn-saved-toggle .saved-pill-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 900;
      background: rgba(225, 29, 72, 0.12);
      color: #e11d48;
      border: 1px solid rgba(225, 29, 72, 0.25);
    }
    .btn-saved-toggle.active {
      background: #ffe4e6 !important;
      border-color: #f43f5e !important;
      color: #be123c !important;
    }

    /* Hideable Bottom-Right Trail Types Key / Legend */
    .legend-wrapper {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      pointer-events: auto;
    }
    .legend-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      min-width: 205px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .dark .legend-card {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    }
    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 5px;
      margin-bottom: 2px;
    }
    .dark .legend-header { border-bottom-color: #334155; }
    .legend-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
    }
    .dark .legend-title { color: #94a3b8; }
    .legend-close-btn {
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      border-radius: 4px;
    }
    .legend-close-btn:hover { color: #0f172a; background: #e2e8f0; }
    .dark .legend-close-btn:hover { color: #f8fafc; background: #334155; }
    .legend-open-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
    }
    .legend-open-pill:hover {
      background: #ffffff;
      border-color: #10b981;
      color: #10b981;
    }
    .dark .legend-open-pill {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .dark .legend-open-pill:hover {
      background: #1e293b;
      border-color: #34d399;
      color: #34d399;
    }
    .legend-items {
      display: flex;
      flex-direction: column;
      gap: 5.5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
    }
    .dark .legend-item { color: #e2e8f0; }
    .legend-line {
      display: inline-block;
      width: 22px;
      height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-line.line-dashed {
      height: 0px;
      background: transparent !important;
    }

    /* Responsive Wings Menu trigger */
    @media (min-width: 769px) {

</head>

  <script>

  <script>
    // =========================================================================
    // CONFIGURATION & DATASET DEFINITIONS
    // =========================================================================
    const NZ_CENTER = [-41.5, 172.8];
    const NZ_ZOOM = window.innerWidth < 768 ? 5 : 6;
    const CACHE_DB_NAME = 'BMMC_MTB_DB';
    const CACHE_STORE_NAME = 'geojson_store';
    const CACHE_EXPIRY_MS = 24 * 60 * 60 * 1000; // 24 Hours

    const DATASETS = {
      great_rides: {
        id: 'great_rides',
        label: 'NZ Great Rides',
        color: '#9333ea', // Purple solid
        weight: 4.5,
        opacity: 0.7,
        local: ['data/mtb/nz_great_rides.geojson', './data/mtb/nz_great_rides.geojson', '../data/mtb/nz_great_rides.geojson'],
        dropbox: 'https://dl.dropboxusercontent.com/scl/fi/bklc3pcx2tfazrw4s5gts/nz_great_rides.geojson?rlkey=tg5tygn5d288266pzsofn321k&raw=1',
        arcgis: 'https://services.arcgis.com/CXBb7LAjgIIdcsPt/ArcGIS/rest/services/TIO_NZCycleTrail/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson&outSR=4326',
        visible: true,
        features: []
      },
      heartland: {
        id: 'heartland',
        label: 'Heartland Touring',
        color: '#0ea5e9',
        weight: 3.8,
        opacity: 0.9,
        local: ['data/mtb/heartland_touring.geojson', './data/mtb/heartland_touring.geojson', '../data/mtb/heartland_touring.geojson'],
        dropbox: 'https://dl.dropboxusercontent.com/scl/fi/mmvxgogl5aho5fliul3o8/heartland_touring.geojson?rlkey=hideb77zmfdu3dkhj0rssab51&raw=1',
        arcgis: "https://services.arcgis.com/CXBb7LAjgIIdcsPt/ArcGIS/rest/services/TIO_NZCycleTrail/FeatureServer/0/query?where=trailcategory%20NOT%20LIKE%20'%25Great%20Ride%25'&outFields=*&f=geojson&outSR=4326",
        visible: true,
        features: []
      },
      chch_cycle: {
        id: 'chch_cycle',
        label: 'CCC Major Cycleways',
        color: '#38bdf8', // Light blue solid (C1 bright green)
        weight: 3.8,
        opacity: 0.9,
        local: ['data/mtb/chch_cycleway.geojson', './data/mtb/chch_cycleway.geojson', '../data/mtb/chch_cycleway.geojson'],
        dropbox: 'https://dl.dropboxusercontent.com/scl/fi/6owmpsjaxck4xt508ektw/chch_cycleway.geojson?rlkey=972grk4m5qvo21wx4nud30gdq&raw=1',
        arcgis: 'https://opendata.arcgis.com/datasets/d9b5a1de32c4418a93b836fa254dfa8b_1.geojson',
        visible: true,
        features: []
      },
      chch_council: {
        id: 'chch_council',
        label: 'CCC MTB & Port Hills Tracks',
        color: '#22c55e',
        weight: 3.5,
        opacity: 0.95,
        local: ['data/mtb/chch_council_tracks.geojson', './data/mtb/chch_council_tracks.geojson', '../data/mtb/chch_council_tracks.geojson'],
        dropbox: 'https://dl.dropboxusercontent.com/scl/fi/zwttqsxcnpcfbv9lhsm2g/chch_council_tracks.geojson?rlkey=g7zobh6j2hemni4ie3ekbavd1&raw=1',
        arcgis: 'https://opendata.arcgis.com/datasets/866f1329087d46b4b4bd4b370aea297f_6.geojson',
        visible: true,
        features: []
      },
      doc_tracks: {
        id: 'doc_tracks',
        label: 'DOC Tracks',
        color: '#15803d', // Dark green dotted
        weight: 3.2,
        opacity: 0.9,
        local: ['data/mtb/doc_tracks.geojson', './data/mtb/doc_tracks.geojson', '../data/mtb/doc_tracks.geojson'],
        dropbox: 'https://dl.dropboxusercontent.com/scl/fi/6x191friyjd8zgmme386l/doc_tracks.geojson?rlkey=rvva6n536lafip9ds0b83dk4q&raw=1',
        arcgis: 'https://services1.arcgis.com/3JjYDyG3oajxU6HO/arcgis/rest/services/DOC_Tracks/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson&outSR=4326',
        visible: true,
        features: []
      }
    };

    // State Variables
    let map;
    let canvasRenderer;
    let activeGradeFilter = 'all';
    let isSavedOnlyVisible = false;
    let totalTrackCount = 0;

    // Layer groups stored on map
    const layerGroups = {};
    let importedGpxGroup;

    // =========================================================================
    // INDEXED-DB 24-HOUR CACHE ENGINE
    // =========================================================================
    function openCacheDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(CACHE_DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(CACHE_STORE_NAME)) {
            db.createObjectStore(CACHE_STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getCachedGeoJSON(key) {
      try {
        const db = await openCacheDB();
        return new Promise((resolve) => {
          const tx = db.transaction(CACHE_STORE_NAME, 'readonly');
          const store = tx.objectStore(CACHE_STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => {
            const entry = req.result;
            if (entry && (Date.now() - entry.timestamp) < CACHE_EXPIRY_MS) {
              resolve(entry.data);
            } else {
              resolve(null);
            }
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function setCachedGeoJSON(key, data) {
      try {
        const db = await openCacheDB();
        const tx = db.transaction(CACHE_STORE_NAME, 'readwrite');
        const store = tx.objectStore(CACHE_STORE_NAME);
        store.put({ id: key, data: data, timestamp: Date.now() });
      } catch (e) {}
    }

    // =========================================================================
    // SAVED TRAILS / FAVORITES & EXPORT LOGIC
    // =========================================================================
    const SAVED_STORAGE_KEY = 'bMMC_nz_mtb_saved_ids';

    function getSavedSet() {
      try {
        const raw = localStorage.getItem(SAVED_STORAGE_KEY);
        if (raw) return new Set(JSON.parse(raw));
      } catch (e) {}
      return new Set();
    }

    function toggleSaveTrack(id, evt) {
      if (evt) { evt.stopPropagation(); evt.preventDefault(); }
      const set = getSavedSet();
      if (set.has(id)) set.delete(id);
      else set.add(id);
      try { localStorage.setItem(SAVED_STORAGE_KEY, JSON.stringify([...set])); } catch (e) {}
      updateSavedBadge();
      renderSavedDropdown();
      reapplyFilters();
    }

    function updateSavedBadge() {
      const el = document.getElementById('savedCountBadge');
      if (el) el.textContent = getSavedSet().size;
    }

    function findFeatureByUid(uid) {
      for (const dsId of Object.keys(DATASETS)) {
        const feat = DATASETS[dsId].features.find(f => f.properties && f.properties.uid === uid);
        if (feat) return feat;
      }
      return null;
    }

    function zoomToTrack(uid) {
      const feat = findFeatureByUid(uid);
      if (!feat || !feat.geometry) return;
      const geomLayer = L.geoJSON(feat);
      const bounds = geomLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        setTimeout(() => {
          for (const id of Object.keys(layerGroups)) {
            layerGroups[id].eachLayer(layer => {
              if (layer.feature && layer.feature.properties && layer.feature.properties.uid === uid) {
                layer.openPopup();
              }
            });
          }
        }, 300);
      }
    }

    // =========================================================================
    // GPX & GEOJSON EXPORTERS
    // =========================================================================
    function escapeXML(str) {
      if (!str) return '';
      return String(str).replace(/[<>&'"]/g, c => {
        switch (c) {
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '&': return '&amp;';
          case '\'': return '&apos;';
          case '"': return '&quot;';
        }
      });
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 150);
    }

    function convertGeoJSONToGPX(featureOrFeatures, defaultName = 'bmmc_tracks') {
      const features = Array.isArray(featureOrFeatures) ? featureOrFeatures : [featureOrFeatures];
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpx += `<gpx version="1.1" creator="BMMC Aotearoa NZ MTB" xmlns="http://www.topografix.com/GPX/1/1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">\n`;
      gpx += `  <metadata>\n`;
      gpx += `    <name>${escapeXML(defaultName)}</name>\n`;
      gpx += `    <time>${new Date().toISOString()}</time>\n`;
      gpx += `  </metadata>\n`;

      features.forEach(feat => {
        const props = feat.properties || {};
        const geom = feat.geometry;
        if (!geom) return;

        const trkName = props.name || defaultName;
        const desc = props.description || props.comment || '';

        gpx += `  <trk>\n`;
        gpx += `    <name>${escapeXML(trkName)}</name>\n`;
        if (desc) gpx += `    <desc>${escapeXML(desc)}</desc>\n`;

        function lineToTrkseg(coordList) {
          let seg = `    <trkseg>\n`;
          coordList.forEach(pt => {
            const lon = pt[0];
            const lat = pt[1];
            const ele = pt[2];
            if (lat !== undefined && lon !== undefined && !isNaN(lat) && !isNaN(lon)) {
              if (ele !== undefined && !isNaN(ele)) {
                seg += `      <trkpt lat="${lat}" lon="${lon}"><ele>${ele}</ele></trkpt>\n`;
              } else {
                seg += `      <trkpt lat="${lat}" lon="${lon}"/>\n`;
              }
            }
          });
          seg += `    </trkseg>\n`;
          return seg;
        }

        if (geom.type === 'LineString') {
          gpx += lineToTrkseg(geom.coordinates);
        } else if (geom.type === 'MultiLineString') {
          geom.coordinates.forEach(lineCoords => {
            gpx += lineToTrkseg(lineCoords);
          });
        } else if (geom.type === 'Point') {
          const lon = geom.coordinates[0];
          const lat = geom.coordinates[1];
          gpx += `    <trkseg><trkpt lat="${lat}" lon="${lon}"/></trkseg>\n`;
        }
        gpx += `  </trk>\n`;
      });

      gpx += `</gpx>\n`;
      return gpx;
    }

    function downloadTrackGPX(uid) {
      const feat = findFeatureByUid(uid);
      if (!feat) {
        alert('Trail data is still loading or not found.');
        return;
      }
      const cleanName = (feat.properties.name || 'trail_track').replace(/[^a-zA-Z0-9_\- ]/g, '').trim().replace(/\s+/g, '_') || 'track';
      const gpxContent = convertGeoJSONToGPX(feat, feat.properties.name);
      downloadFile(gpxContent, `${cleanName}.gpx`, 'application/gpx+xml');
    }

    function downloadTrackGeoJSON(uid) {
      const feat = findFeatureByUid(uid);
      if (!feat) {
        alert('Trail data is still loading or not found.');
        return;
      }
      const cleanName = (feat.properties.name || 'trail_track').replace(/[^a-zA-Z0-9_\- ]/g, '').trim().replace(/\s+/g, '_') || 'track';
      const geojsonContent = JSON.stringify({
        type: 'FeatureCollection',
        features: [feat]
      }, null, 2);
      downloadFile(geojsonContent, `${cleanName}.geojson`, 'application/geo+json');
    }

    function downloadAllSavedGPX() {
      const savedSet = getSavedSet();
      if (savedSet.size === 0) {
        alert('You have no saved favorite trails yet.');
        return;
      }
      const savedFeatures = [];
      savedSet.forEach(uid => {
        const f = findFeatureByUid(uid);
        if (f) savedFeatures.push(f);
      });
      if (savedFeatures.length === 0) {
        alert('Saved trail coordinates are still loading, please wait a moment.');
        return;
      }
      const gpxContent = convertGeoJSONToGPX(savedFeatures, 'My_Saved_NZ_MTB_Trails');
      downloadFile(gpxContent, 'Saved_NZ_MTB_Trails.gpx', 'application/gpx+xml');
    }

    function downloadAllSavedGeoJSON() {
      const savedSet = getSavedSet();
      if (savedSet.size === 0) {
        alert('You have no saved favorite trails yet.');
        return;
      }
      const savedFeatures = [];
      savedSet.forEach(uid => {
        const f = findFeatureByUid(uid);
        if (f) savedFeatures.push(f);
      });
      if (savedFeatures.length === 0) {
        alert('Saved trail coordinates are still loading, please wait a moment.');
        return;
      }
      const geojsonContent = JSON.stringify({
        type: 'FeatureCollection',
        features: savedFeatures
      }, null, 2);
      downloadFile(geojsonContent, 'Saved_NZ_MTB_Trails.geojson', 'application/geo+json');
    }

    function renderSavedDropdown() {
      const container = document.getElementById('savedListContainer');
      if (!container) return;

      const savedSet = getSavedSet();
      if (savedSet.size === 0) {
        container.innerHTML = `
          <div style="padding: 12px 8px; text-align: center; color: #64748b; font-size: 11.5px; line-height: 1.5;">
            🤍 No saved trails yet.<br>Click <strong>Save</strong> on any trail popup to add it to your favorites.
          </div>
        `;
        return;
      }

      let html = '';
      savedSet.forEach(uid => {
        const feat = findFeatureByUid(uid);
        const name = feat ? feat.properties.name : 'Trail ' + uid;
        const lengthStr = feat && feat.properties.lengthStr ? feat.properties.lengthStr : '';
        const gradeText = feat && feat.properties.gradeText ? feat.properties.gradeText : '';
        const network = feat && feat.properties.network ? feat.properties.network : '';

        html += `
          <div class="saved-track-card">
            <div class="saved-track-title">${escapeHTML(name)}</div>
            <div class="saved-track-sub">
              ${lengthStr ? `<span>📏 ${escapeHTML(lengthStr)}</span>` : ''}
              ${gradeText ? `<span>• ${escapeHTML(gradeText)}</span>` : ''}
              ${network ? `<span>• ${escapeHTML(network)}</span>` : ''}
            </div>
            <div class="saved-track-actions">
              <button class="btn-saved-action" onclick="window.zoomToTrack('${uid}');" title="Zoom to trail on map">
                <span>🔍 Zoom</span>
              </button>
              <button class="btn-saved-action" onclick="window.downloadTrackGPX('${uid}');" title="Download GPX file">
                <span>📥 GPX</span>
              </button>
              <button class="btn-saved-action" onclick="window.downloadTrackGeoJSON('${uid}');" title="Download GeoJSON">
                <span>📄 GeoJSON</span>
              </button>
              <button class="btn-saved-action" style="margin-left:auto; color:#e11d48;" onclick="window.toggleSaveTrack('${uid}', event);" title="Remove from favorites">
                <span>✕</span>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // =========================================================================
    // GEOMETRY & LENGTH HELPERS
    // =========================================================================
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function calculateCoordsLengthKm(coords, geomType) {
      let total = 0;
      if (!coords || coords.length === 0) return 0;

      if (geomType === 'LineString') {
        for (let i = 0; i < coords.length - 1; i++) {
          total += getDistanceKm(coords[i][1], coords[i][0], coords[i+1][1], coords[i+1][0]);
        }
      } else if (geomType === 'MultiLineString') {
        coords.forEach(line => {
          for (let i = 0; i < line.length - 1; i++) {
            total += getDistanceKm(line[i][1], line[i][0], line[i+1][1], line[i+1][0]);
          }
        });
      }
      return total;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // =========================================================================
    // WALKING / TRAMPING CLASSIFICATION HELPER
    // =========================================================================
    function isWalkingTrampingOnly(p, datasetId) {
      if (!p) return false;

      const actRaw = p.activity_type || p.ActivityType || p.activity || p.Activity || 
                     p.Use || p.use || p.RouteType || p.track_type || p.TrackType || 
                     p.permitted_use || p.PermittedUse || '';
      const act = String(actRaw).trim().toLowerCase();
      
      const grade = String(p.MountainBikeClassification || p.grade || '').toLowerCase();
      const desc = String(p.Description || p.description || '').toLowerCase();
      const comment = String(p.Comment || p.comment || p.CharValue7 || '').toLowerCase();
      const name = String(p.RouteName || p.TechObjectName || p.assetName || p.name || '').toLowerCase();

      const allText = `${act} ${grade} ${desc} ${comment} ${name}`;

      const hasMtb = allText.includes('bike') || allText.includes('biking') || 
                     allText.includes('mtb') || allText.includes('cycle') || 
                     allText.includes('cycling');
      const isShared = allText.includes('shared') || allText.includes('multi-use') || allText.includes('multi use');

      if (hasMtb || isShared) {
        return false;
      }

      const isWalkingTramping = 
        act === 'walking / tramping' ||
        act === 'walking/tramping' ||
        act === 'walking & tramping' ||
        act.includes('walking / tramping') ||
        act.includes('walking/tramping') ||
        act.includes('walk') ||
        act.includes('tramp') ||
        allText.includes('walking / tramping') ||
        allText.includes('tramping track') ||
        allText.includes('walking track');

      return isWalkingTramping;
    }

    // =========================================================================
    // FEATURE NORMALISATION (INCLUDES CCC CYCLEWAY C1 BRIGHT GREEN LOGIC)
    // =========================================================================
    function normaliseGeoFeatures(datasetId, geojson) {
      if (!geojson || !geojson.features) return [];

      return geojson.features.map((feat, index) => {
        const p = feat.properties || {};
        const geom = feat.geometry || {};

        let name = '';
        let category = '';
        let gradeRaw = '';
        let finalKm = 0;
        let description = '';
        let comment = '';
        let network = '';
        let area = '';
        let website = '';
        let activityType = '';
        let isWalkingOnly = false;
        let isDocMtbPermitted = false;
        let strokeType = 'default';

        const calcKm = calculateCoordsLengthKm(geom.coordinates, geom.type);

        // 1. Christchurch Council Tracks
        if (datasetId === 'chch_council') {
          name = p.RouteName || p.name || 'Christchurch Council Track';
          gradeRaw = p.MountainBikeClassification || p.grade || '';
          
          if (p.RouteDistance !== undefined && p.RouteDistance !== null && p.RouteDistance !== '') {
            const numDist = parseFloat(String(p.RouteDistance).replace(/[^0-9.]/g, ''));
            if (!isNaN(numDist) && numDist > 0) {
              finalKm = numDist > 50 ? numDist / 1000 : numDist;
            }
          }
          
          description = p.Description || '';
          comment = p.Comment || '';
          network = p.RouteLandOwnership || 'Christchurch City Council';
          area = p.RouteArea || '';
          activityType = p.activity_type || p.ActivityType || p.activity || p.Activity || p.Use || p.RouteType || '';

          const isWalking = isWalkingTrampingOnly(p, 'chch_council');
          const actLower = String(activityType).toLowerCase();

          if (isWalking) {
            strokeType = 'chch_walking';
            isWalkingOnly = true;
          } else if (actLower.includes('shared') || actLower.includes('multi')) {
            strokeType = 'chch_shared';
            isWalkingOnly = false;
          } else if (actLower.includes('mtb') || actLower.includes('bike') || actLower.includes('cycle')) {
            strokeType = 'chch_mtb';
            isWalkingOnly = false;
          } else {
            const gradeLower = String(gradeRaw).toLowerCase();
            if (gradeLower && !gradeLower.includes('none') && !gradeLower.includes('n/a')) {
              strokeType = 'chch_mtb';
              isWalkingOnly = false;
            } else if (isWalking) {
              strokeType = 'chch_walking';
              isWalkingOnly = true;
            } else {
              strokeType = 'chch_shared';
              isWalkingOnly = false;
            }
          }
        }

        // 2. Christchurch Major Cycleways (C1 mapped to bright green)
        else if (datasetId === 'chch_cycle') {
          name = p.MajorCyclewayName || p.name || 'Christchurch Major Cycleway';
          description = p.Type || p.type || '';
          network = p.Ownership || 'Christchurch City Council';
          area = p.StrategicNetworkCategory || '';

          const isC1 = String(p.StrategicNetworkCategory || '').trim().toUpperCase() === 'C1';
          strokeType = isC1 ? 'chch_cycle_c1' : 'chch_cycle_solid';
          isWalkingOnly = false;
        }

        // 3. Heartland Touring
        else if (datasetId === 'heartland') {
          category = p.trailcategory || 'Heartland Ride';
          name = p.cycletrail || p.name || 'Heartland Touring Route';
          gradeRaw = p.grade || '';
          
          if (p.Length !== undefined && p.Length !== null && p.Length !== '') {
            const numLen = parseFloat(String(p.Length).replace(/[^0-9.]/g, ''));
            if (!isNaN(numLen) && numLen > 0) {
              finalKm = numLen > 500 ? numLen / 1000 : numLen;
            }
          }

          description = p.startfinish || p.description || '';
          
          const commentParts = [];
          if (p.facilitytype) commentParts.push(`Facility: ${p.facilitytype}`);
          if (p.surfacetype) commentParts.push(`Surface: ${p.surfacetype}`);
          if (p.comments) commentParts.push(p.comments);
          comment = commentParts.join(' • ');

          network = p.owner || '';
          area = p.sectioncodenov19 || '';
          website = p.websitelink || '';
          activityType = p.activity_type || '';

          const actLower = String(activityType || '').toLowerCase();
          const catLower = String(category || '').toLowerCase();
          if (actLower.includes('mtb') || actLower.includes('mountain') || catLower.includes('mountain')) {
            strokeType = 'heartland_mtb';
          } else {
            strokeType = 'heartland_shared';
          }
          isWalkingOnly = false;
        }

        // 4. NZ Great Rides
        else if (datasetId === 'great_rides') {
          category = p.trailcategory || 'Great Ride';
          name = p.cycletrail || p.name || 'NZ Great Ride';
          gradeRaw = p.grade || '';

          if (p.Length !== undefined && p.Length !== null && p.Length !== '') {
            const numLen = parseFloat(String(p.Length).replace(/[^0-9.]/g, ''));
            if (!isNaN(numLen) && numLen > 0) {
              finalKm = numLen > 500 ? numLen / 1000 : numLen;
            }
          }

          description = p.startfinish || p.description || '';

          const commentParts = [];
          if (p.facilitytype) commentParts.push(`Facility: ${p.facilitytype}`);
          if (p.surfacetype) commentParts.push(`Surface: ${p.surfacetype}`);
          if (p.comments) commentParts.push(p.comments);
          comment = commentParts.join(' • ');

          network = p.owner || '';
          area = p.sectioncodenov19 || '';
          website = p.websitelink || '';
          strokeType = 'great_rides_solid';
          isWalkingOnly = false;
        }

        // 5. DOC Tracks
        else if (datasetId === 'doc_tracks') {
          name = p.TechObjectName || p.assetName || p.name || 'DOC Track';

          if (p.Shape__Length !== undefined && p.Shape__Length !== null && p.Shape__Length !== '') {
            const mLen = parseFloat(p.Shape__Length);
            if (!isNaN(mLen) && mLen > 0) finalKm = mLen / 1000;
          }

          const descParts = [];
          if (p.CharName4) descParts.push(p.CharName4);
          if (p.CharValue4) descParts.push(p.CharValue4);
          description = descParts.join(': ');

          comment = p.CharValue7 || '';
          area = p.FlocID || '';
          activityType = p.activity_type || p.ActivityType || p.activity || p.Activity || p.Use || '';

          const isWalking = isWalkingTrampingOnly(p, 'doc_tracks');
          const actType = String(activityType).trim().toLowerCase();
          const hasMtb = actType.includes('mountain biking') || actType.includes('mtb') || actType.includes('bike') || actType === 'doc mountain biking permitted';

          if (hasMtb) {
            isDocMtbPermitted = true;
            strokeType = 'doc_mtb';
            isWalkingOnly = false;
          } else {
            isDocMtbPermitted = false;
            strokeType = 'doc_walking';
            isWalkingOnly = true;
          }
        }

        if (!finalKm || finalKm <= 0) {
          finalKm = calcKm;
        }
        const lengthStr = finalKm > 0 ? `${finalKm.toFixed(1)} km` : '';

        let gradeNum = 0;
        const gradeTextLower = String(gradeRaw).toLowerCase();
        if (gradeTextLower.includes('1') || gradeTextLower.includes('easiest')) gradeNum = 1;
        else if (gradeTextLower.includes('2') || gradeTextLower.includes('easy')) gradeNum = 2;
        else if (gradeTextLower.includes('3') || gradeTextLower.includes('intermediate')) gradeNum = 3;
        else if (gradeTextLower.includes('4') || gradeTextLower.includes('advanced')) gradeNum = 4;
        else if (gradeTextLower.includes('5') || gradeTextLower.includes('expert') || gradeTextLower.includes('6')) gradeNum = 5;

        const trackUid = `${datasetId}_${p.OBJECTID || p.id || index}_${name.slice(0, 16).replace(/[^a-zA-Z0-9]/g, '_')}`;

        return {
          type: 'Feature',
          geometry: geom,
          properties: {
            uid: trackUid,
            datasetId: datasetId,
            name: name,
            category: category,
            lengthStr: lengthStr,
            lengthKm: finalKm,
            gradeNum: gradeNum,
            gradeText: gradeRaw || (gradeNum ? `Grade ${gradeNum}` : (isDocMtbPermitted ? 'DOC MTB Permitted' : 'MTB Track')),
            description: description,
            comment: comment,
            network: network,
            area: area,
            website: website,
            activity_type: activityType,
            strokeType: strokeType,
            isWalkingOnly: isWalkingOnly,
            isDocMtbPermitted: isDocMtbPermitted,
            originalProps: p
          }
        };
      });
    }

    // =========================================================================
    // LAYER RENDERING & POPUPS

          <div class="trail-meta-row">
            ${props.category ? `<div>🏷️ <strong>Category:</strong> ${escapeHTML(props.category)}</div>` : ''}
            ${props.area ? `<div>📍 <strong>Area:</strong> ${escapeHTML(props.area)}</div>` : ''}
            ${props.network ? `<div>🏛️ <strong>Network:</strong> ${escapeHTML(props.network)}</div>` : `<div>🏷️ <strong>Network:</strong> ${escapeHTML(DATASETS[props.datasetId]?.label || 'NZ Trails')}</div>`}
            ${props.activity_type ? `<div>⚡ <strong>Activity Type:</strong> ${escapeHTML(props.activity_type)}</div>` : ''}
            ${props.description ? `<div style="margin-top:4px; line-height:1.4;"><strong>Description:</strong> ${escapeHTML(props.description)}</div>` : ''}

    function renderDatasetLayer(datasetId) {
      const cfg = DATASETS[datasetId];
      if (!layerGroups[datasetId]) {
        layerGroups[datasetId] = L.geoJSON(null, {
          renderer: canvasRenderer,
          style: (feat) => {
            const p = feat.properties || {};

            // StrategicNetworkCategory C1 is rendered in bright green!
            if (p.strokeType === 'chch_cycle_c1') {
              return { color: '#00e676', weight: 4.2, opacity: 0.95, dashArray: null, lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'chch_mtb') {
              return { color: '#22c55e', weight: 3.5, opacity: 0.95, dashArray: '3, 6', lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'chch_shared') {
              return { color: '#f97316', weight: 3.5, opacity: 0.95, dashArray: '3, 6', lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'chch_cycle_solid') {
              return { color: '#38bdf8', weight: 3.8, opacity: 0.9, dashArray: null, lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'heartland_mtb') {
              return { color: '#38bdf8', weight: 3.8, opacity: 0.95, dashArray: '3, 6', lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'heartland_shared') {
              return { color: '#f97316', weight: 3.8, opacity: 0.95, dashArray: '3, 6', lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'great_rides_solid') {
              return { color: '#9333ea', weight: 4.5, opacity: 0.7, dashArray: null, lineCap: 'round', lineJoin: 'round' };
            }
            if (p.strokeType === 'doc_mtb') {
              return { color: '#15803d', weight: 3.5, opacity: 0.95, dashArray: '3, 6', lineCap: 'round', lineJoin: 'round' };
            }

            return {
              color: cfg.color,
              weight: cfg.weight,
              opacity: cfg.opacity,
              lineCap: 'round',
              lineJoin: 'round'
            };
          },
          onEachFeature: (feat, layer) => {
            layer.bindPopup(() => buildTrailPopup(feat.properties), { maxWidth: 510 });
            layer.on('mouseover', function() {
              this.setStyle({ weight: (cfg.weight || 3.5) + 2 });
            });
            layer.on('mouseout', function() {
              layerGroups[datasetId].resetStyle(this);
            });
          }
        });
      }

      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();
      const savedSet = getSavedSet();

      const filteredFeatures = cfg.features.filter(feat => {
        const p = feat.properties;

        // Exclude walking-only tracks
        if (p.isWalkingOnly) return false;

        // Saved filter
        if (isSavedOnlyVisible && !savedSet.has(p.uid)) return false;

        // Grade filter
        if (activeGradeFilter !== 'all') {
          const reqGrade = parseInt(activeGradeFilter, 10);
          if (p.gradeNum !== reqGrade) return false;
        }

        // Search text
        if (search) {
          const hay = `${p.name} ${p.category} ${p.area} ${p.network} ${p.description} ${p.comment} ${p.gradeText} ${p.activity_type}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }

        return true;
      });

      layerGroups[datasetId].clearLayers();
      layerGroups[datasetId].addData({ type: 'FeatureCollection', features: filteredFeatures });

      if (cfg.visible && !map.hasLayer(layerGroups[datasetId])) {
        layerGroups[datasetId].addTo(map);
      } else if (!cfg.visible && map.hasLayer(layerGroups[datasetId])) {
        map.removeLayer(layerGroups[datasetId]);
      }

      const countPill = document.getElementById(
        datasetId === 'great_rides' ? 'cntGreatRides' :
        datasetId === 'heartland' ? 'cntHeartland' :
        datasetId === 'chch_cycle' ? 'cntChchCycle' :
        datasetId === 'chch_council' ? 'cntChchCouncil' : 'cntDocTracks'
      );
      if (countPill) countPill.textContent = filteredFeatures.length;
    }

    function reapplyFilters() {
      Object.keys(DATASETS).forEach(id => renderDatasetLayer(id));
      updateTotalStats();
    }

    function updateTotalStats() {
      let count = 0;
      Object.keys(layerGroups).forEach(id => {
        if (DATASETS[id].visible) {
          count += layerGroups[id].getLayers().length;
        }
      });
      if (importedGpxGroup) {
        count += importedGpxGroup.getLayers().length;
      }
      totalTrackCount = count;
      document.getElementById('lblDatasetLoading').textContent = `${count.toLocaleString()} trail segments displayed`;
    }

    // =========================================================================
    // STREAMLINED DATA LOADER
    // =========================================================================
    async function fetchDatasetData(cfg) {
      const cached = await getCachedGeoJSON(cfg.id);
      if (cached && cached.features && cached.features.length > 0) {
        console.log(`[Cache Hit] ${cfg.label} (${cached.features.length} features)`);
        return cached;
      }

      for (const url of cfg.local) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.features && data.features.length > 0) {
              console.log(`[Local Hit] Loaded ${cfg.label} from ${url}`);
              setCachedGeoJSON(cfg.id, data);
              return data;
            }
          }
        } catch (e) {}
      }

      if (cfg.dropbox) {
        const directUrl = cfg.dropbox
          .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
          .replace('&st=', '&_st=')
          .replace('dl=0', 'raw=1');

        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 15000);
          const res = await fetch(directUrl, { signal: controller.signal });
          clearTimeout(timer);

          if (res.ok) {
            const data = await res.json();
            if (data && data.features && data.features.length > 0) {
              console.log(`[Dropbox Hit] Loaded ${cfg.label}`);
              setCachedGeoJSON(cfg.id, data);
              return data;
            }
          }
        } catch (e) {
          console.warn(`[Dropbox Direct Failed] ${cfg.label}:`, e);
        }
      }

      if (cfg.arcgis) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 20000);
          const res = await fetch(cfg.arcgis, { signal: controller.signal });
          clearTimeout(timer);

          if (res.ok) {
            const data = await res.json();
            if (data && data.features && data.features.length > 0) {
              console.log(`[ArcGIS Hit] Loaded ${cfg.label}`);
              setCachedGeoJSON(cfg.id, data);
              return data;
            }
          }
        } catch (e) {
          console.warn(`[ArcGIS Failed] ${cfg.label}:`, e);
        }
      }

      console.error(`[Load Failed] Could not retrieve ${cfg.label}`);
      return null;
    }

    async function loadAllDatasetsPipeline() {
      const loadOrder = ['great_rides', 'heartland', 'chch_cycle', 'chch_council', 'doc_tracks'];
      document.getElementById('lblDatasetLoading').textContent = 'Loading trail datasets...';

      await Promise.allSettled(
        loadOrder.map(async (id) => {
          const cfg = DATASETS[id];
          try {
            const geojson = await fetchDatasetData(cfg);
            if (geojson) {
              cfg.features = normaliseGeoFeatures(id, geojson);
              renderDatasetLayer(id);
              updateTotalStats();
            }
          } catch (err) {
            console.warn(`Error loading dataset ${cfg.label}:`, err);
          }
        })
      );

      updateTotalStats();
      renderSavedDropdown();
    }

    // =========================================================================
    // GPX IMPORT ENGINE (SOLID PINK LINE)
    // =========================================================================
    function parseGPXToGeoJSON(gpxXmlText, fileName) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(gpxXmlText, 'text/xml');
      const features = [];

      // 1. Tracks (<trk>)
      const trkNodes = xmlDoc.querySelectorAll('trk');
      trkNodes.forEach((trk, tIdx) => {
        const trkName = trk.querySelector('name')?.textContent?.trim() || `${fileName} (Track ${tIdx + 1})`;
        const trksegs = trk.querySelectorAll('trkseg');
        const multiLine = [];

        trksegs.forEach(seg => {
          const pts = seg.querySelectorAll('trkpt');
          const line = [];
          pts.forEach(pt => {
            const lat = parseFloat(pt.getAttribute('lat'));
            const lon = parseFloat(pt.getAttribute('lon'));
            if (!isNaN(lat) && !isNaN(lon)) line.push([lon, lat]);
          });
          if (line.length > 0) multiLine.push(line);
        });

        if (multiLine.length > 0) {
          const geom = multiLine.length === 1
            ? { type: 'LineString', coordinates: multiLine[0] }
            : { type: 'MultiLineString', coordinates: multiLine };
          const distKm = calculateCoordsLengthKm(geom.coordinates, geom.type);

          features.push({
            type: 'Feature',
            geometry: geom,
            properties: {
              name: trkName,
              fileName: fileName,
              lengthKm: distKm,
              lengthStr: distKm > 0 ? `${distKm.toFixed(2)} km` : '',
              isImported: true
            }
          });
        }
      });

      // 2. Routes (<rte>) if present
      const rteNodes = xmlDoc.querySelectorAll('rte');
      rteNodes.forEach((rte, rIdx) => {
        const rteName = rte.querySelector('name')?.textContent?.trim() || `${fileName} (Route ${rIdx + 1})`;
        const pts = rte.querySelectorAll('rtept');
        const line = [];
        pts.forEach(pt => {
          const lat = parseFloat(pt.getAttribute('lat'));
          const lon = parseFloat(pt.getAttribute('lon'));
          if (!isNaN(lat) && !isNaN(lon)) line.push([lon, lat]);
        });

        if (line.length > 0) {
          const geom = { type: 'LineString', coordinates: line };
          const distKm = calculateCoordsLengthKm(geom.coordinates, geom.type);
          features.push({
            type: 'Feature',
            geometry: geom,
            properties: {
              name: rteName,
              fileName: fileName,
              lengthKm: distKm,
              lengthStr: distKm > 0 ? `${distKm.toFixed(2)} km` : '',
              isImported: true
            }
          });
        }
      });

      return features;
    }

    function handleGPXFiles(files) {
      if (!files || files.length === 0) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const features = parseGPXToGeoJSON(text, file.name);

            if (features.length === 0) {
              alert(`Could not extract valid track coordinates from "${file.name}".`);
              return;
            }

            features.forEach(feat => {
              importedGpxGroup.addData(feat);
            });

            // Zoom map to the newly imported GPX bounds
            const bounds = importedGpxGroup.getBounds();
            if (bounds.isValid()) {
              map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            }

            updateTotalStats();
            document.getElementById('lblDatasetLoading').textContent = `Imported: ${file.name} (${features.length} track${features.length > 1 ? 's' : ''})`;
          } catch (err) {
            console.error('GPX parse error:', err);
            alert(`Error parsing GPX file "${file.name}": ${err.message}`);
          }
        };
        reader.readAsText(file);
      });
    }

    function buildImportedPopup(props, layer) {
      return `
        <div class="trail-popup-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
            <span class="trail-pill" style="background:#fce7f3; color:#be185d; border:1px solid #f472b6;">
              📂 Imported GPX (Pink Line)
            </span>
          </div>
          <h3>${escapeHTML(props.name || 'Imported GPX Track')}</h3>
          ${props.lengthStr ? `<div class="trail-distance-sub">📏 <strong>Distance:</strong> ${escapeHTML(props.lengthStr)}</div>` : ''}
          <div class="trail-meta-row">
            <div>📁 <strong>File:</strong> ${escapeHTML(props.fileName || 'Local Drive GPX')}</div>
          </div>
          <button class="btn-trail-action" style="margin-top:6px; color:#e11d48;" onclick="window.removeImportedTrack('${layer._leaflet_id}')">
            <span>🗑️</span> Remove Imported Track
          </button>
        </div>
      `;
    }

    window.removeImportedTrack = function(leafletId) {
      if (!importedGpxGroup) return;
      const layer = importedGpxGroup.getLayer(leafletId);
      if (layer) {
        map.closePopup();
        importedGpxGroup.removeLayer(layer);
        updateTotalStats();
      }
    };

    // =========================================================================
    // BASEMAP MANAGEMENT
    // =========================================================================
    const basemaps = {
      natgeo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; National Geographic Society',
        maxNativeZoom: 12,
        maxZoom: 19
      }),
      topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; Topographic Survey',
        maxNativeZoom: 18,
        maxZoom: 19
      }),
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; Earthstar Geographics',
        maxNativeZoom: 18,
        maxZoom: 19
      })
    };

    function setBasemap(type) {
      Object.values(basemaps).forEach(l => {
        if (map && map.hasLayer(l)) map.removeLayer(l);
      });
      if (map && basemaps[type]) basemaps[type].addTo(map);

      document.querySelectorAll('.layer-grid .layer-option-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btnLayer${type.charAt(0).toUpperCase() + type.slice(1)}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // =========================================================================
    // INIT & DOM BINDINGS
    // =========================================================================
    function initMap() {
      map = L.map('map', {
        center: NZ_CENTER,
        zoom: NZ_ZOOM,
        minZoom: 4,
        maxZoom: 19,
        maxBounds: [[-50, 160], [-30, 185]],
        closePopupOnClick: true,
        zoomControl: false
      });

      canvasRenderer = L.canvas({ padding: 0.5 });
      L.control.zoom({ position: 'topright' }).addTo(map);

      basemaps.topo.addTo(map);

      // GPX Layer Group (Solid Pink Line: #ff2d87)
      importedGpxGroup = L.geoJSON(null, {
        style: {
          color: '#ff2d87', // Pink solid line
          weight: 4.8,
          opacity: 0.95,
          dashArray: null,
          lineCap: 'round',
          lineJoin: 'round'
        },
        onEachFeature: (feat, layer) => {
          layer.bindPopup(() => buildImportedPopup(feat.properties, layer), { maxWidth: 480 });
          layer.on('mouseover', function() { this.setStyle({ weight: 6.8 }); });
          layer.on('mouseout', function() { this.setStyle({ weight: 4.8 }); });
        }
      }).addTo(map);

      // FIX: Explicitly bind close button on any opened popup
      map.on('popupopen', (e) => {
        const container = e.popup._container;
        if (!container) return;
        const closeBtn = container.querySelector('.leaflet-popup-close-button');
        if (closeBtn) {
          closeBtn.onclick = (evt) => {
            evt.preventDefault();
            evt.stopPropagation();
            map.closePopup(e.popup);
          };
        }
      });

      map.on('zoomend', () => {
        const curZoom = map.getZoom();
        const activeBasemapBtn = document.querySelector('.layer-grid .layer-option-btn.active');
        if (activeBasemapBtn && activeBasemapBtn.id === 'btnLayerNatGeo' && curZoom > 12) {
          if (!map.hasLayer(basemaps.topo)) {
            map.removeLayer(basemaps.natgeo);
            basemaps.topo.addTo(map);
          }
        } else if (activeBasemapBtn && activeBasemapBtn.id === 'btnLayerNatGeo' && curZoom <= 12) {
          if (!map.hasLayer(basemaps.natgeo)) {
            map.removeLayer(basemaps.topo);
            basemaps.topo.addTo(map);
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMap();

      window.toggleSaveTrack = toggleSaveTrack;
      window.downloadTrackGPX = downloadTrackGPX;
      window.downloadTrackGeoJSON = downloadTrackGeoJSON;
      window.downloadAllSavedGPX = downloadAllSavedGPX;
      window.downloadAllSavedGeoJSON = downloadAllSavedGeoJSON;
      window.zoomToTrack = zoomToTrack;

      updateSavedBadge();

      // Basemap Buttons
      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerSat')?.addEventListener('click', () => setBasemap('sat'));

      // Layers Dropdown
      const btnLayersToggle = document.getElementById('btnLayersToggle');
      const layerDropdownCard = document.getElementById('layerDropdownCard');
      const btnToggleSaved = document.getElementById('btnToggleSaved');
      const savedDropdownCard = document.getElementById('savedDropdownCard');

      btnLayersToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        savedDropdownCard?.classList.remove('show');
        layerDropdownCard?.classList.toggle('show');
      });

      // Saved Favorites Dropdown Toggle
      btnToggleSaved?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerDropdownCard?.classList.remove('show');
        renderSavedDropdown();
        savedDropdownCard?.classList.toggle('show');
      });

      // Close dropdowns when clicking outside
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) {
          layerDropdownCard?.classList.remove('show');
        }
        if (!e.target.closest('.saved-switcher-container')) {
          savedDropdownCard?.classList.remove('show');
        }
      });

      // Filter Map Toggle inside Saved Dropdown
      const btnSavedFilterToggle = document.getElementById('btnSavedFilterToggle');
      const lblSavedFilterState = document.getElementById('lblSavedFilterState');
      btnSavedFilterToggle?.addEventListener('click', () => {
        isSavedOnlyVisible = !isSavedOnlyVisible;
        btnToggleSaved?.classList.toggle('active', isSavedOnlyVisible);
        btnSavedFilterToggle?.classList.toggle('active', isSavedOnlyVisible);
        if (lblSavedFilterState) {
          lblSavedFilterState.textContent = isSavedOnlyVisible ? 'Filter: Favorites Only' : 'Show All on Map';
        }
        reapplyFilters();
      });

      // GPX File Input Integration
      const btnImportGPX = document.getElementById('btnImportGPX');
      const gpxFileInput = document.getElementById('gpxFileInput');
      btnImportGPX?.addEventListener('click', () => gpxFileInput?.click());
      gpxFileInput?.addEventListener('change', (e) => {
        handleGPXFiles(e.target.files);
        gpxFileInput.value = '';
      });

      // Bottom-Right Legend Toggle Logic
      const trailLegendCard = document.getElementById('trailLegendCard');
      const btnCloseLegend = document.getElementById('btnCloseLegend');
      const btnOpenLegend = document.getElementById('btnOpenLegend');

      btnCloseLegend?.addEventListener('click', () => {
        trailLegendCard.style.display = 'none';
        btnOpenLegend.style.display = 'inline-flex';
      });

      btnOpenLegend?.addEventListener('click', () => {
        btnOpenLegend.style.display = 'none';
        trailLegendCard.style.display = 'flex';
      });

      // Dataset Overlay Toggles
      const toggleLayer = (datasetId, btnId) => {
        DATASETS[datasetId].visible = !DATASETS[datasetId].visible;
        const btn = document.getElementById(btnId);
        if (DATASETS[datasetId].visible) btn?.classList.add('active');
        else btn?.classList.remove('active');
        renderDatasetLayer(datasetId);
        updateTotalStats();
      };

      document.getElementById('btnToggleGreatRides')?.addEventListener('click', () => toggleLayer('great_rides', 'btnToggleGreatRides'));
      document.getElementById('btnToggleHeartland')?.addEventListener('click', () => toggleLayer('heartland', 'btnToggleHeartland'));
      document.getElementById('btnToggleChchCycle')?.addEventListener('click', () => toggleLayer('chch_cycle', 'btnToggleChchCycle'));
      document.getElementById('btnToggleChchCouncil')?.addEventListener('click', () => toggleLayer('chch_council', 'btnToggleChchCouncil'));
      document.getElementById('btnToggleDocTracks')?.addEventListener('click', () => toggleLayer('doc_tracks', 'btnToggleDocTracks'));

      // Grade Filter Chips
      document.querySelectorAll('.filter-chip[data-grade]').forEach(chip => {
        chip.addEventListener('click', function() {
          document.querySelectorAll('.filter-chip[data-grade]').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          activeGradeFilter = this.dataset.grade;
          reapplyFilters();
        });
      });

      // Fit NZ Button
      document.getElementById('btnFitNZ')?.addEventListener('click', () => {
        map.setView(NZ_CENTER, NZ_ZOOM);
      });

      // Search Box
      const searchInput = document.getElementById('mapSearchInput');
      const clearSearchBtn = document.getElementById('clearMapSearch');
      searchInput?.addEventListener('input', (e) => {
        clearSearchBtn.style.display = e.target.value ? 'flex' : 'none';
        reapplyFilters();
      });
      clearSearchBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        reapplyFilters();
        searchInput.focus();
      });

      // Load remote/local datasets concurrently
      loadAllDatasetsPipeline();
    });
  </script>
</body>
