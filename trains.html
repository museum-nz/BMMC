<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa NZ Railway History &amp; Heritage Map — BMMC</title>

  <!-- Instant Theme Sync -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('bMMC_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect for Tile & CDN Performance -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://tiles.openrailwaymap.org" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Inline Train Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚂</text></svg>">

  <!-- Leaflet & Plugins CSS with CDN Fallbacks -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.Default.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css';" />

  <!-- Master Stylesheet & Offline Adapter -->
  <link rel="stylesheet" href="styles.css" onerror="this.onerror=null;">
  <script src="offline-adapter.js" onerror="this.onerror=null;"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --pill-zoom-factor: 1;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1329;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #aad3df;
      z-index: 1;
    }

    /* Top-Right Zoom Controls */
    .leaflet-top.leaflet-right .leaflet-control-zoom {
      margin-top: 62px;
      margin-right: 16px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .leaflet-control-zoom a {
      background-color: rgba(255, 255, 255, 0.94) !important;
      color: #0f172a !important;
      border-color: rgba(203, 213, 225, 0.8) !important;
      transition: all 0.15s ease !important;
    }
    .leaflet-control-zoom a:hover {
      background-color: #ffffff !important;
      color: #0284c7 !important;
    }
    .dark .leaflet-top.leaflet-right .leaflet-control-zoom {
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .dark .leaflet-control-zoom a {
      background-color: rgba(15, 23, 42, 0.94) !important;
      color: #f8fafc !important;
      border-color: rgba(51, 65, 85, 0.8) !important;
    }
    .dark .leaflet-control-zoom a:hover {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
    }

    /* Top Floating Controls Bar */
    .top-controls-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .top-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .top-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .top-action-btn:hover {
      background: #ffffff;
      border-color: #0284c7;
      color: #0284c7;
      transform: translateY(-1px);
    }
    .top-action-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .dark .top-action-btn {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .dark .top-action-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .dark .top-action-btn.active {
      background: #082f49;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Search Box */
    .map-search-box {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      min-width: 170px;
      max-width: 260px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      padding: 0 10px;
    }
    .dark .map-search-box {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .map-search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      padding-left: 6px;
    }
    .dark .map-search-box input { color: #f8fafc; }
    .search-icon { font-size: 13px; color: #64748b; flex-shrink: 0; }
    .clear-search-btn {
      display: none;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dark .clear-search-btn { background: #334155; color: #cbd5e1; }

    /* Unified Layers Switcher */
    .layer-switcher-container { position: relative; display: inline-block; }
    .layer-dropdown-card {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 310px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 10px;
      z-index: 2000;
      flex-direction: column;
      gap: 8px;
    }
    .layer-dropdown-card.show { display: flex; }
    .dark .layer-dropdown-card {
      background: rgba(15, 23, 42, 0.97);
      border-color: #334155;
      box-shadow: 0 12px 32px rgba(0,0,0,0.65);
    }
    .layer-section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #64748b;
      padding: 2px 4px 0;
    }
    .dark .layer-section-title { color: #94a3b8; }
    .layer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .layer-section-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 2px 0;
    }
    .dark .layer-section-divider { background: #334155; }
    .layer-overlay-col {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .layer-option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: #f8fafc;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
    }
    .dark .layer-option-btn { background: #1e293b; color: #cbd5e1; }
    .layer-option-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .dark .layer-option-btn.active {
      background: #082f49;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Red Historic Networks Active Style */
    .layer-option-btn.btn-historic-net.active {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }
    .dark .layer-option-btn.btn-historic-net.active {
      background: #450a0a !important;
      border-color: #f87171 !important;
      color: #fca5a5 !important;
    }

    /* Amber Bush Tramways Active Style */
    .layer-option-btn.btn-bush-tram.active {
      background: #fffbeb !important;
      border-color: #f59e0b !important;
      color: #b45309 !important;
    }
    .dark .layer-option-btn.btn-bush-tram.active {
      background: #451a03 !important;
      border-color: #fbbf24 !important;
      color: #fde68a !important;
    }

    .layer-opt-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .layer-status-indicator {
      font-weight: 900;
      font-size: 11px;
      margin-left: auto;
      opacity: 0;
    }
    .layer-option-btn.active .layer-status-indicator {
      opacity: 1;
    }

    /* Numeric Badge Pills */
    .stn-count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.08);
      color: #475569;
      margin-left: 4px;
      letter-spacing: 0;
    }
    .dark .stn-count-pill {
      background: rgba(255, 255, 255, 0.12);
      color: #94a3b8;
    }
    .layer-option-btn.active .stn-count-pill {
      background: rgba(2, 132, 199, 0.16);
      color: #0284c7;
    }
    .dark .layer-option-btn.active .stn-count-pill {
      background: rgba(56, 189, 248, 0.22);
      color: #38bdf8;
    }

    /* Station Sub-Types Styling */
    .station-div-icon { background: none !important; border: none !important; }
    .station-marker-pin {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      border: 2px solid;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }
    .station-marker-pin:hover {
      transform: scale(1.4) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5) !important;
      z-index: 999999 !important;
    }
    .station-marker-pin.saved-station {
      box-shadow: 0 0 0 2px #f43f5e, 0 2px 10px rgba(244, 63, 94, 0.5) !important;
    }
    .stn-heart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 8px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
      pointer-events: none;
    }
    
    .station-marker-pin.stn-active {
      border-color: #059669;
      color: #065f46;
    }
    .station-marker-pin.stn-regional {
      border-color: #d97706;
      color: #92400e;
      background: rgba(255, 251, 235, 0.96);
    }
    .station-marker-pin.stn-heritage {
      border-color: #64748b;
      color: #334155;
      background: rgba(241, 245, 249, 0.92);
      filter: grayscale(25%);
    }

    .dark .station-marker-pin.stn-active {
      background: rgba(6, 78, 59, 0.92);
      border-color: #34d399;
      color: #a7f3d0;
    }
    .dark .station-marker-pin.stn-regional {
      background: rgba(69, 39, 10, 0.92);
      border-color: #fbbf24;
      color: #fde68a;
    }
    .dark .station-marker-pin.stn-heritage {
      background: rgba(30, 41, 59, 0.92);
      border-color: #94a3b8;
      color: #cbd5e1;
    }

    .station-sub-toggle-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 6px;
      border-left: 2px solid #e2e8f0;
      margin-bottom: 6px;
    }
    .dark .station-sub-toggle-group {
      border-left-color: #334155;
    }

    /* Era Bar */
    .era-bar {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 0;
      max-width: max-content;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .era-bar::-webkit-scrollbar { display: none; }
    .era-chip {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .era-chip:hover, .era-chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* Floating Timeline Slider at Bottom Left */
    .year-slider-container {
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: calc(100% - 40px);
      max-width: 460px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      z-index: 1000;
      pointer-events: auto;
    }
    .dark .year-slider-container {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .year-slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .timeline-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
    }
    .dark .timeline-title-group { color: #f8fafc; }
    .btn-timeline-play {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(2,132,199,0.4);
    }
    .btn-timeline-play.playing { background: #ef4444; }
    .item-counter-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(2,132,199,0.12);
      color: #0284c7;
      border: 1px solid rgba(2,132,199,0.25);
    }
    .dark .item-counter-badge {
      background: rgba(56,189,248,0.15);
      color: #38bdf8;
      border-color: rgba(56,189,248,0.3);
    }
    .range-text {
      font-size: 12px;
      font-weight: 900;
      color: #0284c7;
      font-family: monospace;
    }
    .dark .range-text { color: #38bdf8; }

    .dual-slider-track-wrapper {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
    }
    .slider-track-bg {
      position: absolute;
      width: 100%;
      height: 6px;
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark .slider-track-bg { background: #334155; }
    .slider-track-fill {
      position: absolute;
      height: 6px;
      background: #0284c7;
      border-radius: 3px;
      pointer-events: none;
    }
    .dark .slider-track-fill { background: #38bdf8; }
    .dual-slider-track-wrapper input[type="range"] {
      position: absolute;
      width: 100%;
      height: 6px;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      z-index: 10;
    }
    .dual-slider-track-wrapper input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Markers & Leader Line Pills */
    .history-div-icon { background: none !important; border: none !important; }
    .nz-train-marker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      transition: transform 0.15s ease;
    }
    .nz-train-marker:hover {
      transform: scale(1.06);
      z-index: 100000 !important;
    }

    .marker-pill {
      display: inline-flex !important;
      align-items: center !important;
      gap: calc(7px * var(--pill-zoom-factor, 1)) !important;
      background: rgba(255, 255, 255, 0.50) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      color: #0f172a !important;
      padding: calc(4px * var(--pill-zoom-factor, 1)) calc(8px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(12px * var(--pill-zoom-factor, 1)) !important;
      width: auto !important;
      max-width: calc(260px * var(--pill-zoom-factor, 1)) !important;
      min-height: calc(38px * var(--pill-zoom-factor, 1)) !important;
      border: 1.5px solid rgba(2, 132, 199, 0.75) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15) !important;
      overflow: hidden !important;
      user-select: none !important;
      transition: max-width 0.12s ease-out, min-height 0.12s ease-out, gap 0.12s ease-out !important;
    }
    .dark .marker-pill {
      background: rgba(15, 23, 42, 0.50) !important;
      border-color: rgba(56, 189, 248, 0.75) !important;
    }

    .marker-thumb-box {
      width: calc(34px * var(--pill-zoom-factor, 1)) !important;
      height: calc(32px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(6px * var(--pill-zoom-factor, 1)) !important;
      overflow: hidden !important;
      flex-shrink: 0 !important;
      background: rgba(226, 232, 240, 0.50) !important;
      border: 1px solid rgba(15, 23, 42, 0.15) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: width 0.12s ease-out, height 0.12s ease-out !important;
    }
    .dark .marker-thumb-box {
      background: rgba(30, 41, 59, 0.50) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
    }
    .marker-thumb-img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .marker-text-block {
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      min-width: 0 !important;
      flex: 1 !important;
      text-align: left !important;
      line-height: 1.25 !important;
    }
    .marker-header-row {
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
      margin-bottom: 2px !important;
    }

    .marker-date-tag {
      background: rgba(224, 242, 254, 0.85) !important;
      color: #0369a1 !important;
      border: 1px solid rgba(186, 230, 253, 0.8) !important;
      padding: calc(1px * var(--pill-zoom-factor, 1)) calc(5px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(5px * var(--pill-zoom-factor, 1)) !important;
      font-size: calc(9.5px * var(--pill-zoom-factor, 1)) !important;
      font-weight: 900 !important;
      line-height: 1.2 !important;
      white-space: nowrap !important;
      transition: font-size 0.12s ease-out, padding 0.12s ease-out !important;
    }
    .dark .marker-date-tag {
      background: rgba(3, 105, 161, 0.85) !important;
      color: #e0f2fe !important;
      border-color: rgba(56, 189, 248, 0.8) !important;
    }

    .marker-headline-text {
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      white-space: nowrap !important;
      font-size: calc(11px * var(--pill-zoom-factor, 1)) !important;
      font-weight: 850 !important;
      color: #0f172a !important;
      letter-spacing: -0.1px !important;
      line-height: 1.25 !important;
      transition: font-size 0.12s ease-out !important;
    }
    .dark .marker-headline-text { color: #f1f5f9 !important; }

    .marker-pin-tail {
      width: 0 !important;
      height: 0 !important;
      border-left: 6px solid transparent !important;

    const NZ_CENTER = [-41.2865, 174.2];

    const CONSISTENT_EVENT_ZOOM = 14;

    let map;

    let historicNetLayer = null;
    let bushTramLayer = null;
    let railInfraLayer = null;
    let railInfraSpansLayer = null;

    let isRailwaysVisible = true;
    let isHistoricNetVisible = true;
    let isBushTramsVisible = true;
    let isRailInfraVisible = false;
    let isMilestonesVisible = true;

    // Station Layers & Visibility
    const stnLayers = {
      regional: L.layerGroup(),
      active: L.layerGroup(),
      heritage: L.layerGroup()
    };
    const stnVisibility = { regional: true, active: true, heritage: true };

    let allStationRecords = [];
    let isTimelinePlaying = false;

    // =========================================================================
    // 7 x 24 HOURS (168-HR) CLIENT PERSISTENT CACHE (IndexedDB + localStorage)
    // =========================================================================
    const CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000;

    const DataCache = {
      dbPromise: null,
      getDB() {
        if (!this.dbPromise) {
          this.dbPromise = new Promise((resolve) => {
            if (!window.indexedDB) return resolve(null);
            try {
              const req = indexedDB.open('bMMC_TrainsCacheDB', 1);
              req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('cache')) {
                  db.createObjectStore('cache', { keyPath: 'key' });
                }
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => resolve(null);
            } catch (err) {
              resolve(null);
            }
          });
        }
        return this.dbPromise;
      },
      async get(key) {
        try {
          const db = await this.getDB();
          if (db) {
            return await new Promise((resolve) => {
              const tx = db.transaction('cache', 'readonly');
              const store = tx.objectStore('cache');
              const req = store.get(key);
              req.onsuccess = () => {
                const res = req.result;
                if (res && res.time && (Date.now() - res.time < CACHE_TTL_MS)) {
                  resolve(res.data);
                } else {
                  resolve(null);
                }
              };
              req.onerror = () => resolve(null);
            });
          }
        } catch (e) {}

        try {
          const raw = localStorage.getItem('bMMC_7D_' + key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.time && (Date.now() - parsed.time < CACHE_TTL_MS)) {
              return parsed.data;
            }
          }
        } catch (e) {}
        return null;
      },
      async set(key, data) {
        const payload = { key: key, data: data, time: Date.now() };
        try {
          const db = await this.getDB();
          if (db) {
            const tx = db.transaction('cache', 'readwrite');
            tx.objectStore('cache').put(payload);
            return;
          }
        } catch (e) {}
        try {
          localStorage.setItem('bMMC_7D_' + key, JSON.stringify(payload));
        } catch (e) {}
      }
    };

    // Multi-download race: queries candidate sources simultaneously with Promise.any
    async function fetchFastestValidJson(candidates) {
      const controllers = candidates.map(() => new AbortController());
      const promises = candidates.map((url, idx) => {
        return new Promise(async (resolve, reject) => {
          if (!url) return reject(new Error('Empty URL'));
          try {
            const timeoutId = setTimeout(() => controllers[idx].abort(), 7000);
            const res = await fetch(url, { signal: controllers[idx].signal });
            clearTimeout(timeoutId);
            if (!res.ok) return reject(new Error('HTTP ' + res.status));
            const text = await res.text();
            if (text && text.trim().length > 20 && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
              resolve(JSON.parse(text));
            } else {
              reject(new Error('Invalid JSON payload'));
            }
          } catch (err) {
            reject(err);
          }
        });
      });

      try {
        const fastest = await Promise.any(promises);
        controllers.forEach(c => c.abort());
        return fastest;
      } catch (err) {
        return null;
      }
    }

          weight: weight,
          opacity: 0.90,
          lineCap: 'round',
          lineJoin: 'round'
        },
        onEachFeature: (feature, layer) => {
          const p = feature.properties || {};
          layer.bindPopup(l => p.layer_type === 'track' ? buildMainTrunkPopup(p, l) : buildHistoricLinePopup(p, l), { maxWidth: 280 });
          bindLineGroupInteractions(historicNetLayer, layer, () => ({
            weight: getHistoricNetWeight(map.getZoom()) + 2.5, color: '#991b1b', opacity: 1

      historicNetLayer.on('layeradd', () => lineGroupCache.clear());

    function normalizeStationSubType(raw) {
      if (!raw) return 'regional';
      const s = String(raw).toLowerCase();
      if (s.includes('active') || s.includes('commuter') || s.includes('metro') || s.includes('passenger')) return 'active';
      if (s.includes('herit') || s.includes('disuse') || s.includes('close') || s.includes('preserv') || s.includes('museum') || s.includes('halt')) return 'heritage';
      return 'regional';
    }

    async function loadMainTrunkAndStations() {
      let geojson = await DataCache.get('main_trunk_stations');
      if (!geojson) {
        geojson = await fetchFastestValidJson(MAIN_TRUNK_STATIONS_URLS);
        if (geojson) DataCache.set('main_trunk_stations', geojson);
      }
      if (!geojson) return;

      const lineFeatures = [];
      const pointFeatures = [];
      const features = geojson.type === 'FeatureCollection' ? (geojson.features || []) : (geojson.type === 'Feature' ? [geojson] : []);

      features.forEach(f => {
        if (!f || !f.geometry) return;
        if (f.geometry.type === 'LineString' || f.geometry.type === 'MultiLineString') {
          lineFeatures.push(f);
        } else if (f.geometry.type === 'Point') {
          pointFeatures.push(f);
        }
      });

      if (lineFeatures.length > 0 && historicNetLayer) {
        historicNetLayer.addData({ type: 'FeatureCollection', features: lineFeatures });
      }

      if (pointFeatures.length > 0) {
        let addedCount = 0;
        pointFeatures.forEach(f => {
          const coords = f.geometry.coordinates || [];
          const lon = coords[0];
          const lat = coords[1];
          if (typeof lat !== 'number' || typeof lon !== 'number' || isNaN(lat) || isNaN(lon)) return;

          const p = f.properties || {};
          const name = p.name || p.title || p.station || 'Railway Station';

          const exists = allStationRecords.some(s =>
            (s.name && s.name.toLowerCase() === name.toLowerCase()) ||
            (Math.abs(s.lat - lat) < 0.008 && Math.abs(s.lon - lon) < 0.008)
          );
          if (exists) return;

          const subType = normalizeStationSubType(p.sub || p.subType || p.category || p.type || '');
          const hub = p.hub || p.desc || p.description || p.notes || 'Main Trunk & Regional Station';
          const rawYear = p.opened || p.year || p.date || '';
          const parsedYear = parseYearNum(rawYear);
          const hasYear = !isNaN(parsedYear) && parsedYear > 0;
          const id = 'stn_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + lat.toFixed(3) + '_' + lon.toFixed(3);

          const record = {
            id: id,
            name: name,
            lat: lat,
            lon: lon,
            subType: subType,
            hub: hub,
            year: hasYear ? parsedYear : null,
            statusText: rawYear ? `Opened ${rawYear}` : (p.status || p.statusText || (hasYear ? `Opened ${parsedYear}` : ''))
          };
          record.marker = createStationMarker(record);
          allStationRecords.push(record);
          addedCount++;
        });

        if (addedCount > 0) {
          refreshStationsOnMap();
          updateLegendActiveStates();
        }
      }
    }

      const typeClass = `stn-${subType}`;
      const iconEmoji = subType === 'regional' ? '🏛️' : (subType === 'active' ? '🟢' : '📜');

        iconSize: [22, 22],
        iconAnchor: [11, 11],

    function initStationRecords() {
      allStationRecords = GUARANTEED_STATIONS.map(stn => {
        const id = 'stn_' + stn.name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + stn.lat.toFixed(3) + '_' + stn.lon.toFixed(3);
        const parsedYear = parseYearNum(stn.opened || stn.year || stn.date);
        const hasYear = !isNaN(parsedYear) && parsedYear > 0;
        const record = {
          id: id,
          name: stn.name,
          lat: stn.lat,
          lon: stn.lon,
          subType: stn.sub,
          hub: stn.hub,
          year: hasYear ? parsedYear : null,
          statusText: stn.opened ? `Opened ${stn.opened}` : (stn.statusText || (hasYear ? `Opened ${parsedYear}` : ''))
        };
        record.marker = createStationMarker(record);
        return record;
      });

      refreshStationsOnMap();
      updateLegendActiveStates();

      // Load additional Main Trunk lines & stations from cache/CDN
      loadMainTrunkAndStations();
    }

    function refreshStationsOnMap() {
      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();
      const savedSet = savedStore.get();
      const minVal = parseInt(document.getElementById('minYearSlider')?.value || globalMinYear, 10);
      const maxVal = parseInt(document.getElementById('maxYearSlider')?.value || globalMaxYear, 10);

      Object.values(stnLayers).forEach(lg => lg.clearLayers());

      allStationRecords.forEach(rec => {
        if (isSavedFilterActive && !savedSet.has(rec.id)) return;
        if (search) {
          const hay = `${rec.name} ${rec.hub} ${rec.subType} ${rec.statusText}`.toLowerCase();
          if (!hay.includes(search)) return;
        }
        const hasDate = rec.year !== null && !isNaN(rec.year);
        if (isTimelinePlaying) {
          if (!hasDate || rec.year < minVal || rec.year > maxVal) return;
        } else {
          if (hasDate && (rec.year < minVal || rec.year > maxVal)) return;
        }
        stnLayers[rec.subType].addLayer(rec.marker);
      });

      Object.keys(stnLayers).forEach(sub => {
        if (!map) return;
        if (stnVisibility[sub]) {
          if (!map.hasLayer(stnLayers[sub])) stnLayers[sub].addTo(map);
        } else {
          if (map.hasLayer(stnLayers[sub])) map.removeLayer(stnLayers[sub]);
        }
      });

      const regEl = document.getElementById('badgeStnRegional');
      const actEl = document.getElementById('badgeStnActive');
      const herEl = document.getElementById('badgeStnHeritage');
      if (regEl) regEl.textContent = stnLayers.regional.getLayers().length;
      if (actEl) actEl.textContent = stnLayers.active.getLayers().length;
      if (herEl) herEl.textContent = stnLayers.heritage.getLayers().length;
    }

      const btn = document.getElementById(btnId);
      if (stnVisibility[subType]) {
        btn?.classList.add('active');

        btn?.classList.remove('active');

      refreshStationsOnMap();

    let allEvents = [];

    const GENERIC_CORRIDOR_NAMES = new Set(['rail corridor', 'disused corridor', 'abandoned corridor']);
    const GENERIC_INFRA_NAMES = new Set(['nz rail tunnel']);

    const HISTORIC_CATEGORY_LABELS = {
      yard: 'Rail Yard',

      rail: 'In service',

      razed: 'Demolished',
      miniature: 'Miniature railway',
      funicular: 'Funicular',
      tram: 'Tramway',

    const ELECTRIFIED_LABELS = {
      no: 'Not electrified',

      rail: 'Electrified (third rail)',
      construction: 'Electrification under construction'
    };

    const INFRA_TYPE_STYLES = {
      Tunnel:  { emoji: '🚇', border: '#6366f1', bg: 'rgba(238, 242, 255, 0.95)', text: '#4338ca' },
      Viaduct: { emoji: '🌉', border: '#0284c7', bg: 'rgba(240, 249, 255, 0.95)', text: '#0369a1' },
      Bridge:  { emoji: '🛤️', border: '#0d9488', bg: 'rgba(240, 253, 250, 0.95)', text: '#0f766e' }
    };

    function cleanRailText(str) {
      return String(str || '').replace(/\s*\uFFFD\s*/g, ' – ').trim();
    }

    function toTitleCase(str) {
      return String(str || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function labelHistoricCategory(cat) {
      return HISTORIC_CATEGORY_LABELS[cat] || toTitleCase(cat || 'Historic Line');
    }

    function labelRailStatus(status) {
      return RAIL_STATUS_LABELS[status] || toTitleCase(status);
    }

    function baseLineName(name) {
      return cleanRailText(name)
        .split(/\s+–\s+|\//)[0]
        .replace(/\s+(Up|Down|West|East|Centre|Middle|Third)\s+Main$/i, '')
        .trim();
    }

    function formatLengthMetres(lengthM, fallback) {
      const m = parseFloat(lengthM);
      if (isNaN(m)) return fallback || 'Unknown';
      return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m)} m`;
    }

    function mmToImperial(mm) {
      const quarters = Math.round((mm / 25.4) * 4);
      const ft = Math.floor(quarters / 48);
      const inchQuarters = quarters - ft * 48;
      const wholeIn = Math.floor(inchQuarters / 4);
      const frac = ['', '¼', '½', '¾'][inchQuarters % 4];
      const inPart = (wholeIn || frac) ? `${wholeIn || ''}${frac} in` : '';
      return [ft ? `${ft} ft` : '', inPart].filter(Boolean).join(' ');
    }

    function formatGauge(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      const parts = s.split(/[;,]/).map(x => x.trim()).filter(Boolean);
      if (!parts.every(x => /^\d+(\.\d+)?$/.test(x))) return s;
      const mms = parts.map(Number);
      return `${mms.join(' / ')} mm (${mms.map(mmToImperial).join(' / ')})`;
    }

    function formatOsmDate(raw) {
      const s = String(raw || '').trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return s;
      const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }

    function popupRow(label, value) {
      return value ? `<p style="margin:2px 0;"><strong>${label}:</strong> ${escapeHTML(value)}</p>` : '';
    }

    function popupBadge(text, bg, color) {
      return `<span class="historic-rail-badge" style="background:${bg}; color:${color};">${text}</span>`;
    }

    function papersPastLink(query) {
      if (!query) return '';
      return `<a href="https://paperspast.natlib.govt.nz/newspapers?query=${encodeURIComponent(query)}" target="_blank" rel="noopener noreferrer" class="btn-source-archive" style="margin-top:8px;"><span>🗞️</span> Search Papers Past ↗</a>`;
    }

    // Same-name line sections are joined at runtime so popups can report a combined length.
    const lineGroupCache = new Map();
    let activeLineGroup = null;

    function lineGroupKind(p) {
      if (p.layer_type === 'track') return 'main';
      if (p.subtype) return 'bush';
      return 'historic';
    }

    function lineGroupKey(p) {
      const name = cleanRailText(p.name).toLowerCase();
      if (!name || GENERIC_CORRIDOR_NAMES.has(name) || name === 'historic bush tramway') return null;
      return `${lineGroupKind(p)}|${name}`;
    }

    function featureLengthM(layer) {
      const p = layer.feature.properties;
      if (p._lenM !== undefined) return p._lenM;
      const given = parseFloat(p.length_m);
      if (!isNaN(given)) return (p._lenM = given);
      const lls = layer.getLatLngs();
      const parts = L.LineUtil.isFlat(lls) ? [lls] : lls;
      let total = 0;
      parts.forEach(part => {
        for (let i = 1; i < part.length; i++) total += part[i - 1].distanceTo(part[i]);
      });
      return (p._lenM = total);
    }

    function getLineGroup(geoLayer, layer) {
      const key = lineGroupKey(layer.feature.properties || {});
      if (!key) return null;
      if (lineGroupCache.has(key)) return lineGroupCache.get(key);
      const members = [];
      let totalM = 0;
      geoLayer.eachLayer(l => {
        if (lineGroupKey(l.feature.properties || {}) === key) {
          members.push(l);
          totalM += featureLengthM(l);
        }
      });
      const group = { key, geoLayer, members, totalM };
      lineGroupCache.set(key, group);
      return group;
    }

    function highlightLineGroup(group, layer, style) {
      (group ? group.members : [layer]).forEach(l => l.setStyle(style));
    }

    function resetLineGroup(group, layer, geoLayer) {
      (group ? group.members : [layer]).forEach(l => geoLayer.resetStyle(l));
    }

    function bindLineGroupInteractions(geoLayer, layer, getHoverStyle) {
      layer.on('mouseover', () => {
        highlightLineGroup(getLineGroup(geoLayer, layer), layer, getHoverStyle());
      });
      layer.on('mouseout', () => {
        const group = getLineGroup(geoLayer, layer);
        if (group && group === activeLineGroup) return;
        resetLineGroup(group, layer, geoLayer);
      });
      layer.on('popupopen', () => {
        const group = getLineGroup(geoLayer, layer);
        if (activeLineGroup && activeLineGroup !== group) {
          resetLineGroup(activeLineGroup, null, activeLineGroup.geoLayer);
        }
        activeLineGroup = group;
        highlightLineGroup(group, layer, getHoverStyle());
      });
      layer.on('popupclose', () => {
        const group = getLineGroup(geoLayer, layer);
        if (activeLineGroup === group) activeLineGroup = null;
        resetLineGroup(group, layer, geoLayer);
      });
    }

    function lineLengthRows(geoLayer, layer, sectionLabel) {
      const group = getLineGroup(geoLayer, layer);
      const sectionM = featureLengthM(layer);
      if (!group || group.members.length < 2) {
        return popupRow(sectionLabel, formatLengthMetres(sectionM));
      }
      return popupRow('Total Mapped Track', `${formatLengthMetres(group.totalM)} (${group.members.length} sections)`) +
             popupRow('This Section', formatLengthMetres(sectionM));
    }

    function findNearestNamedLine(latlng, maxMetres = 400) {
      if (!historicNetLayer || !latlng) return null;
      const pad = 0.01;
      const kx = Math.cos(latlng.lat * Math.PI / 180);
      const target = L.point(latlng.lng * kx, latlng.lat);
      let best = null;
      let bestDist = Infinity;
      historicNetLayer.eachLayer(layer => {
        const name = cleanRailText(layer.feature?.properties?.name);
        if (!name || GENERIC_CORRIDOR_NAMES.has(name.toLowerCase())) return;
        const b = layer.getBounds();
        if (latlng.lat < b.getSouth() - pad || latlng.lat > b.getNorth() + pad ||
            latlng.lng < b.getWest() - pad || latlng.lng > b.getEast() + pad) return;
        const pts = layer.getLatLngs().flat(Infinity);
        for (let i = 1; i < pts.length; i++) {
          const d = L.LineUtil.pointToSegmentDistance(
            target,
            L.point(pts[i - 1].lng * kx, pts[i - 1].lat),
            L.point(pts[i].lng * kx, pts[i].lat)
          );
          if (d < bestDist) { bestDist = d; best = name; }
        }
      });
      return bestDist * 111320 <= maxMetres ? baseLineName(best) : null;
    }

    function buildHistoricLinePopup(p, layer) {
      const rawName = cleanRailText(p.name);
      const catLabel = labelHistoricCategory(p.category);
      const isGeneric = !rawName || GENERIC_CORRIDOR_NAMES.has(rawName.toLowerCase());
      const title = isGeneric ? catLabel : rawName;
      const badge = isGeneric ? toTitleCase(rawName || 'Historic Corridor') : catLabel;
      const desc = cleanRailText(p.desc);
      const descIsOperator = desc && desc.length <= 40 && /^[A-Z]/.test(desc) && desc !== 'Loop';
      return `
        <div class="historic-rail-popup">
          <h4 style="color:#dc2626;">🔴 ${escapeHTML(title)}</h4>
          <span class="historic-rail-badge">📜 ${escapeHTML(badge)}</span>
          ${lineLengthRows(historicNetLayer, layer, 'Length')}
          ${descIsOperator ? popupRow('Operator / Owner', desc) : (desc ? `<p style="margin:4px 0 0 0;">${escapeHTML(desc)}</p>` : '')}
          ${isGeneric ? '' : papersPastLink(`"${baseLineName(rawName)}"`)}
        </div>
      `;
    }

    function buildMainTrunkPopup(p, layer) {
      const name = cleanRailText(p.name) || 'Main Trunk Line';
      const electrified = ELECTRIFIED_LABELS[p.electrified] || (p.electrified ? toTitleCase(p.electrified) : '');
      return `
        <div class="historic-rail-popup">
          <h4 style="color:#1d4ed8;">🚆 ${escapeHTML(name)}</h4>
          ${popupBadge('🛤️ Main Trunk Line', '#dbeafe', '#1e40af')}
          ${lineLengthRows(historicNetLayer, layer, 'Length')}
          ${popupRow('Track', cleanRailText(p.ref))}
          ${popupRow('Electrification', electrified)}
          ${popupRow('Gauge', formatGauge(p.gauge))}
          ${papersPastLink(`"${baseLineName(name)}"`)}
        </div>
      `;
    }

    function buildBushTramPopup(p, layer) {
      const name = cleanRailText(p.name) || 'Historic Bush Tramway';
      const isGeneric = name === 'Historic Bush Tramway';
      return `
        <div class="historic-rail-popup">
          <h4 style="color:#d97706;">🌲 ${escapeHTML(name)}</h4>
          ${popupBadge(`🏷️ ${escapeHTML(p.subtype || 'Bush Tramway')}`, '#fef3c7', '#92400e')}
          ${popupRow('Status', p.railway ? labelRailStatus(p.railway) : '')}
          ${lineLengthRows(bushTramLayer, layer, 'Track Length')}
          ${popupRow('Gauge', formatGauge(p.gauge))}
          ${popupRow('Operator', cleanRailText(p.operator))}
          ${popupRow('Opened', formatOsmDate(p.start_date))}
          ${p.description ? `<p style="margin:4px 0 0 0; font-size:11px; color:#475569;">${escapeHTML(p.description)}</p>` : ''}
          ${isGeneric ? '' : papersPastLink(`"${name}"`)}
        </div>
      `;
    }

    function resolveInfraTitle(p, latlng) {
      const type = p.type || 'Structure';
      const name = cleanRailText(p.name);
      const isGenericName = !name || GENERIC_INFRA_NAMES.has(name.toLowerCase());
      if (!isGenericName && /tunnel|bridge|viaduct/i.test(name)) {
        return { title: name, query: `"${name}"` };
      }
      if (p._nearestLine === undefined) {
        p._nearestLine = isGenericName ? findNearestNamedLine(latlng) : baseLineName(name);
      }
      if (p._nearestLine) {
        return { title: `${type} on ${p._nearestLine}`, query: `"${p._nearestLine}" ${type.toLowerCase()}` };
      }
      return { title: `Unnamed Rail ${type}`, query: null };
    }

    function buildInfraPopup(p, latlng) {
      const style = INFRA_TYPE_STYLES[p.type] || INFRA_TYPE_STYLES.Viaduct;
      const { title, query } = resolveInfraTitle(p, latlng);
      const isHeritage = p.historic === true || String(p.historic).toLowerCase() === 'true' || p.heritage === 'yes';
      const wikiTitle = p.wikipedia ? String(p.wikipedia).replace(/^en:/, '') : '';
      const wikiLink = wikiTitle
        ? `<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(wikiTitle.replace(/ /g, '_'))}" target="_blank" rel="noopener noreferrer" class="btn-source-archive"><span>📖</span> Wikipedia: ${escapeHTML(wikiTitle)} ↗</a>`
        : '';
      const wikidataLink = p.wikidata
        ? `<a href="https://www.wikidata.org/wiki/${encodeURIComponent(p.wikidata)}" target="_blank" rel="noopener noreferrer" class="btn-source-archive"><span>🗃️</span> Wikidata ${escapeHTML(p.wikidata)} ↗</a>`
        : '';
      return `
        <div class="history-card" style="width:260px; padding:12px;">
          <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px;">
            ${popupBadge(`${style.emoji} ${escapeHTML(p.type || 'Structure')}`, style.bg, style.text)}
            ${isHeritage ? popupBadge('🏛️ Historic Structure', '#fef3c7', '#92400e') : ''}
          </div>
          <h3 style="margin:0 0 6px 0; font-size:13px; font-weight:900; color:#0f172a;">${style.emoji} ${escapeHTML(title)}</h3>
          <div style="font-size:11px; line-height:1.45; color:#334155;">
            ${popupRow('Length', formatLengthMetres(p.length_m, p.length))}
            ${popupRow('Opened / Built', formatOsmDate(p.start_date))}
            ${popupRow('Status', p.railway_status ? labelRailStatus(p.railway_status) : '')}
          </div>
          <div style="display:flex; flex-direction:column; gap:5px; margin-top:6px;">
            ${wikiLink}
            ${wikidataLink}
            ${papersPastLink(query)}
          </div>
        </div>
      `;
    }

    function filterEvents() {
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      const fill = document.getElementById('sliderTrackFill');
      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();

      let minVal = parseInt(minSlider.value, 10);
      let maxVal = parseInt(maxSlider.value, 10);
      if (minVal > maxVal) { const tmp = minVal; minVal = maxVal; maxVal = tmp; minSlider.value = minVal; maxSlider.value = maxVal; }

      const span = (globalMaxYear - globalMinYear) || 1;
      const left = ((minVal - globalMinYear) / span) * 100;
      const right = ((maxVal - globalMinYear) / span) * 100;

      if (fill) { fill.style.left = left + '%'; fill.style.width = (right - left) + '%'; }
      document.getElementById('yearRangeText').textContent = `${minVal} – ${maxVal}`;

      const savedSet = savedStore.get();
      const filtered = allEvents.filter(ev => {
        if (isSavedFilterActive && !savedSet.has(ev._uid)) return false;
        if (ev.year < minVal || ev.year > maxVal) return false;
        if (search) {
          return `${ev.headline} ${ev.location} ${ev.details} ${ev.category} ${ev.date}`.toLowerCase().includes(search);
        }
        return true;
      });

      renderDataset(filtered);
      refreshStationsOnMap();
    }

    function renderDataset(items) {
      if (!markers) return;
      markers.clearLayers();
      const sorted = [...items].sort((a, b) => (a.year || 0) - (b.year || 0));
      currentActiveEvents = sorted;

      const markerList = sorted.map((ev, i) => {
        ev._chronoIndex = i;
        const icon = L.divIcon({
          className: 'history-div-icon',
          html: `
            <div class="nz-train-marker cat-feats">
              <div class="marker-pill">
                <div class="marker-text-block">
                  <div class="marker-header-row"><span class="marker-date-tag">📍 ${ev.year}</span></div>
                  <div class="marker-headline-text">${escapeHTML(ev.headline)}</div>
                </div>
              </div>
              <div class="marker-pin-tail"></div>
              <div class="marker-stem" style="height:22px;"></div>
              <div class="marker-point-dot"></div>
            </div>
          `,
          iconSize: [260, 65],
          iconAnchor: [130, 61],
          popupAnchor: [0, -55]
        });

        const m = L.marker([ev.latitude, ev.longitude], { icon: icon });
        ev._marker = m;
        m.bindPopup(`
          <div class="history-card" style="padding:12px;">
            <h3 style="margin:0 0 4px 0;">${escapeHTML(ev.headline)}</h3>
            <div class="history-card-meta"><span>📍 ${escapeHTML(ev.location)}</span></div>
            <p class="history-card-desc">${escapeHTML(ev.details)}</p>
          </div>
        `, { maxWidth: 320 });
        if (window.BMMCMap && BMMCMap.mountRelatedOnPopup) {
          BMMCMap.mountRelatedOnPopup(m, {
            lat: ev.latitude, lng: ev.longitude, year: ev.year, id: ev.id || ev._uid
          });
        }
        return m;
      });

      markers.addLayers(markerList);
      document.getElementById('itemCountBadge').textContent = `${sorted.length} milestones`;
    }

    function focusFromUrl() {
      const focusId = new URLSearchParams(window.location.search).get('focus');
      if (!focusId || !allEvents.length) return;
      const ev = allEvents.find(e => String(e.id) === focusId || String(e._uid) === focusId);
      if (!ev) return;

      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      if (minSlider && maxSlider && ev.year) {
        minSlider.value = Math.min(parseInt(minSlider.value, 10) || ev.year, ev.year);
        maxSlider.value = Math.max(parseInt(maxSlider.value, 10) || ev.year, ev.year);
        filterEvents();
      }

      const openFocused = () => {
        if (!ev._marker) return false;
        if (window.BMMCMap && BMMCMap.focusMarkerInCluster) {
          BMMCMap.focusMarkerInCluster(map, markers, ev._marker, 12);
        } else if (markers && markers.zoomToShowLayer) {
          markers.zoomToShowLayer(ev._marker, () => {
            map.setView([ev.latitude, ev.longitude], 12, { animate: true });
            ev._marker.openPopup();
          });
        } else {
          map.setView([ev.latitude, ev.longitude], 12, { animate: true });
          ev._marker.openPopup();
        }
        return true;
      };
      setTimeout(() => { if (!openFocused()) setTimeout(openFocused, 400); }, 250);
    }

    function toggleTimelinePlayback() {
      const btn = document.getElementById('btnPlayTimeline');
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      if (timelineTimer) {
        clearInterval(timelineTimer);
        timelineTimer = null;
        isTimelinePlaying = false;
        btn.textContent = '▶';
        btn.classList.remove('playing');
        filterEvents();
      } else {
        isTimelinePlaying = true;
        btn.textContent = '⏸';
        btn.classList.add('playing');
        minSlider.value = globalMinYear;
        if (parseInt(maxSlider.value, 10) >= globalMaxYear) maxSlider.value = 1880;

        timelineTimer = setInterval(() => {
          let curr = parseInt(maxSlider.value, 10);
          if (curr >= globalMaxYear) {
            toggleTimelinePlayback();
          } else {
            maxSlider.value = Math.min(globalMaxYear, curr + 3);
            filterEvents();
          }
        }, 250);
        filterEvents();
      }
    }

    function parseCSVData(csvString) {
      if (!csvString || csvString.trim().length === 0) return false;
      const parsed = Papa.parse(csvString, { header: true, skipEmptyLines: true });
      allEvents = (parsed.data || []).map(row => {
        const lat = parseCoord(getCol(row, ['latitude', 'lat']));
        const lng = parseCoord(getCol(row, ['longitude', 'lng', 'lon']));
        const yr = parseYearNum(getCol(row, ['year', 'yr', 'date']));
        const hl = getCol(row, ['headline', 'title', 'event', 'name']);
        const uid = getCol(row, ['id']) || `${yr}_${lat}_${lng}`;

        return {
          id: uid,
          _uid: uid,
          year: isNaN(yr) ? 0 : yr,
          date: getCol(row, ['date']) || String(yr || ''),
          headline: hl || 'Rail Milestone',
          category: getCol(row, ['category', 'type']) || 'Railways',
          location: getCol(row, ['location', 'place']),
          latitude: lat,
          longitude: lng,
          details: getCol(row, ['details', 'description', 'notes'])
        };
      }).filter(e => !isNaN(e.latitude) && !isNaN(e.longitude) && e.latitude !== 0 && e.longitude !== 0);

      if (allEvents.length > 0) {
        globalMinYear = Math.min(...allEvents.map(e => e.year).filter(y => y > 0));
        globalMaxYear = Math.max(...allEvents.map(e => e.year).filter(y => y > 0));
        const minS = document.getElementById('minYearSlider');
        const maxS = document.getElementById('maxYearSlider');
        minS.min = globalMinYear; minS.max = globalMaxYear; minS.value = globalMinYear;
        maxS.min = globalMinYear; maxS.max = globalMaxYear; maxS.value = globalMaxYear;
        filterEvents();
        return true;
      }
      return false;
    }

    async function loadDataset() {
      const cached = await DataCache.get('trains_milestones_csv');
      if (cached && parseCSVData(cached)) {
        focusFromUrl();
        return;
      }

      const candidates = [
        '../data/trains.csv',
        './data/trains.csv',
        'data/trains.csv',
        LIVE_CSV_URL,
        `https://corsproxy.io/?url=${encodeURIComponent(LIVE_CSV_URL)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(LIVE_CSV_URL)}`
      ];

      const text = await BMMCMap.fetchFirstText(candidates, { accept: parseCSVData });
      if (text) DataCache.set('trains_milestones_csv', text);
      focusFromUrl();
    }

    function toggleRailLayerByKey(key) {
      if (key === 'historic_net') toggleHistoricNetOverlay();
      else if (key === 'bush_trams') toggleBushTramsOverlay();
      else if (key === 'rail_infra') toggleRailInfraOverlay();
      else if (key === 'active_rails') toggleRailwayOverlay();
      else if (key === 'stn_regional') toggleStationSubGroup('regional');
      else if (key === 'stn_active') toggleStationSubGroup('active');
      else if (key === 'stn_heritage') toggleStationSubGroup('heritage');
      else if (key === 'milestones') {
        isMilestonesVisible = !isMilestonesVisible;
        if (isMilestonesVisible) map.addLayer(markers); else map.removeLayer(markers);
        updateLegendActiveStates();
      }
    }

    function updateLegendActiveStates() {
      document.querySelectorAll('#railLegendCard .legend-item[data-layer-key]').forEach(item => {
        const key = item.getAttribute('data-layer-key');
        let active = true;
        if (key === 'historic_net') active = isHistoricNetVisible;
        else if (key === 'bush_trams') active = isBushTramsVisible;
        else if (key === 'rail_infra') active = isRailInfraVisible;
        else if (key === 'active_rails') active = isRailwaysVisible;
        else if (key === 'stn_regional') active = stnVisibility.regional;
        else if (key === 'stn_active') active = stnVisibility.active;
        else if (key === 'stn_heritage') active = stnVisibility.heritage;
        else if (key === 'milestones') active = isMilestonesVisible;
        item.classList.toggle('layer-muted', !active);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMap();

      document.getElementById('minYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('maxYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('btnPlayTimeline')?.addEventListener('click', toggleTimelinePlayback);

      document.getElementById('btnToggleHistoricNet')?.addEventListener('click', toggleHistoricNetOverlay);
      document.getElementById('btnToggleBushTrams')?.addEventListener('click', toggleBushTramsOverlay);
      document.getElementById('btnToggleRailInfra')?.addEventListener('click', toggleRailInfraOverlay);
      document.getElementById('btnToggleRailways')?.addEventListener('click', toggleRailwayOverlay);

      document.getElementById('btnToggleStnRegional')?.addEventListener('click', () => toggleStationSubGroup('regional'));
      document.getElementById('btnToggleStnActive')?.addEventListener('click', () => toggleStationSubGroup('active'));
      document.getElementById('btnToggleStnHeritage')?.addEventListener('click', () => toggleStationSubGroup('heritage'));

      document.getElementById('btnToggleSaved')?.addEventListener('click', toggleSavedFilter);
      updateSavedCountHeader();

      const btnLayersToggle = document.getElementById('btnLayersToggle');
      const layerDropdownCard = document.getElementById('layerDropdownCard');
      btnLayersToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerDropdownCard?.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) {
          layerDropdownCard?.classList.remove('show');
        }
      });

      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerSat')?.addEventListener('click', () => setBasemap('sat'));
      document.getElementById('btnLayerStreet')?.addEventListener('click', () => setBasemap('street'));
      document.getElementById('btnLayerOffline')?.addEventListener('click', () => setBasemap('offline'));

      const searchInput = document.getElementById('mapSearchInput');
      const clearSearchBtn = document.getElementById('clearMapSearch');
      searchInput?.addEventListener('input', (e) => {
        clearSearchBtn.style.display = e.target.value ? 'block' : 'none';
        filterEvents();
      });
      clearSearchBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        filterEvents();
      });

      document.querySelectorAll('.era-chip').forEach(chip => {
        chip.addEventListener('click', function () {
          if (timelineTimer) toggleTimelinePlayback();
          document.querySelectorAll('.era-chip').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('minYearSlider').value = this.dataset.min;
          document.getElementById('maxYearSlider').value = this.dataset.max;
          filterEvents();
        });
      });

      // Interactive Legend Events
      const railLegendCard = document.getElementById('railLegendCard');
      const btnCloseLegend = document.getElementById('btnCloseLegend');
      const btnOpenLegend = document.getElementById('btnOpenLegend');

      btnCloseLegend?.addEventListener('click', () => {
        railLegendCard.style.display = 'none';
        btnOpenLegend.style.display = 'inline-flex';
      });
      btnOpenLegend?.addEventListener('click', () => {
        btnOpenLegend.style.display = 'none';
        railLegendCard.style.display = 'flex';
      });

      document.querySelectorAll('#railLegendCard .legend-item[data-layer-key]').forEach(item => {
        item.addEventListener('click', () => {
          const key = item.getAttribute('data-layer-key');
          if (key) toggleRailLayerByKey(key);
        });
      });

      updateLegendActiveStates();
      loadDataset();
    });
  </script>
</body>
</html>
