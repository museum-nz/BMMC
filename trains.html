<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa NZ Railway History &amp; Heritage Map — BMMC</title>

  <!-- Instant Theme Sync -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('bMMC_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect for Tile & CDN Performance -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://tiles.openrailwaymap.org" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Inline Train Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚂</text></svg>">

  <!-- Leaflet & Plugins CSS with CDN Fallbacks -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css';" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.Default.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css';" />

  <!-- Master Stylesheet & Offline Adapter -->
  <link rel="stylesheet" href="styles.css" onerror="this.onerror=null;">
  <script src="offline-adapter.js" onerror="this.onerror=null;"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --pill-zoom-factor: 1;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1329;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #aad3df;
      z-index: 1;
    }

    /* Top-Right Zoom Controls */
    .leaflet-top.leaflet-right .leaflet-control-zoom {
      margin-top: 62px;
      margin-right: 16px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .leaflet-control-zoom a {
      background-color: rgba(255, 255, 255, 0.94) !important;
      color: #0f172a !important;
      border-color: rgba(203, 213, 225, 0.8) !important;
      transition: all 0.15s ease !important;
    }
    .leaflet-control-zoom a:hover {
      background-color: #ffffff !important;
      color: #0284c7 !important;
    }
    .dark .leaflet-top.leaflet-right .leaflet-control-zoom {
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .dark .leaflet-control-zoom a {
      background-color: rgba(15, 23, 42, 0.94) !important;
      color: #f8fafc !important;
      border-color: rgba(51, 65, 85, 0.8) !important;
    }
    .dark .leaflet-control-zoom a:hover {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
    }

    /* Top Floating Controls Bar */
    .top-controls-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .top-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .top-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .top-action-btn:hover {
      background: #ffffff;
      border-color: #0284c7;
      color: #0284c7;
      transform: translateY(-1px);
    }
    .top-action-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .dark .top-action-btn {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .dark .top-action-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .dark .top-action-btn.active {
      background: #082f49;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Historic Railway Button Custom Active Colors */
    .btn-historic-rail.active {
      background: #ffe4e6 !important;
      border-color: #e11d48 !important;
      color: #be123c !important;
    }
    .dark .btn-historic-rail.active {
      background: #4c0519 !important;
      border-color: #fb7185 !important;
      color: #fda4af !important;
    }

    /* Search Box */
    .map-search-box {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      min-width: 170px;
      max-width: 260px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      padding: 0 10px;
    }
    .dark .map-search-box {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .map-search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      padding-left: 6px;
    }
    .dark .map-search-box input { color: #f8fafc; }
    .search-icon { font-size: 13px; color: #64748b; flex-shrink: 0; }
    .clear-search-btn {
      display: none;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dark .clear-search-btn { background: #334155; color: #cbd5e1; }

    /* Basemap Switcher */
    .layer-switcher-container { position: relative; display: inline-block; }
    .layer-dropdown-card {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 8px;
      z-index: 2000;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .layer-dropdown-card.show { display: grid; }
    .dark .layer-dropdown-card {
      background: rgba(15, 23, 42, 0.96);
      border-color: #334155;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .layer-option-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: #f8fafc;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dark .layer-option-btn { background: #1e293b; color: #cbd5e1; }
    .layer-option-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .dark .layer-option-btn.active {
      background: #082f49;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Era Bar */
    .era-bar {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 0;
      max-width: max-content;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .era-bar::-webkit-scrollbar { display: none; }
    .era-chip {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .era-chip:hover, .era-chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* Floating Timeline Slider at Bottom Left */
    .year-slider-container {
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: calc(100% - 40px);
      max-width: 460px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      z-index: 1000;
      pointer-events: auto;
    }
    .dark .year-slider-container {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(51, 65, 85, 0.9);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .year-slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .timeline-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
    }
    .dark .timeline-title-group { color: #f8fafc; }
    .btn-timeline-play {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(2,132,199,0.4);
    }
    .btn-timeline-play.playing { background: #ef4444; }
    .item-counter-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(2,132,199,0.12);
      color: #0284c7;
      border: 1px solid rgba(2,132,199,0.25);
    }
    .dark .item-counter-badge {
      background: rgba(56,189,248,0.15);
      color: #38bdf8;
      border-color: rgba(56,189,248,0.3);
    }
    .range-text {
      font-size: 12px;
      font-weight: 900;
      color: #0284c7;
      font-family: monospace;
    }
    .dark .range-text { color: #38bdf8; }

    .dual-slider-track-wrapper {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
    }
    .slider-track-bg {
      position: absolute;
      width: 100%;
      height: 6px;
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark .slider-track-bg { background: #334155; }
    .slider-track-fill {
      position: absolute;
      height: 6px;
      background: #0284c7;
      border-radius: 3px;
      pointer-events: none;
    }
    .dark .slider-track-fill { background: #38bdf8; }
    .dual-slider-track-wrapper input[type="range"] {
      position: absolute;
      width: 100%;
      height: 6px;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      z-index: 10;
    }
    .dual-slider-track-wrapper input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* 50% Translucent Frosted Glass Marker Pills & 5% Dynamic Zoom Scaling */
    .history-div-icon { background: none !important; border: none !important; }
    .nz-train-marker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      transition: transform 0.15s ease;
    }
    .nz-train-marker:hover {
      transform: scale(1.06);
      z-index: 100000 !important;
    }

    .marker-pill {
      display: inline-flex !important;
      align-items: center !important;
      gap: calc(7px * var(--pill-zoom-factor, 1)) !important;
      background: rgba(255, 255, 255, 0.50) !important;       /* Exactly 50% transparent */
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      color: #0f172a !important;
      padding: calc(4px * var(--pill-zoom-factor, 1)) calc(8px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(12px * var(--pill-zoom-factor, 1)) !important;
      width: auto !important;
      max-width: calc(260px * var(--pill-zoom-factor, 1)) !important;
      min-height: calc(38px * var(--pill-zoom-factor, 1)) !important;
      border: 1.5px solid rgba(2, 132, 199, 0.75) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15) !important;
      overflow: hidden !important;
      user-select: none !important;
      transition: max-width 0.12s ease-out, min-height 0.12s ease-out, gap 0.12s ease-out !important;
    }
    .dark .marker-pill {
      background: rgba(15, 23, 42, 0.50) !important;         /* 50% transparent dark */
      border-color: rgba(56, 189, 248, 0.75) !important;
    }

    .marker-thumb-box {
      width: calc(34px * var(--pill-zoom-factor, 1)) !important;
      height: calc(32px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(6px * var(--pill-zoom-factor, 1)) !important;
      overflow: hidden !important;
      flex-shrink: 0 !important;
      background: rgba(226, 232, 240, 0.50) !important;
      border: 1px solid rgba(15, 23, 42, 0.15) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: width 0.12s ease-out, height 0.12s ease-out !important;
    }
    .dark .marker-thumb-box {
      background: rgba(30, 41, 59, 0.50) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
    }
    .marker-thumb-img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .marker-text-block {
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      min-width: 0 !important;
      flex: 1 !important;
      text-align: left !important;
      line-height: 1.25 !important;
    }
    .marker-header-row {
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
      margin-bottom: 2px !important;
    }

    .marker-date-tag {
      background: rgba(224, 242, 254, 0.85) !important;
      color: #0369a1 !important;
      border: 1px solid rgba(186, 230, 253, 0.8) !important;
      padding: calc(1px * var(--pill-zoom-factor, 1)) calc(5px * var(--pill-zoom-factor, 1)) !important;
      border-radius: calc(5px * var(--pill-zoom-factor, 1)) !important;
      font-size: calc(9.5px * var(--pill-zoom-factor, 1)) !important;
      font-weight: 900 !important;
      line-height: 1.2 !important;
      white-space: nowrap !important;
      transition: font-size 0.12s ease-out, padding 0.12s ease-out !important;
    }
    .dark .marker-date-tag {
      background: rgba(3, 105, 161, 0.85) !important;
      color: #e0f2fe !important;
      border-color: rgba(56, 189, 248, 0.8) !important;
    }

    .marker-headline-text {
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      white-space: nowrap !important;
      font-size: calc(11px * var(--pill-zoom-factor, 1)) !important;
      font-weight: 850 !important;
      color: #0f172a !important;       /* High-contrast non-white dark text */
      letter-spacing: -0.1px !important;
      line-height: 1.25 !important;
      transition: font-size 0.12s ease-out !important;
    }
    .dark .marker-headline-text { color: #f1f5f9 !important; }

    .marker-pin-tail {
      width: 0 !important;
      height: 0 !important;
      border-left: 6px solid transparent !important;
      border-right: 6px solid transparent !important;
      border-top: 8px solid rgba(255, 255, 255, 0.50) !important; /* 50% transparent tail */
      margin-top: -1px !important;
    }
    .dark .marker-pin-tail { border-top-color: rgba(15, 23, 42, 0.50) !important; }
    .marker-stem { width: 2px; background: #0284c7; margin-top: -1px; }

    /* Category Distinct Border Colors */
    .cat-firsts .marker-pill { border-color: rgba(217, 119, 6, 0.85) !important; }
    .cat-feats .marker-pill { border-color: rgba(2, 132, 199, 0.85) !important; }
    .cat-loco .marker-pill { border-color: rgba(79, 70, 229, 0.85) !important; }
    .cat-towns .marker-pill { border-color: rgba(124, 58, 237, 0.85) !important; }
    .cat-disasters .marker-pill { border-color: rgba(234, 88, 12, 0.85) !important; }
    .cat-decline .marker-pill { border-color: rgba(234, 88, 12, 0.85) !important; }
    .cat-scenic .marker-pill { border-color: rgba(219, 39, 119, 0.85) !important; }
    .cat-commuter .marker-pill { border-color: rgba(8, 145, 178, 0.85) !important; }
    .cat-lines .marker-pill { border-color: rgba(5, 150, 105, 0.85) !important; }

    /* Standard Leaflet MarkerCluster Halo Icons (Green, Amber, Orange) */
    .marker-cluster-small { background-color: rgba(181, 226, 140, 0.6) !important; }
    .marker-cluster-small div { background-color: rgba(110, 204, 57, 0.9) !important; }
    .marker-cluster-medium { background-color: rgba(241, 211, 87, 0.6) !important; }
    .marker-cluster-medium div { background-color: rgba(240, 194, 12, 0.9) !important; }
    .marker-cluster-large { background-color: rgba(253, 156, 115, 0.6) !important; }
    .marker-cluster-large div { background-color: rgba(241, 128, 23, 0.9) !important; }
    .marker-cluster {
      background-clip: padding-box;
      border-radius: 50% !important;
      transition: transform 0.15s ease;
    }
    .marker-cluster:hover { transform: scale(1.1); }
    .marker-cluster div {
      width: 30px !important;
      height: 30px !important;
      margin-left: 5px !important;
      margin-top: 5px !important;
      text-align: center !important;
      border-radius: 50% !important;
      font: 12px/30px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      font-weight: 900 !important;
      color: #0f172a !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25) !important;
    }
    .dark .marker-cluster div { color: #ffffff !important; }
    .marker-cluster span { line-height: 30px !important; display: inline-block !important; }

    /* Historic Railway Polyline Popup */
    .historic-rail-popup {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      line-height: 1.4;
      color: #0f172a;
    }
    .historic-rail-popup h4 {
      margin: 0 0 2px 0;
      color: #be123c;
      font-size: 12px;
      font-weight: 900;
    }
    .historic-rail-badge {
      display: inline-block;
      background: #ffe4e6;
      color: #be123c;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    /* Pop-up Card Styling */
    .history-card { width: 290px; text-align: left; }
    .history-card-img-wrap {
      display: block;
      width: 100%;
      height: 155px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      border-radius: 10px 10px 0 0;
    }
    .history-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .history-card-badge-row {
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .category-pill {
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .date-pill {
      background: #0284c7;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .history-card-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 3px 6px;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
    }
    .dark .history-card-stepper { background: #0f172a; border-color: #334155; }
    .btn-step-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;

          "geometry": {
            "type": "LineString",
            "coordinates": [
              [175.6700, -37.3750], [175.7200, -37.4200], [175.7700, -37.4100],
              [175.8300, -37.3900]
            ]
          }
        },
        {
          "type": "Feature",
          "properties": {
            "name": "Catlins River Branch",
            "years": "1879–1971",
            "desc": "Southland pioneer timber and farming line running from Balclutha south to Owaka and Tahakopa through dense podocarp forest."
          },
          "geometry": {
            "type": "LineString",
            "coordinates": [
              [169.7400, -46.2400], [169.6600, -46.4500], [169.3400, -46.5100]
            ]
          }
        },
        {
          "type": "Feature",
          "properties": {
            "name": "Raetihi Branch",
            "years": "1917–1968",
            "desc": "Central North Island high-country branch connecting Ohakune depot with the timber mills and market gardens of Raetihi."
          },
          "geometry": {
            "type": "LineString",
            "coordinates": [
              [175.4000, -39.4167], [175.3400, -39.4200], [175.2830, -39.4280]
            ]
          }
        }
      ]
    };

    const NZ_CENTER = [-41.2865, 174.2];
    const NZ_ZOOM = window.innerWidth < 768 ? 5 : 6;
    const CONSISTENT_EVENT_ZOOM = 14;

    let map;
    let markers;
    let railwayOverlayLayer = null;
    let historicRailwaysLayer = null;
    let isRailwaysVisible = true;       // Active rails ON by default
    let isHistoricVisible = true;       // Historic rails ON by default

    const basemaps = {
      natgeo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; National Geographic Society',
        maxNativeZoom: 12,
        maxZoom: 19
      }),
      topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; Topographic Survey',
        maxNativeZoom: 18,
        maxZoom: 19
      }),
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &copy; Earthstar Geographics',
        maxNativeZoom: 18,
        maxZoom: 19
      }),
      street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxNativeZoom: 19,
        maxZoom: 19
      })
    };

    let userSelectedBasemap = 'natgeo';
    let isAutoSwitchedToTopo = false;
    const AUTO_SWITCH_ZOOM_THRESHOLD = 12;

    function applyLayer(type) {
      Object.values(basemaps).forEach(l => {
        if (map && map.hasLayer(l)) map.removeLayer(l);
      });
      if (map) basemaps[type].addTo(map);

      // Keep rail overlays on top
      if (railwayOverlayLayer && isRailwaysVisible && map && !map.hasLayer(railwayOverlayLayer)) {
        railwayOverlayLayer.addTo(map);
      }
      if (historicRailwaysLayer && isHistoricVisible && map && !map.hasLayer(historicRailwaysLayer)) {
        historicRailwaysLayer.addTo(map);
      }
    }

    function checkBasemapAutoSwitch() {
      if (!map || userSelectedBasemap !== 'natgeo') return;

      const currentZoom = map.getZoom();
      if (currentZoom > AUTO_SWITCH_ZOOM_THRESHOLD) {
        if (!isAutoSwitchedToTopo) {
          isAutoSwitchedToTopo = true;
          applyLayer('topo');
        }
      } else {
        if (isAutoSwitchedToTopo) {
          isAutoSwitchedToTopo = false;
          applyLayer('natgeo');
        }
      }
    }

    function setBasemap(type) {
      userSelectedBasemap = type;
      isAutoSwitchedToTopo = false;

      if (type === 'natgeo') {
        if (map && map.getZoom() > AUTO_SWITCH_ZOOM_THRESHOLD) {
          isAutoSwitchedToTopo = true;
          applyLayer('topo');
        } else {
          applyLayer('natgeo');
        }
      } else {
        applyLayer(type);
      }

      document.querySelectorAll('.layer-option-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btnLayer${type.charAt(0).toUpperCase() + type.slice(1)}`);
      if (activeBtn) activeBtn.classList.add('active');
      document.getElementById('layerDropdownCard')?.classList.remove('show');
    }

    // Toggle Active Railways Layer (OpenRailwayMap)
    function toggleRailwayOverlay() {
      if (!map) return;
      isRailwaysVisible = !isRailwaysVisible;
      const btn = document.getElementById('btnToggleRailways');
      if (isRailwaysVisible) {
        if (!map.hasLayer(railwayOverlayLayer)) railwayOverlayLayer.addTo(map);
        btn?.classList.add('active');
      } else {
        if (map.hasLayer(railwayOverlayLayer)) map.removeLayer(railwayOverlayLayer);
        btn?.classList.remove('active');
      }
    }

    // Toggle Historic Railways Layer (Heritage Crimson Polylines)
    function toggleHistoricOverlay() {
      if (!map) return;
      isHistoricVisible = !isHistoricVisible;
      const btn = document.getElementById('btnToggleHistoric');
      if (isHistoricVisible) {
        if (!map.hasLayer(historicRailwaysLayer)) historicRailwaysLayer.addTo(map);
        btn?.classList.add('active');
      } else {
        if (map.hasLayer(historicRailwaysLayer)) map.removeLayer(historicRailwaysLayer);
        btn?.classList.remove('active');
      }
    }

    // Dynamic 5% Text Scaling Per Zoom Step (1.05^delta)
    function updatePillZoomScale() {
      if (!map) return;
      const currentZoom = map.getZoom();
      const baseZoom = (typeof NZ_ZOOM !== 'undefined') ? NZ_ZOOM : 6;
      const delta = currentZoom - baseZoom;
      const factor = Math.pow(1.05, Math.max(-2, Math.min(10, delta)));
      document.documentElement.style.setProperty('--pill-zoom-factor', factor.toFixed(3));
    }

    function initMap() {
      map = L.map('map', {
        center: NZ_CENTER,
        zoom: NZ_ZOOM,
        minZoom: 4,
        maxZoom: 19,
        maxBounds: [[-50, 160], [-30, 185]],
        closePopupOnClick: true,    // Clicking outside closes open pop-up
        zoomControl: false
      });

      L.control.zoom({ position: 'topright' }).addTo(map);
      basemaps.natgeo.addTo(map);

      // 1. Active Tracks Overlay (OpenRailwayMap) — ON by default
      railwayOverlayLayer = L.tileLayer('https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
        attribution: 'Style: &copy; <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19,
        opacity: 0.85
      });
      railwayOverlayLayer.addTo(map);

      // 2. Historic & Abandoned Railway Layer (Heritage Crimson) — ON by default
      historicRailwaysLayer = L.geoJSON(HISTORIC_NZ_RAILWAYS, {
        style: {
          color: '#e11d48',          // Distinctive Heritage Crimson
          weight: 3.5,
          opacity: 0.9,
          dashArray: '6, 6',          // Classic historic dashed track pattern
          lineJoin: 'round'
        },
        onEachFeature: (feature, layer) => {
          const p = feature.properties || {};
          layer.bindPopup(`
            <div class="historic-rail-popup">
              <h4>${p.name || 'Historic Railway Line'}</h4>
              <span class="historic-rail-badge">📜 ${p.years || 'Historical Route'}</span>
              <p style="margin:4px 0 0 0;">${p.desc || ''}</p>
            </div>
          `, { maxWidth: 260 });
          layer.on('mouseover', function() { this.setStyle({ weight: 5, color: '#be123c', opacity: 1 }); });
          layer.on('mouseout', function() { historicRailwaysLayer.resetStyle(this); });
        }
      });
      historicRailwaysLayer.addTo(map);

      // Map event listeners
      map.on('click', () => { map.closePopup(); });
      map.on('zoom', updatePillZoomScale);
      map.on('zoomend', updatePillZoomScale);
      map.on('zoomend', checkBasemapAutoSwitch);
      updatePillZoomScale();

      // Standard Leaflet MarkerCluster Group (Clean halos, bold count numbers)
      markers = L.markerClusterGroup({
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: true,
        zoomToBoundsOnClick: true,
        maxClusterRadius: 35,
        disableClusteringAtZoom: CONSISTENT_EVENT_ZOOM
      });
      map.addLayer(markers);
    }

    let allEvents = [];
    let currentActiveEvents = [];
    let currentActiveIndex = 0;
    let globalMinYear = 1862;
    let globalMaxYear = 2026;
    let timelineTimer = null;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function parseYearNum(val) {
      if (!val) return NaN;
      const m = String(val).match(/-?\d{3,4}/);
      return m ? parseInt(m[0], 10) : NaN;
    }

    function parseCoord(val) {
      if (val === null || val === undefined || val === '') return NaN;
      const clean = String(val).trim().replace(',', '.');
      const m = clean.match(/-?\d+(?:\.\d+)?/);
      if (!m) return NaN;
      const num = parseFloat(m[0]);
      return (isNaN(num) || num === 0) ? NaN : num;
    }

    function getThumbnailUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
        if (/=[sw]\d+/i.test(url)) return url.replace(/=[sw]\d+[^?]*/i, '=s240');
        return url.includes('?') ? url + '&sz=s240' : url + '=s240';
      }
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=s240`;
      }
      return url;
    }

    function getFullImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('googleusercontent.com') || url.includes('ggpht.com')) {
        if (/=[sw]\d+/i.test(url)) return url.replace(/=[sw]\d+[^?]*/i, '=s0');
        return url;
      }
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/uc?id=${idMatch[1]}&export=view`;
      }
      return url;
    }

    function getCategoryClass(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('first')) return 'cat-firsts';
      if (c.includes('feat') || c.includes('engineer') || c.includes('tunnel') || c.includes('viaduct')) return 'cat-feats';
      if (c.includes('loco') || c.includes('works') || c.includes('shop') || c.includes('engine')) return 'cat-loco';
      if (c.includes('town') || c.includes('junction') || c.includes('depot')) return 'cat-towns';
      if (c.includes('disaster') || c.includes('accident') || c.includes('collision')) return 'cat-disasters';
      if (c.includes('decline') || c.includes('deregulat') || c.includes('privat')) return 'cat-decline';
      if (c.includes('scenic') || c.includes('tourism') || c.includes('preserv') || c.includes('heritage')) return 'cat-scenic';
      if (c.includes('commuter') || c.includes('suburban') || c.includes('electrif')) return 'cat-commuter';
      if (c.includes('line') || c.includes('corridor')) return 'cat-lines';
      return 'cat-feats';
    }

    function getCategoryIcon(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('first')) return '🥇';
      if (c.includes('feat') || c.includes('tunnel') || c.includes('viaduct')) return '🌉';
      if (c.includes('loco') || c.includes('works') || c.includes('engine')) return '🚂';
      if (c.includes('town') || c.includes('junction')) return '🏘️';
      if (c.includes('disaster') || c.includes('accident')) return '💥';
      if (c.includes('decline') || c.includes('deregulat')) return '📉';
      if (c.includes('scenic') || c.includes('tourism') || c.includes('heritage')) return '🎫';
      if (c.includes('commuter') || c.includes('suburban')) return '🚆';
      if (c.includes('line') || c.includes('corridor')) return '🛤️';
      return '📍';
    }

    window.stepHistory = function(delta) {
      if (!currentActiveEvents || currentActiveEvents.length === 0) return;
      let nextIdx = currentActiveIndex + delta;
      if (nextIdx < 0) nextIdx = 0;
      if (nextIdx >= currentActiveEvents.length) nextIdx = currentActiveEvents.length - 1;
      if (nextIdx === currentActiveIndex) return;

      currentActiveIndex = nextIdx;
      const targetEv = currentActiveEvents[nextIdx];
      if (targetEv && targetEv._marker) {
        markers.zoomToShowLayer(targetEv._marker, () => {
          const curZoom = map.getZoom();
          if (curZoom > CONSISTENT_EVENT_ZOOM || curZoom < 12) {
            map.setView([targetEv.latitude, targetEv.longitude], CONSISTENT_EVENT_ZOOM, { animate: true });
          } else {
            map.panTo([targetEv.latitude, targetEv.longitude]);
          }
          targetEv._marker.openPopup();
        });
      }
    };

    function renderDataset(items) {
      if (!markers) return;
      markers.clearLayers();

      const sortedItems = [...items].sort((a, b) => {
        if (a.year !== b.year) return (a.year || 0) - (b.year || 0);
        return String(a.date || '').localeCompare(String(b.date || ''));
      });

      currentActiveEvents = sortedItems;
      const totalCount = sortedItems.length;

      sortedItems.forEach((ev, i) => {
        ev._chronoIndex = i;
      });

      const markerList = [];
      const PROXIMITY_DEG = 0.025;
      const groups = [];

      sortedItems.forEach(ev => {
        let found = null;
        for (const grp of groups) {
          if (Math.abs(grp.lat - ev.latitude) < PROXIMITY_DEG && Math.abs(grp.lng - ev.longitude) < PROXIMITY_DEG) {
            found = grp;
            break;
          }
        }
        if (found) found.items.push(ev);
        else groups.push({ lat: ev.latitude, lng: ev.longitude, items: [ev] });
      });

      groups.forEach(grp => {
        grp.items.sort((a, b) => (a.year || 0) - (b.year || 0));

        grp.items.forEach((ev, idx) => {
          const safeYear = escapeHTML(ev.year || '');
          const safeDate = escapeHTML(ev.date || ev.year || '');
          const safeHeadline = escapeHTML(ev.headline || 'Railway Event');
          const safeLocation = escapeHTML(ev.location || '');
          const safeCategory = escapeHTML(ev.category || 'Railways');
          const safeDetails = escapeHTML(ev.details || '');
          
          const rawImg = (ev.image_url || '').trim();
          const hasImageLink = rawImg.length > 0 && rawImg !== '#';
          const safeThumbImg = hasImageLink ? escapeHTML(getThumbnailUrl(rawImg)) : '';
          const safeFullImg = hasImageLink ? escapeHTML(typeof getFullImageUrl === 'function' ? getFullImageUrl(rawImg) : rawImg) : '';

          const catClass = getCategoryClass(ev.category);
          const catIcon = getCategoryIcon(ev.category);

          const stemHeight = idx * 36;
          const totalIconHeight = 48 + stemHeight;

          const googleAiSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(ev.headline + ' ' + (ev.date || ev.year) + ' New Zealand')}`;

          let markerImgSrc = '';
          if (hasImageLink) {
            if (typeof window.resolveOfflineMedia === 'function') {
              markerImgSrc = window.resolveOfflineMedia(rawImg) || window.resolveOfflineMedia(ev.id) || '';
            }
            if (!markerImgSrc) {
              markerImgSrc = safeThumbImg;
            }
          }

          // ONLY display thumbnail box if an explicit image link exists in the data
          const markerHTML = `
            <div class="nz-train-marker ${catClass}">
              <div class="marker-pill">
                ${markerImgSrc ? `
                  <div class="marker-thumb-box">
                    <img class="marker-thumb-img" 
                         src="${markerImgSrc}" 
                         alt="" 
                         loading="lazy" 
                         onerror="this.parentElement.style.display='none';" />
                  </div>
                ` : ''}
                <div class="marker-text-block">
                  <div class="marker-header-row">
                    <span class="marker-date-tag">${catIcon} ${safeYear}</span>
                  </div>
                  <div class="marker-headline-text" title="${safeHeadline}">${safeHeadline}</div>
                </div>
              </div>
              <div class="marker-pin-tail"></div>
              ${stemHeight > 0 ? `<div class="marker-stem" style="height: ${stemHeight}px;"></div>` : ''}
            </div>
          `;

          const customIcon = L.divIcon({
            html: markerHTML,
            className: 'history-div-icon',
            iconSize: [240, totalIconHeight],
            iconAnchor: [120, totalIconHeight]
          });

          const popupImageBlock = hasImageLink ? `
            <a href="${safeFullImg}" target="_blank" rel="noopener noreferrer" class="history-card-img-wrap" title="Click to view full image">
              <img src="${safeThumbImg}" alt="${safeHeadline}" loading="lazy" onerror="this.onerror=null; this.parentElement.style.display='none';" />
              <div class="history-card-badge-row">
                <span class="category-pill">${safeCategory}</span>
                <span class="date-pill">${safeDate}</span>
              </div>
            </a>
          ` : `
            <div style="padding: 10px 12px 0; display: flex; gap: 6px;">
              <span class="category-pill">${safeCategory}</span>
              <span class="date-pill">${safeDate}</span>
            </div>
          `;

          const itemIndex = ev._chronoIndex;
          const isFirst = itemIndex === 0;
          const isLast = itemIndex === totalCount - 1;

          const popupHTML = `
            <div class="history-card">
              ${popupImageBlock}
              <div class="history-card-body">
                <div class="history-card-stepper">
                  <button type="button" class="btn-step-nav" onclick="window.stepHistory(-1); event.stopPropagation();" ${isFirst ? 'disabled' : ''} title="Previous event (earlier)">◀</button>
                  <span class="step-index-label">Milestone <strong>#${itemIndex + 1}</strong> of <strong>${totalCount}</strong></span>
                  <button type="button" class="btn-step-nav" onclick="window.stepHistory(1); event.stopPropagation();" ${isLast ? 'disabled' : ''} title="Next event (later)">▶</button>
                </div>

                <h3>${safeHeadline}</h3>
                <div class="history-card-meta">
                  <span>📍</span>
                  <span>${safeLocation}</span>
                </div>
                <p class="history-card-desc">${safeDetails}</p>
                <div class="history-card-footer">
                  <a href="${googleAiSearchUrl}" target="_blank" rel="noopener noreferrer" class="btn-google-ai">
                    <span>✨</span> Ask Google AI Overview ↗
                  </a>
                  ${ev.source_url && ev.source_url !== '#' ? `
                    <a href="${ev.source_url}" target="_blank" rel="noopener noreferrer" class="btn-source-archive">
                      <span>📖</span> Reference Link ↗
                    </a>
                  ` : ''}
                </div>
              </div>
            </div>
          `;

          const marker = L.marker([ev.latitude, ev.longitude], { icon: customIcon });
          ev._marker = marker;
          marker.bindPopup(popupHTML, { maxWidth: 390, autoPan: true, keepInView: true, closeOnClick: true });

          marker.on('popupopen', () => {
            currentActiveIndex = ev._chronoIndex;
          });

          markerList.push(marker);
        });
      });

      markers.addLayers(markerList);
      document.getElementById('itemCountBadge').textContent = `${totalCount} milestone${totalCount === 1 ? '' : 's'}`;
    }

    function filterEvents() {
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      const fill = document.getElementById('sliderTrackFill');
      const search = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();

      let minVal = parseInt(minSlider.value, 10);
      let maxVal = parseInt(maxSlider.value, 10);

      if (minVal > maxVal) {
        const tmp = minVal;
        minVal = maxVal;
        maxVal = tmp;
        minSlider.value = minVal;
        maxSlider.value = maxVal;
      }

      const span = (globalMaxYear - globalMinYear) || 1;
      const left = ((minVal - globalMinYear) / span) * 100;
      const right = ((maxVal - globalMinYear) / span) * 100;

      if (fill) {
        fill.style.left = left + '%';
        fill.style.width = (right - left) + '%';
      }

      document.getElementById('yearRangeText').textContent = `${minVal} – ${maxVal}`;

      const filtered = allEvents.filter(ev => {
        const inYear = ev.year >= minVal && ev.year <= maxVal;
        if (!inYear) return false;

        if (search) {
          const hay = `${ev.headline} ${ev.location} ${ev.details} ${ev.category} ${ev.date}`.toLowerCase();
          return hay.includes(search);
        }
        return true;
      });

      renderDataset(filtered);
    }

    function toggleTimelinePlayback() {
      const btn = document.getElementById('btnPlayTimeline');
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      if (timelineTimer) {
        clearInterval(timelineTimer);
        timelineTimer = null;
        btn.textContent = '▶';
        btn.classList.remove('playing');
      } else {
        btn.textContent = '⏸';
        btn.classList.add('playing');

        minSlider.value = globalMinYear;

        let currentMax = parseInt(maxSlider.value, 10);
        if (currentMax >= globalMaxYear || currentMax < 1880) {
          maxSlider.value = 1880;
        }
        filterEvents();

        timelineTimer = setInterval(() => {
          let curr = parseInt(maxSlider.value, 10);
          if (curr >= globalMaxYear) {
            toggleTimelinePlayback();
          } else {
            maxSlider.value = Math.min(globalMaxYear, curr + 3);
            filterEvents();
          }
        }, 250);
      }
    }

    function initSliders() {
      const years = allEvents.map(e => e.year).filter(y => !isNaN(y) && y > 0);
      if (years.length === 0) return;

      globalMinYear = Math.min(...years);
      globalMaxYear = Math.max(...years);

      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      minSlider.min = globalMinYear;
      minSlider.max = globalMaxYear;
      maxSlider.min = globalMinYear;
      maxSlider.max = globalMaxYear;

      minSlider.value = globalMinYear;
      maxSlider.value = globalMaxYear;

      filterEvents();
    }

    function getCol(row, aliases) {
      for (const key of Object.keys(row)) {
        const clean = key.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        for (const alias of aliases) {
          if (clean === alias) return String(row[key] || '').trim();
        }
      }
      return '';
    }

    function parseCSVData(csvString) {
      if (!csvString || csvString.trim().length === 0) return false;
      const parsed = Papa.parse(csvString, { header: true, skipEmptyLines: true });

      allEvents = (parsed.data || []).map(row => {
        let latStr = getCol(row, ['latitude', 'lat', 'latdeg', 'y']);
        let lngStr = getCol(row, ['longitude', 'lng', 'lon', 'long', 'x']);
        let yearStr = getCol(row, ['year', 'yr']);
        let dateStr = getCol(row, ['date', 'when', 'time']);

        let lat = parseCoord(latStr);
        let lng = parseCoord(lngStr);

        let parsedYear = parseYearNum(yearStr);
        if (isNaN(parsedYear) && dateStr) {
          parsedYear = parseYearNum(dateStr);
        }

        return {
          id: getCol(row, ['id', 'no', 'item']),
          year: isNaN(parsedYear) ? 0 : parsedYear,
          date: dateStr || String(parsedYear || ''),
          headline: getCol(row, ['headline', 'title', 'event', 'name']),
          category: getCol(row, ['category', 'type', 'era']) || 'Railways',
          location: getCol(row, ['location', 'place', 'station']),
          latitude: lat,
          longitude: lng,
          details: getCol(row, ['details', 'description', 'notes', 'summary']),
          image_url: getCol(row, ['imageurl', 'image', 'img', 'photo']),
          source_url: getCol(row, ['sourceurl', 'source', 'url', 'link']) || '#'
        };
      }).filter(e => !isNaN(e.latitude) && !isNaN(e.longitude) && e.latitude !== 0 && e.longitude !== 0);

      if (allEvents.length > 0) {
        initSliders();
        return true;
      }
      return false;
    }

    async function fetchFirstValidCsv(candidates) {
      for (const url of candidates) {
        if (!url) continue;
        try {
          const res = await fetch(url);
          if (res.ok) {
            const text = await res.text();
            if (text && text.trim().length > 50 && !text.trim().startsWith('<!DOCTYPE') && !text.trim().startsWith('<html')) {
              return text;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    async function loadDataset() {
      // 1. Instant Cache Check for instantaneous display
      try {
        const cached = localStorage.getItem(CACHE_STORAGE_KEY);
        if (cached && parseCSVData(cached)) {
          // Continue in background to refresh from disk or online
        }
      } catch (e) {}

      // 2. Comprehensive local offline & live online CSV candidates
      const candidateUrls = [
        '../data/trains.csv',
        './data/trains.csv',
        'data/trains.csv',
        './trains.csv',
        'trains.csv',
        '../data/trails.csv',
        './data/trails.csv',
        'trails.csv',
        LIVE_CSV_URL,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(LIVE_CSV_URL)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(LIVE_CSV_URL)}`
      ];

      const csvText = await fetchFirstValidCsv(candidateUrls);

      if (csvText && parseCSVData(csvText)) {
        try { localStorage.setItem(CACHE_STORAGE_KEY, csvText); } catch (e) {}
        return;
      }

      if (allEvents.length === 0) {
        document.getElementById('itemCountBadge').textContent = 'Offline';
        document.getElementById('yearRangeText').textContent = 'Data Offline';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMap();

      document.getElementById('minYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('maxYearSlider')?.addEventListener('input', filterEvents);
      document.getElementById('btnPlayTimeline')?.addEventListener('click', toggleTimelinePlayback);
      document.getElementById('btnToggleRailways')?.addEventListener('click', toggleRailwayOverlay);
      document.getElementById('btnToggleHistoric')?.addEventListener('click', toggleHistoricOverlay);

      document.getElementById('btnFitNZ')?.addEventListener('click', () => {
        if (markers && markers.getLayers().length > 0) {
          map.fitBounds(markers.getBounds(), { padding: [50, 50] });
        } else {
          map.setView(NZ_CENTER, NZ_ZOOM);
        }
      });

      const btnLayersToggle = document.getElementById('btnLayersToggle');
      const layerDropdownCard = document.getElementById('layerDropdownCard');
      btnLayersToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerDropdownCard?.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) {
          layerDropdownCard?.classList.remove('show');
        }
      });

      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerSat')?.addEventListener('click', () => setBasemap('sat'));
      document.getElementById('btnLayerStreet')?.addEventListener('click', () => setBasemap('street'));

      const searchInput = document.getElementById('mapSearchInput');
      const clearSearchBtn = document.getElementById('clearMapSearch');
      searchInput?.addEventListener('input', (e) => {
        clearSearchBtn.style.display = e.target.value ? 'block' : 'none';
        filterEvents();
      });
      clearSearchBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        filterEvents();
        searchInput.focus();
      });

      document.querySelectorAll('.era-chip').forEach(chip => {
        chip.addEventListener('click', function () {
          document.querySelectorAll('.era-chip').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('minYearSlider').value = this.dataset.min;
          document.getElementById('maxYearSlider').value = this.dataset.max;
          filterEvents();
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.key === 'ArrowLeft') {
          window.stepHistory(-1);
        } else if (e.key === 'ArrowRight') {
          window.stepHistory(1);
        }
      });

      loadDataset();
    });
  </script>
