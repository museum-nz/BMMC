<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Photo Map with Dual Year Slider — BMMC</title>

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com https://*.cartocdn.com https://*.dropboxusercontent.com https://*.dropbox.com https://server.arcgisonline.com https://*.arcgisonline.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org https://tile.openstreetmap.org;
    connect-src 'self' https://docs.google.com https://*.cartocdn.com https://server.arcgisonline.com https://*.arcgisonline.com https://*.google.com;
    font-src 'self' https://fonts.gstatic.com;
  ">

  <!-- Preconnect for Tile & Image Performance -->
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://mt0.google.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Leaflet CSS & Plugins -->
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.css" />
  <link rel="stylesheet" href="../vendor/leaflet/MarkerCluster.Default.css" />

  <!-- Master Unified Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #0f172a; 
      overflow: hidden;
    }
    #map { 
      width: 100vw; 
      height: 100vh; 
      background: #aad3df; 
    }
    .photo-card-large p {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: #0284c7;
      font-weight: 600;
    }
    .photo-card-large .img-container {
      width: 100%;
      height: 270px;
      border-radius: 10px;
      background: #f8fafc;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .photo-card-large .img-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .card-footer {
      margin-top: 12px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    @media (max-width: 768px) {
      .top-controls-bar {
        left: 50px;
        right: 10px;
        top: 10px;
      }
      .map-search-box { width: 130px; }
      .layer-dropdown-card {
        width: 260px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .year-slider-container {
        left: 50% !important;
        transform: translateX(-50%) !important;
        bottom: 15px !important;
        width: 90vw !important;
        max-width: 330px !important;
      }
      .leaflet-popup {
        position: fixed !important;
        bottom: 95px !important;
        left: 10px !important;
        top: auto !important;
        transform: none !important;
        margin: 0 !important;
        z-index: 1500 !important;
      }
      .leaflet-popup-content-wrapper {
        max-width: 84vw !important;
        border-radius: 12px;
      }
      .leaflet-popup-tip-container { display: none !important; }
      .leaflet-control-container .leaflet-control-attribution {
        font-size: 8px !important;
        transform: scale(0.8);
        transform-origin: bottom right;
      }
      .leaflet-control-zoom {
        transform: scale(0.8);
        transform-origin: top left;
      }
    }
  </style>
</head>
<body>

  <!-- Top Search & Layer Controls -->
  <div class="top-controls-bar">
    <!-- Universal Navigation Drawer Trigger (Hamburger) -->
    <button class="btn-bmmc-menu-trigger top-action-btn" title="Open Museum Wings Menu">
      <span class="text-sm leading-none">☰</span>
      <span class="hidden-xs">Wings</span>
    </button>

    <div class="map-search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="mapSearchInput" placeholder="Search map items..." aria-label="Search map artifacts">
      <button id="clearMapSearch" class="clear-search-btn" title="Clear Search">✕</button>
    </div>

    <!-- Base Layer Switcher Button -->
    <div class="layer-switcher-container">
      <button id="btnLayersToggle" class="top-action-btn" title="Change Map Basemap">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>Layers</span>
      </button>

      <div id="layerDropdownCard" class="layer-dropdown-card">
        <button id="btnLayerGoogle" class="layer-option-btn active" title="Google Maps (Streets)">
          <span class="icon">📍</span>
          <span>Google</span>
        </button>
        <button id="btnLayerHybrid" class="layer-option-btn" title="Google Satellite (Hybrid)">
          <span class="icon">🛰️</span>
          <span>Satellite</span>
        </button>
        <button id="btnLayerSatellite" class="layer-option-btn" title="Esri Satellite Imagery">
          <span class="icon">🌍</span>
          <span>Esri Sat</span>
        </button>
        <button id="btnLayerTopo" class="layer-option-btn" title="ESRI World Topographic Survey">
          <span class="icon">⛰️</span>
          <span>ESRI Topo</span>
        </button>
        <button id="btnLayerNatGeo" class="layer-option-btn" title="National Geographic Historical Survey Archive">
          <span class="icon">📜</span>
          <span>NatGeo Hist</span>
        </button>
        <button id="btnLayerVoyager" class="layer-option-btn" title="CARTO Voyager Basemap">
          <span class="icon">🗺️</span>
          <span>Voyager</span>
        </button>
      </div>
    </div>

    <button id="btnFitBounds" class="top-action-btn" title="Fit all visible items in view">
      <span>🧭</span> <span class="hidden-xs">Fit All</span>
    </button>

    <button id="btnResetView" class="top-action-btn" title="Reset map position & timeline">
      <span>↺</span> <span class="hidden-xs">Reset</span>
    </button>

    <button id="btnToggleFullscreen" class="top-action-btn" title="Toggle Fullscreen Mode">
      <span id="fullscreenIcon">⛶</span>
    </button>

    <a href="index.html" class="top-action-btn" title="Return to Main Museum">
      <span>🏛️</span> <span class="hidden-xs">Museum</span>
    </a>
  </div>

  <div id="map"></div>

  <!-- Bottom Timeline & Year Slider Panel -->
  <div class="year-slider-container">
    <div class="year-slider-header">
      <div class="timeline-title-group">
        <button id="btnPlayTimeline" class="btn-timeline-play" title="Play Timeline Time-Lapse" aria-label="Play timeline">▶</button>
        <span>Timeline</span>
        <span id="itemCountBadge" class="item-counter-badge">Loading...</span>
      </div>
      <span id="yearRangeText" class="range-text">Loading...</span>
    </div>
    <div class="dual-slider-track-wrapper">
      <div class="slider-track-bg"></div>
      <div class="slider-track-fill" id="sliderTrackFill"></div>
      <input type="range" id="minYearSlider" min="1800" max="2026" value="1800" step="1" aria-label="Minimum Year Filter">
      <input type="range" id="maxYearSlider" min="1800" max="2026" value="2026" step="1" aria-label="Maximum Year Filter">
    </div>
  </div>

  <!-- Universal BMMC Navigation Drawer Script -->
  <script src="shared-nav.js"></script>

  <!-- Leaflet & PapaParse CDN Libraries -->
  <script src="../vendor/leaflet/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="../vendor/leaflet/markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <script src="offline-adapter.js" onerror="this.onerror=null;"></script>

  <script>
    const CARTO_API_KEY = 'cb1_28sh_1_689e4b671faa6f5947798385'; 

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function sanitizeUrl(url) {
      if (!url) return '';
      const clean = String(url).trim();
      if (clean.startsWith('./media/') || clean.startsWith('media/')) return clean;
      if (clean.startsWith('data:image/svg+xml') || clean.startsWith('data:image/png') || clean.startsWith('data:image/jpeg') || clean.startsWith('data:image/webp')) return clean;
      if (/^https?:\/\//i.test(clean)) return clean;
      if (!clean.includes(':')) return clean.startsWith('./') ? clean : `https://${clean}`;
      return '';
    }

    let savedState = null;
    try {
      const rawState = sessionStorage.getItem('bMMC_map_view_state');
      if (rawState) savedState = JSON.parse(rawState);
    } catch (e) {}

    function saveMapViewState() {
      try {
        if (!map) return;
        const center = map.getCenter();
        const state = {
          lat: center.lat,
          lng: center.lng,
          zoom: map.getZoom(),
          basemap: currentBasemapKey,
          minYear: document.getElementById('minYearSlider')?.value,
          maxYear: document.getElementById('maxYearSlider')?.value,
          search: document.getElementById('mapSearchInput')?.value || ''
        };
        sessionStorage.setItem('bMMC_map_view_state', JSON.stringify(state));
      } catch (e) {}
    }

    function openItemInIndex(event, exhibitNum, title) {
      saveMapViewState();
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'BMMC_OPEN_ITEM',
            exhibit: exhibitNum,
            title: title
          }, '*');
          if (event) event.preventDefault();
          return;
        }
      } catch (e) {}

      window.location.href = `index.html#exhibit-${exhibitNum}`;
    }

    const IS_LOCAL_ENV = window.location.protocol === 'file:' || 
                         window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1';

    const REMOTE_CSV_URL = 'https://docs.google.com/spreadsheets/d/1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s/export?format=csv&gid=1146027655';
    const LOCAL_CSV_URL = './data/exhibits.csv';
    const CACHE_TTL_MS = 24 * 60 * 60 * 1000;
    const SVG_NO_IMG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2275%22%20height%3D%2275%22%3E%3Crect%20fill%3D%22%23e2e8f0%22%20width%3D%2275%22%20height%3D%2275%22%2F%3E%3Ctext%20fill%3D%22%2364748b%22%20font-size%3D%2210%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3ENo%20Img%3C%2Ftext%3E%3C%2Fsvg%3E';

    const isMobile = window.innerWidth <= 768;
    const defaultZoom = isMobile ? 2 : 3;
    const defaultCenter = [-10, 135];
    const worldBounds = [[-89, -180], [89, 180]];
    const TIMELINE_DEFAULT_START_YEAR = 1830;

    const initialCenter = (savedState && !isNaN(savedState.lat) && !isNaN(savedState.lng))
      ? [savedState.lat, savedState.lng]
      : defaultCenter;

    const initialZoom = (savedState && !isNaN(savedState.zoom))
      ? savedState.zoom
      : defaultZoom;

    const map = L.map('map', {
      closePopupOnClick: true,
      maxBounds: worldBounds,
      maxBoundsViscosity: 1.0,
      minZoom: 2,
      worldCopyJump: false
    }).setView(initialCenter, initialZoom);

    // Basemaps
    const layerGoogle = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      attribution: '&copy; Google Maps',
      maxZoom: 20,
      subdomains: ['0', '1', '2', '3'],
      noWrap: true
    });

    const layerHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      attribution: '&copy; Google Maps',
      maxZoom: 20,
      subdomains: ['0', '1', '2', '3'],
      noWrap: true
    });

    const layerEsriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Maxar, Earthstar, GIS Community',
      maxZoom: 18,
      noWrap: true
    });

    const layerEsriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Topographic Survey & GIS Community',
      maxZoom: 19,
      noWrap: true
    });

    const layerNatGeoHistory = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; National Geographic Historical Cartography',
      maxZoom: 16,
      noWrap: true
    });

    const cartoUrl = CARTO_API_KEY 
      ? `https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`
      : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

    const layerVoyager = L.tileLayer(cartoUrl, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19,
      subdomains: 'abcd',
      noWrap: true
    });

    const baseLayers = {
      google: layerGoogle,
      hybrid: layerHybrid,
      satellite: layerEsriSatellite,
      topo: layerEsriTopo,
      natgeo: layerNatGeoHistory,
      voyager: layerVoyager
    };

    let currentBasemapKey = (savedState && savedState.basemap && baseLayers[savedState.basemap]) ? savedState.basemap : 'google';
    baseLayers[currentBasemapKey].addTo(map);

    function setBasemap(type) {
      if (!baseLayers[type]) return;

      Object.values(baseLayers).forEach(layer => {
        if (map.hasLayer(layer)) map.removeLayer(layer);
      });

      baseLayers[type].addTo(map);
      currentBasemapKey = type;

      document.querySelectorAll('.layer-option-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id.toLowerCase() === `btnlayer${type.toLowerCase()}`);
      });

      document.getElementById('layerDropdownCard')?.classList.remove('show');
      saveMapViewState();
    }

    document.querySelectorAll('.layer-option-btn').forEach(btn => {
      btn.classList.toggle('active', btn.id.toLowerCase() === `btnlayer${currentBasemapKey.toLowerCase()}`);
    });

    map.on('moveend', saveMapViewState);
    map.on('zoomend', saveMapViewState);

    let markers = L.markerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      spiderfyDistanceMultiplier: isMobile ? 2.8 : 2.2,
      maxClusterRadius: isMobile ? 38 : 55,
      iconCreateFunction: function(cluster) {
        return L.divIcon({
          html: `<div class="cluster-number-badge">${cluster.getChildCount()}</div>`,
          className: 'custom-cluster-number-icon',
          iconSize: [46, 46],
          iconAnchor: [23, 23]
        });
      }
    });

    let heatLayer = null;
    let allPhotoRecords = [];
    let recordMarkerMap = new Map();
    let pendingExhibitToFocus = null;
    let isMapDataReady = false;
    let globalMinYear = 1800;
    let globalMaxYear = 2026;
    let timelinePlayTimer = null;

    function extractDriveId(url) {
      if (!url) return '';
      const match = String(url).trim().match(/(?:id=|\/d\/|thumbnail\?id=|googleusercontent\.com\/d\/)([a-zA-Z0-9_-]{15,})/);
      return (match && match[1]) ? match[1] : '';
    }

    function formatImgUrl(url) {
      if (!url) return '';
      const clean = String(url).trim();
      
      if (window.resolveOfflineMedia) {
        const local = window.resolveOfflineMedia(clean);
        if (local && (local.startsWith('./media/') || local.startsWith('media/'))) return sanitizeUrl(local);
      }

      if (clean.startsWith('data:image/') || clean.startsWith('./media/') || clean.startsWith('media/')) {
        return sanitizeUrl(clean);
      }

      if (clean.includes('dropbox.com')) {
        let dropboxUrl = clean.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
        if (!dropboxUrl.includes('raw=1')) dropboxUrl += (dropboxUrl.includes('?') ? '&raw=1' : '?raw=1');
        return sanitizeUrl(dropboxUrl);
      }

      const fileId = extractDriveId(clean);
      if (fileId) return sanitizeUrl(`https://lh3.googleusercontent.com/d/${fileId}=s150`);
      return sanitizeUrl(clean);
    }

    function parseCoord(val) {
      if (val === null || val === undefined || val === '') return NaN;
      const clean = String(val).trim().replace(',', '.');
      if (!/^-?\d+(\.\d+)?$/.test(clean)) return NaN;
      const num = parseFloat(clean);
      return isNaN(num) ? NaN : num;
    }

    function renderDataset(records) {
      markers.clearLayers();
      if (heatLayer) map.removeLayer(heatLayer);
      recordMarkerMap.clear();

      const heatPoints = [];
      const markerList = [];

      records.forEach(item => {
        heatPoints.push([item.lat, item.lng, 0.9]);

        const safeImgUrl = sanitizeUrl(item.imgUrl) || SVG_NO_IMG;
        const safeTitle = escapeHTML(item.title);
        const safeLocation = escapeHTML(item.location);
        const safeYear = escapeHTML(item.year && item.year !== '0' ? item.year : 'Prehistory');

        const customIconHTML = `<div class="single-photo-wrapper"><img src="${safeImgUrl}" loading="lazy" alt="${safeTitle || 'Photo'}" onerror="this.onerror=null; this.src='${SVG_NO_IMG}';"/></div>`;

        const photoIcon = L.divIcon({
          html: customIconHTML,
          className: 'custom-single-photo-icon',
          iconSize: [74, 74],
          iconAnchor: [37, 37]
        });

        const locationYearText = safeLocation 
          ? (safeYear ? `📍 ${safeLocation} &bull; ${safeYear}` : `📍 ${safeLocation}`)
          : (safeYear ? `📅 ${safeYear}` : '');

        const exhibitNum = (item.index !== undefined && item.index !== null) ? item.index : 0;
        const itemHref = `index.html#exhibit-${exhibitNum}`;

        const popupHTML = `
          <div class="photo-card-large">
            ${safeTitle ? `<h3>${safeTitle}</h3>` : ''}
            ${locationYearText ? `<p>${locationYearText}</p>` : ''}
            <div class="img-container">
              <img src="${safeImgUrl}" loading="lazy" alt="${safeTitle || 'Photo'}" onerror="this.onerror=null; this.src='${SVG_NO_IMG}';"/>
            </div>
            <div class="card-footer">
              <a href="${itemHref}" target="_top" class="view-item-btn" onclick="openItemInIndex(event, ${exhibitNum}, '${safeTitle.replace(/'/g, "\\'")}')">
                <span>🔍</span> View Item Details ↗
              </a>
            </div>
          </div>
        `;

        const marker = L.marker([item.lat, item.lng], { icon: photoIcon });
        marker.bindPopup(popupHTML, { autoPan: true, keepInView: true, autoClose: true });
        markerList.push(marker);

        recordMarkerMap.set(item.index, marker);
        recordMarkerMap.set(String(item.index), marker);
        recordMarkerMap.set(Number(item.index), marker);
        if (item.id) {
          recordMarkerMap.set(item.id, marker);
          recordMarkerMap.set(String(item.id), marker);
          const numId = parseInt(String(item.id).replace(/[^\d]/g, ''), 10);
          if (!isNaN(numId)) {
            recordMarkerMap.set(numId, marker);
            recordMarkerMap.set(String(numId), marker);
          }
        }
      });

      markers.addLayers(markerList);

      if (typeof L.heatLayer === 'function' && heatPoints.length > 0) {
        heatLayer = L.heatLayer(heatPoints, {
          radius: isMobile ? 22 : 30,
          blur: 16,
          maxZoom: 6,
          gradient: { 0.4: 'blue', 0.65: 'yellow', 1: 'red' }
        }).addTo(map);

        map.on('zoomend', function() {
          if (map.getZoom() >= 6) {
            if (map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
          } else {
            if (!map.hasLayer(heatLayer)) map.addLayer(heatLayer);
          }
        });
      }

      map.addLayer(markers);

      const countBadge = document.getElementById('itemCountBadge');
      if (countBadge) {
        countBadge.textContent = `${records.length} item${records.length === 1 ? '' : 's'}`;
      }
    }

    function initYearSliderUI() {
      const years = allPhotoRecords
        .map(r => parseInt(r.year, 10))
        .filter(y => !isNaN(y) && y > 1500 && y <= 2026);

      if (years.length > 0) {
        globalMinYear = Math.min(...years);
        globalMaxYear = Math.max(...years);
      } else {
        globalMinYear = 1800;
        globalMaxYear = 2026;
      }

      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');

      minSlider.min = globalMinYear;
      minSlider.max = globalMaxYear;

      maxSlider.min = globalMinYear;
      maxSlider.max = globalMaxYear;

      let restoredMin = globalMinYear;
      let restoredMax = globalMaxYear;

      if (savedState) {
        const sMin = parseInt(savedState.minYear, 10);
        const sMax = parseInt(savedState.maxYear, 10);
        if (!isNaN(sMin) && sMin >= globalMinYear && sMin <= globalMaxYear) restoredMin = sMin;
        if (!isNaN(sMax) && sMax >= globalMinYear && sMax <= globalMaxYear) restoredMax = sMax;
        if (restoredMin > restoredMax) {
          restoredMin = globalMinYear;
          restoredMax = globalMaxYear;
        }
      }

      minSlider.value = restoredMin;
      maxSlider.value = restoredMax;

      if (savedState && savedState.search) {
        const searchInput = document.getElementById('mapSearchInput');
        if (searchInput) {
          searchInput.value = savedState.search;
          document.getElementById('clearMapSearch').style.display = 'flex';
        }
      }

      isMapDataReady = true;

      updateYearFilter();
      handleInitialDeepLinks();

      if (pendingExhibitToFocus !== null) {
        const target = pendingExhibitToFocus;
        pendingExhibitToFocus = null;
        setTimeout(() => {
          focusExhibitMarker(target);
        }, 100);
      }

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'MAP_READY' }, '*');
        }
      } catch (e) {}
    }

    function updateYearFilter(evt) {
      const minSlider = document.getElementById('minYearSlider');
      const maxSlider = document.getElementById('maxYearSlider');
      const trackFill = document.getElementById('sliderTrackFill');
      const searchVal = (document.getElementById('mapSearchInput')?.value || '').trim().toLowerCase();

      let minVal = parseInt(minSlider.value, 10);
      let maxVal = parseInt(maxSlider.value, 10);

      if (minVal > maxVal) {
        if (evt && evt.target === minSlider) {
          minSlider.value = maxVal;
          minVal = maxVal;
        } else {
          maxSlider.value = minVal;
          maxVal = minVal;
        }
      }

      const minRange = parseInt(minSlider.min, 10);
      const maxRange = parseInt(minSlider.max, 10);
      const rangeSpan = (maxRange - minRange) || 1;

      const leftPercent = ((minVal - minRange) / rangeSpan) * 100;
      const rightPercent = ((maxVal - minRange) / rangeSpan) * 100;

      trackFill.style.left = leftPercent + '%';
      trackFill.style.width = (rightPercent - leftPercent) + '%';

      document.getElementById('yearRangeText').textContent = `${minVal} – ${maxVal}`;

      const filtered = allPhotoRecords.filter(item => {
        const y = parseInt(item.year, 10);
        const matchesYear = isNaN(y) || y <= 0 || (y >= minVal && y <= maxVal);
        if (!matchesYear) return false;

        if (searchVal) {
          const hay = `${item.title} ${item.location} ${item.year} ${item.id}`.toLowerCase();
          return hay.includes(searchVal);
        }
        return true;
      });

      renderDataset(filtered);
      saveMapViewState();
    }

    function toggleTimelinePlayback() {
      const playBtn = document.getElementById('btnPlayTimeline');
      const maxSlider = document.getElementById('maxYearSlider');

      if (timelinePlayTimer) {
        clearInterval(timelinePlayTimer);
        timelinePlayTimer = null;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        playBtn.title = 'Play Timeline Time-Lapse';
      } else {
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        playBtn.title = 'Pause Timeline';

        let startYear = Math.max(TIMELINE_DEFAULT_START_YEAR, globalMinYear);
        if (parseInt(maxSlider.value, 10) >= globalMaxYear || parseInt(maxSlider.value, 10) <= startYear) {
          maxSlider.value = startYear;
          updateYearFilter();
        }

        timelinePlayTimer = setInterval(() => {
          let curr = parseInt(maxSlider.value, 10);
          if (curr >= globalMaxYear) {
            toggleTimelinePlayback();
          } else {
            maxSlider.value = Math.min(globalMaxYear, curr + 2);
            updateYearFilter();
          }
        }, 350);
      }
    }

    function focusExhibitMarker(exhibitIdOrIndex) {
      if (!isMapDataReady || allPhotoRecords.length === 0) {
        pendingExhibitToFocus = exhibitIdOrIndex;
        return;
      }

      const searchInput = document.getElementById('mapSearchInput');
      if (searchInput && searchInput.value) {
        searchInput.value = '';
        const clearBtn = document.getElementById('clearMapSearch');
        if (clearBtn) clearBtn.style.display = 'none';
      }

      const record = allPhotoRecords.find(r => 
        r.index === Number(exhibitIdOrIndex) || 
        String(r.id) === String(exhibitIdOrIndex) || 
        String(r.index) === String(exhibitIdOrIndex) ||
        (r.id && exhibitIdOrIndex && String(r.id).replace(/[^\d]/g, '') === String(exhibitIdOrIndex).replace(/[^\d]/g, ''))
      );

      if (record && record.year) {
        const yr = parseInt(record.year, 10);
        if (!isNaN(yr) && yr > 0) {
          const minSlider = document.getElementById('minYearSlider');
          const maxSlider = document.getElementById('maxYearSlider');
          if (minSlider && maxSlider) {
            if (yr < parseInt(minSlider.value, 10)) minSlider.value = Math.max(globalMinYear, yr);
            if (yr > parseInt(maxSlider.value, 10)) maxSlider.value = Math.min(globalMaxYear, yr);
          }
        }
      }

      updateYearFilter();

      let marker = recordMarkerMap.get(Number(exhibitIdOrIndex)) || 
                   recordMarkerMap.get(String(exhibitIdOrIndex)) || 
                   recordMarkerMap.get(exhibitIdOrIndex);

      if (!marker && record) {
        marker = recordMarkerMap.get(record.index) || recordMarkerMap.get(record.id);
      }

      if (marker) {
        markers.zoomToShowLayer(marker, () => {
          marker.openPopup();
        });
        pendingExhibitToFocus = null;
      } else {
        pendingExhibitToFocus = exhibitIdOrIndex;
      }
    }

    function handleInitialDeepLinks() {
      try {
        const params = new URLSearchParams(window.location.search);
        const exhibit = params.get('exhibit') || params.get('id');
        const search = params.get('search');
        const lat = parseFloat(params.get('lat'));
        const lng = parseFloat(params.get('lng'));

        if (search) {
          const searchInput = document.getElementById('mapSearchInput');
          if (searchInput) {
            searchInput.value = search;
            document.getElementById('clearMapSearch').style.display = 'flex';
            updateYearFilter();
          }
        }

        if (!isNaN(lat) && !isNaN(lng)) {
          map.setView([lat, lng], 12);
        } else if (exhibit !== null && exhibit !== undefined) {
          focusExhibitMarker(exhibit);
        }
      } catch (e) {}
    }

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'FOCUS_EXHIBIT') {
        focusExhibitMarker(e.data.exhibit);
      } else if (e.data.type === 'FOCUS_COORDS' && !isNaN(e.data.lat) && !isNaN(e.data.lng)) {
        map.setView([e.data.lat, e.data.lng], e.data.zoom || 11);
      }
    });

    function fitAllMarkers() {
      if (markers && markers.getLayers().length > 0) {
        map.fitBounds(markers.getBounds(), { padding: [50, 50], maxZoom: 12 });
      } else {
        map.setView(defaultCenter, defaultZoom);
      }
    }

    function resetEntireMapView() {
      try { sessionStorage.removeItem('bMMC_map_view_state'); } catch (e) {}
      document.getElementById('minYearSlider').value = globalMinYear;
      document.getElementById('maxYearSlider').value = globalMaxYear;
      const searchInput = document.getElementById('mapSearchInput');
      if (searchInput) searchInput.value = '';
      document.getElementById('clearMapSearch').style.display = 'none';
      if (timelinePlayTimer) toggleTimelinePlayback();
      map.setView(defaultCenter, defaultZoom);
      setBasemap('google');
      updateYearFilter();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fullscreenIcon').textContent = '🗗';
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('fullscreenIcon').textContent = '⛶';
      }
    }

    function parseAndProcessDataset(rows) {
      if (!rows || rows.length < 2) return;

      let idIdx = 12, titleIdx = 2, imgIdx = 20, madeIdx = 23, yearIdx = 24, latIdx = 26, lngIdx = 27;

      if (rows[0]) {
        rows[0].forEach((col, idx) => {
          const c = String(col).toLowerCase().trim();
          if (c === '#' || c === 'id' || c === 'uid' || c === 'item id' || c === 'item_id' || c === 'no' || c === 'item' || c === 'item #') idIdx = idx;
          if (c === 'lat' || c === 'latitude' || c === 'lat_deg') latIdx = idx;
          if (c === 'lng' || c === 'lon' || c === 'long' || c === 'longitude') lngIdx = idx;
          if (c === 'img1' || c === 'image 1' || (c.includes('image') && !c.includes('2nd') && !c.includes('2'))) imgIdx = idx;
          if (c === 'title' || c === 'title details' || c === 'content') titleIdx = idx;
          if (c === 'made' || c.includes('origin') || c.includes('location')) madeIdx = idx;
          if (c === 'year' || c === 'date') yearIdx = idx;
        });
      }

      allPhotoRecords = [];

      rows.slice(1).forEach((row, rIdx) => {
        let idRaw = idIdx >= 0 ? row[idIdx] || '' : '';
        let latStr = latIdx >= 0 ? row[latIdx] || '' : '';
        let lngStr = lngIdx >= 0 ? row[lngIdx] || '' : '';
        let imgRaw = imgIdx >= 0 ? row[imgIdx] || '' : '';
        let titleRaw = titleIdx >= 0 ? row[titleIdx] || '' : '';
        let madeRaw = madeIdx >= 0 ? row[madeIdx] || '' : '';
        let yearRaw = yearIdx >= 0 ? row[yearIdx] || '' : '';

        if (!imgRaw || (!imgRaw.includes('http') && !imgRaw.includes('media/'))) {
          for (let i = 0; i < row.length; i++) {
            const v = String(row[i] || '').trim();
            if ((v.startsWith('http') || v.startsWith('media/') || v.startsWith('./media/')) && 
                (v.includes('drive.google') || v.includes('lh3.google') || v.includes('dropbox') || /\.(jpg|png|jpeg|webp)/i.test(v))) {
              imgRaw = v;
              break;
            }
          }
        }

        let lat = parseCoord(latStr);
        let lng = parseCoord(lngStr);

        if ((isNaN(lat) || isNaN(lng)) && String(latStr).includes(',')) {
          const parts = String(latStr).split(',');
          if (parts.length === 2) {
            const p1 = parseCoord(parts[0]);
            const p2 = parseCoord(parts[1]);
            if (!isNaN(p1) && !isNaN(p2)) {
              lat = p1;
              lng = p2;
            }
          }
        }

        if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

        let cleanTitle = String(titleRaw).trim();
        if (cleanTitle.includes('\n')) cleanTitle = cleanTitle.split('\n')[0];
        if (cleanTitle.includes('#')) cleanTitle = cleanTitle.split('#')[0];

        const imgUrl = (imgRaw ? formatImgUrl(imgRaw) : '') || SVG_NO_IMG;

        allPhotoRecords.push({
          id: String(idRaw).trim(),
          index: rIdx,
          lat: lat,
          lng: lng,
          title: cleanTitle.trim(),
          location: String(madeRaw).trim(),
          year: String(yearRaw).trim(),
          imgUrl: imgUrl
        });
      });

      initYearSliderUI();
    }

    async function loadMapData() {
      try {
        const cachedRaw = localStorage.getItem('bMMC_cached_exhibits_raw');
        const cachedParsed = localStorage.getItem('bMMC_cached_exhibits');
        const cacheTime = localStorage.getItem('bMMC_cached_exhibits_time');

        if (cachedParsed && cacheTime && (Date.now() - Number(cacheTime) < CACHE_TTL_MS)) {
          const parsed = JSON.parse(cachedParsed);
          if (Array.isArray(parsed) && parsed.length > 1 && Array.isArray(parsed[0])) {
            parseAndProcessDataset(parsed);
            return;
          }
        }

        if (cachedRaw && cacheTime && (Date.now() - Number(cacheTime) < CACHE_TTL_MS)) {
          const parsed = Papa.parse(cachedRaw, { header: false, skipEmptyLines: true });
          if (parsed.data && parsed.data.length > 1 && Array.isArray(parsed.data[0])) {
            parseAndProcessDataset(parsed.data);
            return;
          }
        }
      } catch (e) {}

      if (IS_LOCAL_ENV) {
        try {
          const localRes = await fetch(LOCAL_CSV_URL);
          if (localRes.ok) {
            const csvText = await localRes.text();
            const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
            if (parsed.data && parsed.data.length > 1 && Array.isArray(parsed.data[0])) {
              parseAndProcessDataset(parsed.data);
              return;
            }
          }
        } catch (e) {}
      }

      try {
        const res = await fetch(REMOTE_CSV_URL);
        if (res.ok) {
          const csvText = await res.text();
          const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
          if (parsed.data && parsed.data.length > 1 && Array.isArray(parsed.data[0])) {
            try {
              localStorage.setItem('bMMC_cached_exhibits_raw', csvText);
              localStorage.setItem('bMMC_cached_exhibits', JSON.stringify(parsed.data));
              localStorage.setItem('bMMC_cached_exhibits_time', Date.now());
            } catch (e) {}
            parseAndProcessDataset(parsed.data);
            return;
          }
        }
      } catch (e) {}

      try {
        const fallbackRes = await fetch(LOCAL_CSV_URL);
        if (fallbackRes.ok) {
          const csvText = await fallbackRes.text();
          const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
          if (parsed.data && parsed.data.length > 1 && Array.isArray(parsed.data[0])) {
            parseAndProcessDataset(parsed.data);
            return;
          }
        }
      } catch (e) {}

      document.getElementById('yearRangeText').textContent = 'Data offline';
      document.getElementById('itemCountBadge').textContent = 'Offline';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('minYearSlider')?.addEventListener('input', updateYearFilter);
      document.getElementById('maxYearSlider')?.addEventListener('input', updateYearFilter);

      document.getElementById('btnPlayTimeline')?.addEventListener('click', toggleTimelinePlayback);
      document.getElementById('btnFitBounds')?.addEventListener('click', fitAllMarkers);
      document.getElementById('btnResetView')?.addEventListener('click', resetEntireMapView);
      document.getElementById('btnToggleFullscreen')?.addEventListener('click', toggleFullscreen);

      const btnLayersToggle = document.getElementById('btnLayersToggle');
      const layerDropdownCard = document.getElementById('layerDropdownCard');

      btnLayersToggle?.addEventListener('click', (e) => {
        e.stopPropagation();
        layerDropdownCard?.classList.toggle('show');
      });

      document.getElementById('btnLayerGoogle')?.addEventListener('click', () => setBasemap('google'));
      document.getElementById('btnLayerHybrid')?.addEventListener('click', () => setBasemap('hybrid'));
      document.getElementById('btnLayerSatellite')?.addEventListener('click', () => setBasemap('satellite'));
      document.getElementById('btnLayerTopo')?.addEventListener('click', () => setBasemap('topo'));
      document.getElementById('btnLayerNatGeo')?.addEventListener('click', () => setBasemap('natgeo'));
      document.getElementById('btnLayerVoyager')?.addEventListener('click', () => setBasemap('voyager'));

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.layer-switcher-container')) {
          layerDropdownCard?.classList.remove('show');
        }
      });

      const searchInput = document.getElementById('mapSearchInput');
      const clearSearchBtn = document.getElementById('clearMapSearch');

      searchInput?.addEventListener('input', (e) => {
        clearSearchBtn.style.display = e.target.value ? 'flex' : 'none';
        updateYearFilter();
      });

      clearSearchBtn?.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        updateYearFilter();
        searchInput.focus();
      });

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') {
          if (e.key === 'Escape') {
            e.target.blur();
            map.closePopup();
          }
          return;
        }

        if (e.key === ' ') {
          e.preventDefault();
          toggleTimelinePlayback();
        } else if (e.key === 'Escape') {
          map.closePopup();
        } else if (e.key === 'ArrowRight') {
          const maxSlider = document.getElementById('maxYearSlider');
          maxSlider.value = Math.min(globalMaxYear, parseInt(maxSlider.value, 10) + (e.shiftKey ? 5 : 1));
          updateYearFilter();
        } else if (e.key === 'ArrowLeft') {
          const maxSlider = document.getElementById('maxYearSlider');
          maxSlider.value = Math.max(globalMinYear, parseInt(maxSlider.value, 10) - (e.shiftKey ? 5 : 1));
          updateYearFilter();
        }
      });

      loadMapData();
    });
  </script>
</body>
